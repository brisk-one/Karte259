<!doctype html>
<html lang="de" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Angriffsplaner · Welt 259</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23416729'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar" id="appbar"></header>
<!-- Zusatzfunktion: der Planer liegt verschlüsselt in zusatz.json (tools/zusatz_verschluesseln.js, Entscheidung Dennis
     03.11.2026). Diese Seite lädt ihn mit dem Schlüssel, der nach „Zusatzfunktionen freischalten“ im Browser liegt. -->
<main class="wrap">
  <section class="panel"><h2>Angriffsplaner</h2>
    <div class="body"><p class="empty" id="zusatz-msg">Lade …</p></div>
  </section>
</main>
<script src="app.js"></script>
<script>
buildAppbar("angriff", "Angriffsplaner");
(async function () {
  const msg = $("zusatz-msg"), z = zusatzSchluessel();
  if (!z) { msg.textContent = "Gesperrt. Oben „Zusatzfunktionen freischalten“ und das Passwort eingeben."; return; }
  let teile;
  try {
    const datei = await zusatzDatei();
    if (datei.salt !== z.salt) throw new Error("anderes Passwort");
    teile = JSON.parse(await zusatzEntschluesseln(z.k, datei.seiten.angriff));
  } catch (e) {
    zusatzSperren(); buildAppbar("angriff", "Angriffsplaner");
    msg.textContent = "Das Passwort hat sich geändert oder die Datei fehlt. Bitte oben neu freischalten.";
    return;
  }
  const st = document.createElement("style");
  st.textContent = teile.style;
  document.head.appendChild(st);
  document.querySelector("main").outerHTML = teile.html;
  teile.skripte.forEach(code => { const s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); });
})();
</script>
</body>
</html>
