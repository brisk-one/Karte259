<!doctype html>
<html lang="de" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Karte · Welt 259</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23416729'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
/* Nur was die Karte zusätzlich braucht. Farben und Formen kommen aus style.css. */
body{display:flex; flex-direction:column; overflow:hidden; background-attachment:scroll}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:5px 14px;
  padding:5px clamp(10px,3vw,18px); background:var(--panel); border-bottom:1px solid var(--edge-soft)}
#einst>.bar:last-child, .slim{border-bottom:1px solid var(--edge)}
/* Drei Zeilen mit Überschrift links: Dorffarbe, Kämpfe, Karte. Jede Zeile leicht abgesetzt. */
#einst>.bar+.bar{border-top:1px solid var(--edge-line)}
.kbar, .sbar{align-items:flex-end}
.vcat .grp{gap:5px}
.vcat .search{margin-bottom:0}
.menge{background:var(--panel-2) !important; overflow:hidden}
.menge>i{display:block; height:100%; background:#c62828}
.vcat>b.axlabel img{width:13px; height:13px}
.seg .opt button.tw.nav{padding-inline:7px; font-size:11px}
.slim{display:flex; align-items:center; gap:10px; padding:3px clamp(10px,3vw,18px); background:var(--panel); font-size:11.5px}
.slim .info{color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1}
.slim .info b{font-weight:700; color:var(--ink)}
.einklappen{margin-left:8px; align-self:center}
.zeitbadge{position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:8px;
  background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius); padding:4px 6px 4px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.4); font-size:12px; max-width:calc(100% - 20px)}
.zeitbadge b{font-weight:700}
.zeitbadge button{white-space:nowrap; flex:none}
.zeitbadge .s{color:var(--muted); font-size:11px}
.grp{display:inline-flex; align-items:center; gap:3px; flex-wrap:wrap}
.grp>b{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:2px}
button.tw.small{padding:2px 6px; font-size:11px}
/* Auswahl der Dorffarbe: Kategorien mit Überschrift, darin zusammenhängende Knopfreihen.
   Unter jedem Knopf ein Streifen mit seiner Farbskala. */
.vbar{align-items:flex-end; gap:6px 0; padding-block:5px 7px}
.vhead{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  line-height:1.2; align-self:center; margin-right:12px}
.vcat{display:flex; flex-wrap:wrap; align-items:flex-end; gap:4px 5px; padding:14px 12px 0; border-left:1px solid var(--edge-line);
  position:relative}
/* Überschrift absolut, damit sie nicht in die Breitenberechnung der Knopfreihe eingeht */
.vcat>b{position:absolute; top:0; left:12px; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); white-space:nowrap; line-height:1.3}
.seg{display:inline-flex}
.seg .opt{display:flex; flex-direction:column}
.seg .opt button.tw{border-radius:0; margin-left:-1px; white-space:nowrap; position:relative}
.seg .opt:first-child button.tw{margin-left:0; border-top-left-radius:var(--radius)}
.seg .opt:last-child button.tw{border-top-right-radius:var(--radius)}
.seg .opt button.tw[aria-pressed="true"]{z-index:1}
.seg .opt button.tw.neu{font-weight:600; font-size:10.5px; padding-inline:6px}
.scale{display:block; height:5px; border:1px solid var(--edge); border-top:0; margin-left:-1px}
.seg .opt:first-child .scale{margin-left:0; border-bottom-left-radius:var(--radius)}
.seg .opt:last-child .scale{border-bottom-right-radius:var(--radius)}
.seg .opt button[aria-pressed="true"]+.scale{box-shadow:0 2px 0 var(--accent)}
.vhead{min-width:58px}
.axlabel{display:inline-flex; align-items:center; gap:4px}
.axlabel img{width:18px; height:18px}
@media (max-width:640px){ .vhead{display:none} .vcat{padding:14px 6px 0} .vcat>b{left:6px} .seg{flex-wrap:wrap; row-gap:3px} }
.search{display:flex; gap:5px; align-items:center; position:relative}
.search input{width:min(220px,40vw)}
.sugg{position:absolute; z-index:20; top:100%; left:0; margin-top:2px; width:min(280px,62vw);
  background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 4px 14px rgba(0,0,0,.45); max-height:230px; overflow:auto}
.sugg div{padding:3px 8px; cursor:pointer; font-size:12px; display:flex; justify-content:space-between; gap:10px}
.sugg div:hover{background:var(--row-hover)}
.sugg .meta{color:var(--muted); font-size:11px}
.mark{display:inline-flex; align-items:center; gap:5px; padding:1px 6px; border:1px solid var(--edge);
  border-radius:var(--radius); background:var(--panel-2)}
.mark .tag{font-weight:700; font-size:12px}
.mark .meta{font-size:10.5px; color:var(--muted)}
.mark .dot{width:13px; height:13px; border:1px solid rgba(0,0,0,.45); display:inline-block}
.mark input[type="color"]{width:26px; height:20px; padding:0; border:1px solid var(--edge); background:none; cursor:pointer}
.stand{font-size:11.5px; color:var(--ink-2); margin-left:auto; text-align:right}
.stand b{font-weight:700}
.mainrow{flex:1; min-height:0; display:flex; position:relative}
.mapwrap{position:relative; flex:1; min-width:0; min-height:0; background:var(--map-bg); touch-action:none; cursor:default}
.mapwrap.drag{cursor:grabbing}
canvas{display:block; width:100%; height:100%; position:absolute; inset:0}
#ov{pointer-events:none}
.overlay{position:absolute; inset:auto 0 0 0; display:flex; flex-wrap:wrap; align-items:flex-end;
  justify-content:space-between; gap:8px; padding:9px 10px; pointer-events:none; z-index:3}
.legend{background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(0,0,0,.4); font-size:11.5px; max-width:min(470px,93vw); pointer-events:auto}
.legend summary{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--head-ink); background:var(--head); border-bottom:1px solid var(--edge-soft);
  padding:3px 8px; cursor:pointer; list-style-position:inside}
.legend:not([open]) summary{border-bottom:0}
.legend ul{margin:0; padding:6px 8px; list-style:none; display:flex; flex-wrap:wrap; gap:3px 12px}
.legend li{display:flex; align-items:center; gap:5px; white-space:nowrap}
.legend i{width:11px; height:11px; border:1px solid var(--map-edge); flex:none}
.legend .keys{border-top:1px solid var(--edge-line); padding:4px 8px 5px; color:var(--ink-2); margin:0;
  display:flex; flex-direction:column; gap:2px}
.legend .keys li{white-space:normal; align-items:flex-start}
.legend .keys .sym{flex:none; width:22px; display:inline-flex; justify-content:center; align-items:center; min-height:1.45em; font-size:9px}
.legend .keys .sym b{color:#00a844} .legend .keys .sym u{color:var(--bad); text-decoration:none}
.legend .keys .sym img{width:19px; height:19px}
.legend .keys .axe{display:inline-flex; align-items:center; gap:2px; margin-right:10px; white-space:nowrap}
.legend .keys .axe img{width:21px; height:21px}
.legend i.bonus{position:relative}
.legend i.bonus::after{content:""; position:absolute; left:1px; bottom:1px; width:4px; height:4px; background:#f2d16b;
  border:1px solid rgba(0,0,0,.65); transform:rotate(45deg)}
.legend .keys .raute{width:8px; height:8px; background:#f2d16b; border:1px solid rgba(0,0,0,.65); transform:rotate(45deg)}
.legend li.grenzen{white-space:normal; flex-basis:100%; color:var(--muted); font-size:10.5px}
.legend .keys .hint{color:var(--muted); font-size:10.5px; padding-left:27px}
/* Laufzeiten zwischen zwei angeklickten Dörfern, Aufbau wie die Legende */
.dist{background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(0,0,0,.4); font-size:11.5px; max-width:min(420px,93vw); pointer-events:auto}
.dist summary{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--head-ink); background:var(--head); border-bottom:1px solid var(--edge-soft);
  padding:3px 8px; cursor:pointer; list-style-position:inside}
.dist:not([open]) summary{border-bottom:0}
/* größere Klickfläche fürs Einklappen, × rechts im Kopf */
.legend summary,.dist summary{padding:5px 8px; position:relative}
.dist summary .dclose{position:absolute; right:3px; top:50%; transform:translateY(-50%); font:inherit; font-weight:700;
  font-size:14px; letter-spacing:0; cursor:pointer; background:none; color:inherit; border:0; width:24px; height:22px;
  border-radius:var(--radius)}
.dist summary .dclose:hover{background:rgba(255,255,255,.18)}
.kampf summary{padding-right:32px}
.dist .dbody{padding:5px 8px 6px; max-height:min(52vh,420px); overflow:auto}
.dist .pair{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; margin-bottom:4px}
.dist .pair b{font-weight:700}
.dist .pair .co{color:var(--muted)}
.dist .fields{font-weight:700; color:var(--accent-ink); background:var(--btn-on); border:1px solid var(--edge);
  border-radius:var(--radius); padding:0 5px}
.dist table{width:100%; border-collapse:collapse; font-size:11.5px}
.kampf .kb{border-top:1px solid var(--edge-line); padding:4px 0 5px}
.kampf .kb:first-child{border-top:0; padding-top:0}
.kampf .kb p{margin:1px 0}
.kampf .kb .zeit{color:var(--muted); font-size:10.5px}
.kampf .kb .ang,.kampf .kb .unt,.kampf .kb .ver{border-left:4px solid var(--c,#888); padding-left:5px}
.kampf .kb .s{color:var(--muted); font-size:10.5px}
.kampf .kb .fokus{background:var(--row-alt)}
.kampf details.dl{margin-top:3px}
.kampf details.dl summary{font-size:11px; cursor:pointer; color:var(--ink-2)}
.kampf .dorf{display:flex; gap:8px; justify-content:space-between; padding:1px 2px; cursor:pointer; font-variant-numeric:tabular-nums}
.kampf .dorf:hover{background:var(--row-hover)}
.kampf .dorf .s{white-space:nowrap}
/* Zeichen der Kampfart, gleiche Bilder wie auf der Karte */
.kart img{width:16px; height:16px; vertical-align:-3px; margin-right:3px}
.tip .kz{padding:3px 9px; white-space:normal; max-width:360px; line-height:1.35}
.tip .kz b{font-weight:700}
.tip .row .nm{display:inline-flex; align-items:center; gap:4px}
.tip .dot,.kriege .dot{display:inline-block; width:9px; height:9px; border:1px solid rgba(0,0,0,.5); flex:none}
.tip .hl{padding:2px 9px 4px; font-size:10.5px; color:var(--muted); white-space:normal; max-width:360px}
/* Kriegsübersicht rechts neben der Karte, auf schmalen Schirmen als Schublade über der Karte */
.kriege{width:360px; flex:none; overflow:auto; background:var(--panel-solid); border-left:1px solid var(--edge);
  font-size:12px}
.kriege[hidden]{display:none}
.kriege .kh{position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--head-ink);
  background:var(--head); border-bottom:1px solid var(--edge-soft); padding:4px 4px 4px 10px}
.kriege .kh button{font:inherit; font-weight:700; font-size:14px; cursor:pointer; background:none; color:inherit;
  border:0; width:22px; height:22px; border-radius:var(--radius)}
.kriege .regel{color:var(--muted); font-size:10.5px; padding:6px 10px; margin:0; line-height:1.35; border-bottom:1px solid var(--edge-line)}
.kriege .kr{padding:7px 10px 8px; border-bottom:1px solid var(--edge-line)}
.kriege .kr.sel{background:var(--row-alt)}
.kriege .kt{display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:700; font-size:13px}
.kriege .kt:hover .vs{text-decoration:underline}
.kriege .badge{font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:1px 5px;
  border-radius:var(--radius); border:1px solid var(--edge); margin-left:auto; white-space:nowrap}
.kriege .badge.beginn{background:#ffd600; color:#3a2a00; border-color:#8a6d00}
.kriege .badge.krieg{background:#b71c1c; color:#fff; border-color:#5d0b0b}
.kriege .meta{color:var(--ink-2); font-size:11px; margin:2px 0 4px}
.kriege .ruhe{color:var(--muted)}
.kriege .spark{display:flex; align-items:center; gap:1px; height:34px; margin:3px 0 5px}
.kriege .spark i{flex:1; display:flex; flex-direction:column; justify-content:center; height:100%; min-width:2px; max-width:9px}
.kriege .spark i b,.kriege .spark i u{display:block; text-decoration:none}
.kriege .seite{display:flex; justify-content:space-between; gap:8px; font-size:11.5px; padding:1px 0}
.kriege .seite.s{color:var(--muted); font-size:10.5px; padding:0 0 2px 13px}
.kriege details{margin-top:3px}
.kriege details summary{cursor:pointer; font-size:11px; color:var(--ink-2)}
.kriege .sec{padding:4px 0 1px; font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); border-top:1px solid var(--edge-soft); margin-top:3px}
.kriege .li{display:flex; justify-content:space-between; gap:8px; padding:1px 0}
.kriege .li span:last-child{font-variant-numeric:tabular-nums; white-space:nowrap}
@media (max-width:900px){ .kriege{position:absolute; right:0; top:0; bottom:0; z-index:6; width:min(360px,92vw);
  box-shadow:-4px 0 14px rgba(0,0,0,.45)} }
.dist th,.dist td{padding:1.5px 5px; text-align:right; white-space:nowrap}
.dist th{font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:700;
  border-bottom:1px solid var(--edge-line); background:none}
.dist td:first-child,.dist th:first-child{text-align:left; white-space:normal}
.dist tbody tr:nth-child(even){background:var(--row-alt)}
.dist tbody tr.slow td{border-top:1px solid var(--edge-line)}
.dist .u{display:inline-block}
.dist .t{font-variant-numeric:tabular-nums; font-weight:700}
.dist .arr{font-variant-numeric:tabular-nums; color:var(--ink-2)}
.dist .moon{color:#6f8fd0}
.dist .note{color:var(--muted); font-size:10.5px; margin:5px 0 0; line-height:1.35}
/* Spieler-Details per Doppelklick: eigener Schließen-Knopf im Kopf statt Aufklapp-Dreieck,
   deshalb ein normales div statt details/summary wie bei Legende und Laufzeit. */
.pdet{background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(0,0,0,.4); font-size:11.5px; max-width:min(380px,93vw); pointer-events:auto}
.pdet .ph{display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--head-ink); background:var(--head); border-bottom:1px solid var(--edge-soft); padding:3px 4px 3px 8px}
.pdet .ph button{font:inherit; font-weight:700; font-size:14px; cursor:pointer; background:none; color:inherit;
  border:0; width:22px; height:22px; border-radius:var(--radius)}
.pdet .ph button:hover{background:rgba(255,255,255,.18)}
.pdet .pb{padding:5px 8px 7px; max-height:min(58vh,440px); overflow:auto}
.pdet .stufe{display:inline-block; font-weight:700; padding:1px 7px; border-radius:var(--radius);
  background:var(--btn-on); color:var(--accent-ink); border:1px solid var(--edge)}
.pdet .zeile{display:flex; justify-content:space-between; gap:12px; padding:1.5px 0}
.pdet .zeile.aus{color:var(--muted)}
.pdet .sec{padding:4px 0 1px; font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); border-top:1px solid var(--edge-soft); margin-top:3px}
.zoom{display:flex; gap:5px; pointer-events:auto}
.zoom button{font:inherit; font-weight:700; font-size:15px; width:32px; height:32px; cursor:pointer;
  background:var(--btn); color:var(--ink); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:var(--shine)}
/* Aufbau wie das Kontextmenü im Spiel: schmaler Rahmen, Titelbalken, links die Bezeichnung,
   rechts der Wert, Zeilen abwechselnd hinterlegt. */
.tip{position:absolute; z-index:5; pointer-events:none; display:none; width:max-content; max-width:min(380px,92vw);
  background:var(--panel-solid); color:var(--ink); border:1px solid var(--edge); border-radius:var(--radius);
  padding:0 0 3px; font-size:12px; line-height:1.4; box-shadow:0 4px 16px rgba(0,0,0,.5)}
[data-theme="classic"] .tip{border-width:2px; border-color:#3f2100}
.tip .th{background:var(--head); border-bottom:1px solid var(--edge); padding:3px 9px; font-weight:700;
  color:var(--head-ink)}
.tip .th span{font-weight:400; opacity:.85}
.tip .sec{padding:3px 9px 1px; font-size:9.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); border-top:1px solid var(--edge-soft); margin-top:2px}
.tip .row{display:flex; gap:20px; justify-content:space-between; padding:1.5px 9px; white-space:nowrap}
.tip .row:nth-of-type(even){background:var(--row-alt)}
.tip .row>span:last-child{font-weight:600}
.tip .k{color:var(--muted); font-weight:400}
.tip .up{color:var(--good); font-weight:700} .tip .down{color:var(--bad); font-weight:700} .tip .na{color:var(--muted)}
/* Die Zeile, nach der die Karte gerade eingefärbt ist, trägt dieselbe Farbe wie der gedrückte Knopf. */
.tip .row.cur{background:var(--btn-on); color:var(--accent-ink); box-shadow:inset 3px 0 0 var(--edge)}
.tip .row.cur .k, .tip .row.cur .up, .tip .row.cur .down, .tip .row.cur .na{color:inherit}
.tip .row.cur .k{font-weight:700}
.tip .row.cur .k::before{content:"▶ "; font-size:.8em}
.msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--ink); background:var(--panel-solid); opacity:.94; font-size:13px; padding:24px; z-index:4}
@media (max-width:640px){ .stand{width:100%; text-align:left; margin-left:0} .legend{font-size:11px}
  .zeitbadge .s{display:none}
  .dist .dbody{max-height:34vh} .dist .note{display:none} }
</style>
</head>
<body>
<header class="appbar" id="appbar"></header>

<!-- Einstellungen in drei Zeilen: Dorffarbe, Kämpfe, Karte. Einklappbar (Dennis 29.10.2026), dann zeigt
     eine schmale Zeile die Auswahl in Kurzform. -->
<div class="bar slim" id="slim" hidden>
  <button class="tw small" type="button" id="ausklappen" aria-expanded="false" aria-controls="einst">&#9662; Einstellungen</button>
  <span class="info" id="slim-info"></span>
</div>
<div id="einst">
<!-- Eine einzige Auswahl für die Dorffarbe: alle Knöpfe gehören zu einer Gruppe, genau einer ist gedrückt.
     Der Farbstreifen unter jedem Knopf zeigt die Skala, die er auf die Karte legt. -->
<div class="bar vbar" id="views" role="group" aria-label="Dorffarbe nach">
  <span class="vhead">Dorffarbe<br>nach</span>
  <div class="vcat"><b>Stamm</b>
    <div class="seg"><span class="opt"><button class="tw" type="button" data-v="tribes" aria-pressed="true">Stämme</button><i class="scale" data-scale="tribes"></i></span></div>
  </div>
  <div class="vcat"><b>Punktezuwachs</b>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="d1h">1 h</button><i class="scale" data-scale="growth"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="d12h">12 h</button><i class="scale" data-scale="growth"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="d24h">24 h</button><i class="scale" data-scale="growth"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="d7d">7 Tage</button><i class="scale" data-scale="growth"></i></span>
    </div>
  </div>
  <div class="vcat"><b>Besiegte Gegner</b>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="bash_all">Gesamt</button><i class="scale" data-scale="bash_all"></i></span>
    </div>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="bash_att">Off</button><i class="scale" data-scale="bash_att"></i></span>
      <span class="opt"><button class="tw neu" type="button" data-v="bash_att_new">+ 24 h</button><i class="scale" data-scale="bash_att"></i></span>
    </div>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="bash_def">Deff</button><i class="scale" data-scale="bash_def"></i></span>
      <span class="opt"><button class="tw neu" type="button" data-v="bash_def_new">+ 24 h</button><i class="scale" data-scale="bash_def"></i></span>
    </div>
    <div class="seg">

const C_LOSS="#37474f";              // Verlust dunkelgrau, damit er sich von der Pink-Skala abhebt

// Stufen des prozentualen Punktzuwachses, hergeleitet aus der gemessenen Verteilung vom 12.09.2026:
// über 1 h wachsen 11,4 % der Spieler überhaupt, über 24 h rund 39 %.

// Grau heißt überall kein Wert.
const GROWTH_COLORS=["#f8bbd0","#f48fb1","#ec407a","#c2185b","#6d0e3f"];
const BASH_COLORS=["#00c853","#aeea00","#ffd600","#ff6d00","#e53935","#7f0000"];
const RANK_SCALE=["#b3e5fc","#4fc3f7","#1e88e5","#283593","#6a1b9a","#b000ff"];
const STEPS={ d1h:[1,2,3,5], d12h:[3,6,10,18], d24h:[5,10,15,25], d7d:[10,20,35,60] };
const VIEW_LABEL={ d1h:"1 Stunde", d12h:"12 Stunden", d24h:"24 Stunden", d7d:"7 Tage" };
// Besiegte Gegner, Farben aus BASH_COLORS. Die fünf Grenzen je Ansicht berechnet der Seitenbau bei jedem Lauf
// aus der aktuellen Verteilung der Spieler mit Wert > 0 (p50, p75, p90, p97, p99, gerundet auf 1, 2, 5 × 10^n;
// Entscheidung 8.2b vom 29.10.2026), siehe players.json "bash_steps". Die festen Stufen vom 15.09. endeten bei 15.000.
const BASH_ART={ all:"insgesamt", att:"als Angreifer (Off)", def:"als Verteidiger (Deff)", sup:"als Unterstützer" };
const BASH={
  bash_all:    { art:"all", neu:false },

/** Grenzen der Ansicht v (fünf Zahlen) oder null, wenn es keinen Wert über 0 gibt. */
function bashSteps(v){
  const cfg=BASH[v||view], st=(P&&P.bash_steps)||{};
  return (cfg.neu? st[bashWindow()+"_"+cfg.art] : st[cfg.art]) || null;
}
// Spielernamen über dem Schwerpunkt ihrer Dörfer in den Bash-Ansichten: ab Rot (über p97), per Schalter ab Gelb (über p75)
const NAME_AB_ROT=4, NAME_AB_GELB=2;
let namesFrom=NAME_AB_GELB;          // Standard ab Gelb, „Weniger Spielernamen anzeigen“ ab Rot (Dennis 29.10.2026)
// Gekreuzte Äxte als Kampfsymbol (Kämpfe auf der Karte, 29.10.2026). Die Äxte an einzelnen Dörfern vom
// 15.09. entfallen; Farben bleiben für die kleinen Bilder in Legende und Knopfleiste.
const AXE_COLORS=["#00c853","#ffd600","#e53935"];
// Kämpfe aus data/kampf.json (collector/kampf.py): unter KAMPF_ZOOM ein Symbol je Kampfgebiet (Kämpfe
// innerhalb KAMPF_GEBIET Feldern zusammengefasst), ab KAMPF_ZOOM Pfeile vom Angreifer und vom Unterstützer
// zum Ziel. Pfeile in der Stammesfarbe des Handelnden, die Art an Form und Zeichen (Dennis 1a, 29.10.2026):
// Angriff durchgezogen mit spitzer Spitze und Schwertern, Unterstützung gestrichelt mit runder Spitze und
// Schild, „möglich“ halb durchsichtig. Rot und Hellblau als feste Pfeilfarben wurden mit Stämmen verwechselt.
const KAMPF_ZOOM=6, KAMPF_GEBIET=15;
const PFEIL_MOEGLICH=0.5;
const SICHER={w:"wahrscheinlich", m:"möglich", u:"unklar"};
const BASH_WINDOWS=["3h","6h","12h","24h"];
let axWin="24h";                     // Zeitraum für Äxte und die Ansichten "+ …"
// Ausbaustufen wie im Hilfe-Wiki: 26 bis 299, 300 bis 999, 1.000 bis 2.999, 3.000 bis 8.999,
// 9.000 bis 10.999, ab 11.000. Die Zeichnung ist eine eigene, schlichte Nachbildung.
const STAGE_STEPS=[300,1000,3000,9000,11000];
const stageOf = pts => { let s=0; while(s<STAGE_STEPS.length && pts>=STAGE_STEPS[s]) s++; return s; };
let shape="quad";
// Ranglisten "An einem Tag": Farbe nach Weltrang, Stufen wie im Artefakt vom 11.09.2026
const RANK_STEPS=[10,50,100,500,2500];
// Platz 1 bis 10 zuerst, deshalb die Skala umgedreht: vorne lila, "dahinter" hellblau
const RANK_COLORS=RANK_SCALE.slice().reverse();
const INADAY_LABEL={ loot_res:"Rohstoffe geplündert", scavenge:"Rohstoffe gesammelt", loot_vil:"Dörfer geplündert",
                     kill_att:"Bash Angriff", kill_def:"Bash Verteidigung", kill_sup:"Bash Unterstützung",
                     conquer:"Dörfer erobert" };
// kurze Fassung für die Detailinfo, damit jede Zeile einzeilig bleibt
const INADAY_SHORT={ loot_res:"Rohst. gepl.", scavenge:"Rohst. ges.", loot_vil:"Dörfer gepl.",
                     kill_att:"Bash Angriff", kill_def:"Bash Vert.", kill_sup:"Bash Unt.", conquer:"Erobert" };
// Erfahrungs-Score (Dennis 11.10.2026, E12 bis E14): Stufennamen kommen aus erfahrung.json, dieser
// Fallback greift nur, falls die Datei einmal fehlt.
const STUFE_FALLBACK=["Rekrut","Phalanx-Krieger","Hauptmann","Spartiat","Kriegsherr","Unsterblicher"];
const TITEL_FELD={kill_def:"t_def", kill_att:"t_att", loot_res:"t_res", scavenge:"t_sam", loot_vil:"t_vil", conquer:"t_con"};
// Generische Rückgängig-Funktion über alle Darstellungen hinweg (Wunsch Dennis 10.10.): jede Funktion,
// die Auswahl oder Darstellung ändert, legt vor der Änderung ihre Umkehrung hier ab.
let undoStack=[];
function pushUndo(fn){ undoStack.push(fn); if(undoStack.length>20) undoStack.shift(); updateUndoBtn(); }
function doUndo(){ const fn=undoStack.pop(); updateUndoBtn(); if(fn) fn(); }
function updateUndoBtn(){ const b=$("undo"); if(b) b.disabled=!undoStack.length; }
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  const v=n=>cs.getPropertyValue(n).trim();
  GRASS=v("--map-bg"); GRID=v("--map-grid"); GRID_MAJOR=v("--map-grid-major"); LABEL=v("--map-label");
  C_BARB=v("--map-barb"); C_BONUS=C_BARB;          // Bonusdörfer tragen ein Zeichen, keine eigene Farbe
  C_OTHER=v("--map-other"); C_NONE=v("--map-none"); EDGE=v("--map-edge");
  TRIBE_COLORS[0]=v("--map-tribe-1")||TRIBE_COLORS[0];
}
readColors();
const isGrowth = v => !!STEPS[v];
const isRank = v => v==="loot_res" || v==="scavenge" || v==="loot_vil";

const cv=$("c"), ctx=cv.getContext("2d", {alpha:false});
const ov=$("ov"), octx=ov.getContext("2d");
const wrap=$("mapwrap"), tip=$("tip");
let W=0, H=0, dpr=1;
let V=null, P=null, A=null, T=null, UNITS=null, ERF=null;
const dtfTag=new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin", weekday:"short", day:"2-digit", month:"2-digit"});
let N=0, vx=null, vy=null, vp=null, vpts=null, vb=null, vname=null, byXY=null;
let bashTier=null, pSumX=null, pSumY=null, pCount=null;
let KAMPF=null, kF={}, rowOfPid=new Map(), kampfGebiete=[], kampfSel=[], kampfHits=[];
let kampfPfeile=[], pfeilHover=null, pfeilFix=null;     // Fokus: {r: Kampfzeile, art: "a"|"u", u: Unterstützer}
let KRIEG=null, kriegOffen=false, kriegSel=null;        // kriegSel: [Stamm, Stamm] hebt deren Kämpfe hervor
let pIdx={}, aIdx={}, allyOf=null, growth={}, arrowOf=null, refs={}, tagOf=new Map(), allyById=new Map();
let tribeColor=new Map(), tribeList=[], marks=new Map();   // selbst markierte Stämme: id -> Farbe
let inaday=new Map();                                      // player_id -> {typ: {rank, value, date}}
let rankOf={};                                             // Spielerzeile -> Weltrang in der aktiven Rangliste
let buckets=[], colorList=[];
let view="tribes", scale=2, cx=500, cy=500, hover=-1, marked=null;
let userView=false, initDone=false;
const ownView = () => { userView=true; };

/* ---------- Ansicht und Umrechnung ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 2);
  const r=wrap.getBoundingClientRect();
  W=Math.max(1, Math.round(r.width)); H=Math.max(1, Math.round(r.height));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ov.width=cv.width; ov.height=cv.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  octx.setTransform(dpr,0,0,dpr,0,0);
  if(!userView && N) fitWorld();
  draw();
}
const sx = x => (x - cx) * scale + W/2;
const sy = y => (y - cy) * scale + H/2;
const wxAt = px => (px - W/2) / scale + cx;
const wyAt = py => (py - H/2) / scale + cy;

function clampView(){
  scale=Math.min(28, Math.max(0.35, scale));
  cx=Math.min(1000, Math.max(0, cx)); cy=Math.min(1000, Math.max(0, cy));
}
function fitWorld(){
  if(!N){ scale=Math.min(W,H)/1000; cx=cy=500; return; }
  let x0=1000,y0=1000,x1=0,y1=0;
  for(let i=0;i<N;i++){ if(vx[i]<x0)x0=vx[i]; if(vx[i]>x1)x1=vx[i]; if(vy[i]<y0)y0=vy[i]; if(vy[i]>y1)y1=vy[i]; }
  const pad=6;
  scale=Math.min(W/(x1-x0+2*pad), H/(y1-y0+2*pad));
  cx=(x0+x1)/2; cy=(y0+y1)/2; clampView();
}
function zoomAt(px, py, factor){
  ownView();
  const wx=wxAt(px), wy=wyAt(py);
  scale*=factor; clampView();
  cx=wx-(px-W/2)/scale; cy=wy-(py-H/2)/scale; clampView(); draw(); saveUrl();
}

/* ---------- Zeichnen ---------- */
function drawGrid(){
  ctx.lineWidth=1;
  const sets = scale>=6 ? [[10,GRID],[100,GRID_MAJOR]] : [[100,GRID_MAJOR]];
  for(const [s,color] of sets){
    ctx.strokeStyle=color;
    ctx.beginPath();
    const x0=Math.floor(wxAt(0)/s)*s, x1=wxAt(W), y0=Math.floor(wyAt(0)/s)*s, y1=wyAt(H);
    for(let x=x0;x<=x1;x+=s){ const p=Math.round(sx(x))+.5; ctx.moveTo(p,0); ctx.lineTo(p,H); }
    for(let y=y0;y<=y1;y+=s){ const p=Math.round(sy(y))+.5; ctx.moveTo(0,p); ctx.lineTo(W,p); }
    ctx.stroke();
  }
  ctx.fillStyle=LABEL; ctx.textBaseline="top";
  ctx.font="700 13px Verdana,Geneva,sans-serif"; ctx.textAlign="left";
  const kx0=Math.max(0,Math.floor(wxAt(0)/100)), kx1=Math.min(9,Math.floor(wxAt(W)/100));
  const ky0=Math.max(0,Math.floor(wyAt(0)/100)), ky1=Math.min(9,Math.floor(wyAt(H)/100));
  for(let ky=ky0;ky<=ky1;ky++) for(let kx=kx0;kx<=kx1;kx++){
    const px=Math.min(Math.max(3, sx(kx*100)+5), sx((kx+1)*100)-28);
    const py=Math.min(Math.max(3, sy(ky*100)+3), sy((ky+1)*100)-16);
    if(px<W-26 && py<H-16 && px>-20 && py>-14) ctx.fillText("K"+ky+""+kx, px, py);
  }
  if(scale>=6){
    ctx.font="11px Verdana,Geneva,sans-serif"; ctx.fillStyle="rgba(0,0,0,.62)";
    const x0=Math.ceil(wxAt(0)/10)*10, y0=Math.ceil(wyAt(0)/10)*10;
    ctx.textAlign="center";
    for(let x=x0;x<wxAt(W);x+=10) ctx.fillText(String(x), sx(x)+scale/2, 3);
    ctx.textAlign="left";
    for(let y=y0;y<wyAt(H);y+=10) ctx.fillText(String(y), 3, sy(y)+scale/2-6);
  }
}



/** Dorfbild statt Quadrat, angelehnt an die sechs Ausbaustufen im Hilfe-Wiki.
    Eigene Zeichnung, keine Grafiken aus dem Spiel:
    0 einzelne Hütten, 1 Weiler mit Zaun, 2 geschlossener Wall, 3 Wall mit Toren,
    4 eckige Mauer mit Ecktürmen, 5 Festung mit Türmen und Bergfried. */
function drawVillage(cx2, cy2, r, farbe, stufe){
  const dunkel="rgba(0,0,0,.66)", hell="rgba(255,255,255,.42)";
  ctx.lineWidth=Math.max(.7, r*0.15);

  if(stufe===0){                                   // zwei kleine Hütten
    ctx.fillStyle=farbe; ctx.strokeStyle=dunkel;
    for(const [dx,dy,sk] of [[-r*.34,r*.12,.72],[r*.3,-r*.06,.92]]){
      const h=r*.62*sk, w=r*.56*sk;
      ctx.beginPath();
      ctx.moveTo(cx2+dx-w, cy2+dy+h*.55); ctx.lineTo(cx2+dx-w, cy2+dy-h*.1);
      ctx.lineTo(cx2+dx, cy2+dy-h*.85); ctx.lineTo(cx2+dx+w, cy2+dy-h*.1);
      ctx.lineTo(cx2+dx+w, cy2+dy+h*.55); ctx.closePath();
      ctx.fill(); if(r>=3.2) ctx.stroke();
    }
    return;
  }

  const ecken = stufe>=4? 8 : (stufe>=3? 6 : 0);   // ab Stufe 3 eckig, davor rund
  const rx = r*(stufe>=5? 1.02 : stufe>=4? .98 : .92), ry = rx*.82;
  const pfad = () => {
    ctx.beginPath();
    if(!ecken){ ctx.ellipse(cx2, cy2, rx, ry, 0, 0, Math.PI*2); return; }
    for(let i=0;i<ecken;i++){
      const w=(i/ecken)*Math.PI*2 - Math.PI/2;
      const px=cx2+Math.cos(w)*rx, py=cy2+Math.sin(w)*ry;
      i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath();
  };

  ctx.fillStyle=farbe; pfad(); ctx.fill();
  if(r>=2.6){ ctx.strokeStyle=dunkel; pfad(); ctx.stroke(); }

  // Innenhof, wird mit der Stufe kleiner, weil die Bebauung dichter wird
  if(stufe>=2 && r>=3){
    const f=stufe>=5? .40 : stufe>=4? .46 : .54;
    ctx.fillStyle="rgba(0,0,0,.26)";
    ctx.beginPath();
    if(!ecken) ctx.ellipse(cx2, cy2, rx*f, ry*f, 0, 0, Math.PI*2);
    else for(let i=0;i<ecken;i++){
      const w=(i/ecken)*Math.PI*2 - Math.PI/2;
      const px=cx2+Math.cos(w)*rx*f, py=cy2+Math.sin(w)*ry*f;
      i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }

  // Ecktürme ab Stufe 4
  if(stufe>=4 && r>=3.4){
    ctx.fillStyle=farbe; ctx.strokeStyle=dunkel; ctx.lineWidth=Math.max(.6, r*.1);
    const tr=Math.max(.9, r*.19);
    for(let i=0;i<ecken;i++){
      const w=(i/ecken)*Math.PI*2 - Math.PI/2;
      ctx.beginPath();
      ctx.arc(cx2+Math.cos(w)*rx, cy2+Math.sin(w)*ry, tr, 0, Math.PI*2);
      ctx.fill(); if(r>=5) ctx.stroke();
    }
  }
  // Bergfried in der Mitte der grössten Stufe
  if(stufe>=5 && r>=4){
    ctx.fillStyle=hell;

/** Gekreuzte Äxte, Mittelpunkt (x,y), halbe Breite a, Klingenfarbe color. Auch als Bild in der Legende. */

  for(const dir of [1,-1]){
    // Stiel von unten nach oben außen, Klinge am oberen Ende nach außen
    const ux=dir*s, uy=-s, nx=dir*s, ny=s;
    const ex=x+ux*a*0.8, ey=y+uy*a*0.8;
    c.strokeStyle="rgba(0,0,0,.8)"; c.lineWidth=Math.max(1.6, a*0.34);
    c.beginPath(); c.moveTo(x-ux*a, y-uy*a); c.lineTo(ex, ey); c.stroke();
    c.strokeStyle="#8d5a2b"; c.lineWidth=Math.max(0.9, a*0.18);
    c.beginPath(); c.moveTo(x-ux*a, y-uy*a); c.lineTo(ex, ey); c.stroke();
    c.beginPath();
    c.moveTo(ex+ux*h*0.25, ey+uy*h*0.25);
    c.lineTo(ex+nx*h+ux*h*0.55, ey+ny*h+uy*h*0.55);

}

/** Zeichen der Kampfart auf dunkler Plakette: gekreuzte Schwerter (Angriff) oder Schild (Unterstützung). */

  c.fillStyle="#161616"; c.fill(); c.lineWidth=Math.max(1.5, r*0.22); c.strokeStyle=rand; c.stroke();
  c.fillStyle="#ffffff"; c.strokeStyle="#ffffff"; c.lineCap="round";
  if(art==="a"){
    const q=r*0.55;
    for(const d of [1,-1]){
      // Klinge von unten (Griff) nach oben, Parierstange quer dazu kurz über dem Griff
      const gx=x-d*q, gy=y+q, tx=x+d*q, ty=y-q;
      c.lineWidth=Math.max(1.3, r*0.2);
      c.beginPath(); c.moveTo(gx, gy); c.lineTo(tx, ty); c.stroke();
      const px=gx+(tx-gx)*0.3, py=gy+(ty-gy)*0.3, l=q*0.42;

    }

    // Turm mit drei Zinnen: Verteidiger
    const w=r*0.5, top=y-r*0.62, mz=y-r*0.3, z=w*2/5;
    c.beginPath(); c.rect(x-w, mz, 2*w, r*0.95);
    for(const i of [0,2,4]) c.rect(x-w+i*z, top, z, mz-top+0.5);
    c.fill();

    const w=r*0.52, top=y-r*0.55;
    c.beginPath(); c.moveTo(x-w, top); c.lineTo(x+w, top); c.lineTo(x+w, y+r*0.02);
    c.quadraticCurveTo(x+w, y+r*0.45, x, y+r*0.66); c.quadraticCurveTo(x-w, y+r*0.45, x-w, y+r*0.02);
    c.closePath(); c.fill();
  }
}

function dunkel(hex){

  const n=parseInt(m[1],16); return 0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255) < 70;

/** Pfeil von (x1,y1) nach (x2,y2) in Bildschirmkoordinaten, Spitze kurz vor dem Ziel. art "a" Angriff, "u" Unterstützung. */
function pfeil(c,x1,y1,x2,y2,farbe,breite,art,alpha,glanz){

  const rand = dunkel(farbe)? "rgba(255,255,255,.7)" : "rgba(0,0,0,.75)";
  const lagen = glanz? [["rgba(255,255,255,.95)", breite+7], ["rgba(0,0,0,.8)", breite+2.5], [farbe, breite]]

    c.strokeStyle=col; c.lineWidth=w;
    c.setLineDash(art==="u"? [Math.max(5, breite*2.4), Math.max(4, breite*1.6)] : []);
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(ex-ux*ende, ey-uy*ende); c.stroke();
  }

      const p=el("p","unt kart"); p.style.setProperty("--c", pFarbe(u[0])); p.innerHTML=PLAKETTE_IMG.u;
      p.append(el("b",null,pName(u[0])),
        document.createTextNode(" unterstützt, +"+nf.format(u[1])+" "), el("span","s", SICHER[u[2]]));
      d.append(p);
    });
    const tr=r[kF.treffer];
    if(tr.length){
      const dl=el("details","dl"); dl.append(el("summary",null,"Angegriffene Dörfer ("+new Set(tr.map(x=>x[0])).size+")"));
      tr.forEach(([c,si,dp])=>{
        const x=Math.floor(c/1000), y=c%1000, i=byXY.get(c), st=KAMPF.stunden[si];
        const z=el("div","dorf"); z.title="Karte auf dieses Dorf";
        z.append(el("span",null,"("+x+"|"+y+") "+(i!=null && vname[i]? vname[i] : "")),
          el("span","s",(st? zeitraum(st[0], st[1]) : "Zeit unbekannt")+" · "+nf.format(dp)+" Punkte"));
        z.addEventListener("click", ()=>zentriere(x,y,10));
        dl.append(z);
      });
      d.append(dl);
    }
    body.appendChild(d);
  });
  if(liste.length>12) body.appendChild(el("p","note","und "+(liste.length-12)+" weitere Kämpfe in diesem Gebiet; näher heranzoomen"));
  $("kampf-title").textContent = liste.length>1? liste.length+" Kämpfe in diesem Gebiet" : (fokus && fokus.art==="u"? "Unterstützung" : "Kampf");
  box.hidden=false; box.open=true;
}
function closeKampf(){ $("kampf").hidden=true; if(pfeilFix){ pfeilFix=null; drawOverlay(); } }

/* ---------- Namen der Beteiligten (Dennis 29.10.2026) ----------
   Weit weg unter jedem Kampfsymbol „Angreifer vs Verteidiger“ des stärksten Kampfes im Gebiet. Näher heran
   längs jedes Pfeils auf Höhe seiner Plakette der Name des Angreifers bzw. Unterstützers mit Mini-Zeichen davor,
   am Ziel der Name des Verteidigers mit Turm davor. Gezeigt wird, wer im Zeitraum mindestens Rot erreicht
   (Gelb), mit „Weniger Spielernamen anzeigen“ nur ab Rot (p97 der Spieler mit Zuwachs). Größere Werte zuerst; was einen
   schon gezeichneten Namen überdecken würde, entfällt. */
function kampfStufe(){
  const st=(P&&P.bash_steps)||{};
  const win = kampfTag && st["24h_def"]? "24h" : bashWindow();     // ein Tag misst sich an den 24-h-Stufen
  if(!win) return null;
  return (v,art)=>{ const e=st[win+"_"+art]; if(!e) return -1; let s=0; while(s<e.length && v>e[s]) s++; return s; };
}
const pNameOf = pid => { const p=rowOfPid.get(pid); return p==null? null : P.rows[p][pIdx.name]; };
/** Namen zu den Kämpfen auf der Karte: Liste von {wert, zeichne(belegt)} für drawNames. */
function kampfLabels(){
  const out=[], stufe=kampfStufe();
  if(!stufe || !KAMPF) return out;
  const ok=(v,art)=>stufe(v,art)>=namesFrom;
  const aOf=r=>{ const a=r[kF.a][0]; return a && r[kF.a_sicher]!=="u"? a : null; };
  if(scale<KAMPF_ZOOM){
    for(const g of kampfGebiete){
      const r=g.items.find(imKrieg)||g.items[0], a=aOf(r);
      if(!ok(r[kF.dv],"def") && !(a && ok(a[1],"att"))) continue;
      const vn=pNameOf(r[kF.v]); if(!vn) continue;
      const an=a && pNameOf(a[0]);
      const [X,Y]=kMitte(g.x,g.y), gr=Math.max(7, Math.min(22, 6+4.2*Math.log10(Math.max(g.sum,1000)/1000)));
      out.push({wert:g.sum, zeichne:belegt=>vsZeile(X, Y+gr+8, an||"?", vn, belegt)});
    }
    return out;
  }
  const ziele=new Set();
  for(const f of kampfPfeile){
    const v = f.art==="a"? f.r[kF.a][0][1] : f.u[1];
    if(!ok(v, f.art==="a"? "att" : "sup")) continue;
    const n=pNameOf(f.pid); if(!n) continue;
    out.push({wert:v, zeichne:belegt=>pfeilName(f, n, belegt)});
  }
  for(const r of kampfSel){
    if(!imKrieg(r) || ziele.has(r) || !ok(r[kF.dv],"def")) continue;
    ziele.add(r);
    const n=pNameOf(r[kF.v]); if(!n) continue;
    const [X,Y]=kMitte(r[kF.x], r[kF.y]);
    out.push({wert:r[kF.dv], zeichne:belegt=>zeichenName(X, Y+Math.max(11, scale*0.55)+6, 0, "v", pFarbe(r[kF.v]), n, belegt)});
  }
  return out;
}
// Schwarze Schrift mit weißem Rand (Wunsch Dennis 29.10.2026): auf dem bunten Dorfteppich klarer als weiße Schrift
// mit dunklem Rand, die bei 11 px zerfaserte. Fett, damit die Buchstaben den Rand tragen.
const NAME_FONT="700 11px system-ui, sans-serif", VS_FONT="700 9px system-ui, sans-serif", WEIT_FONT="700 10.5px system-ui, sans-serif";
const frei=(belegt, boxen)=>!boxen.some(q=>belegt.some(b=>q[0]<b[2] && q[2]>b[0] && q[1]<b[3] && q[3]>b[1]));
function namensText(c, t, x, y, farbe){
  c.lineWidth=3.2; c.strokeStyle="rgba(255,255,255,.92)"; c.fillStyle=farbe||"#111111";
  c.strokeText(t, x, y); c.fillText(t, x, y);
}
/** „Angreifer vs Verteidiger“ weit weg: Namen 10,5 px, „vs“ kleiner und gedämpft. */
function vsZeile(X, Y, an, vn, belegt){
  ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.lineJoin="round";
  ctx.font=WEIT_FONT; const wa=ctx.measureText(an).width, wv=ctx.measureText(vn).width;
  ctx.font=VS_FONT; const ws=ctx.measureText(" vs ").width;
  // Kollision mit etwas Luft, damit Namen nicht zu einem Teppich zusammenwachsen
  const w=wa+ws+wv, box=[X-w/2-2, Y-7, X+w/2+2, Y+7], luft=[X-w/2-8, Y-7, X+w/2+8, Y+11];   // nach oben keine Luft, dort sitzt das eigene Symbol
  if(X<-w || X>W+w || Y<-20 || Y>H+20 || !frei(belegt,[luft])) return;
  belegt.push(box);
  let x=X-w/2;
  ctx.font=WEIT_FONT; namensText(ctx, an, x, Y); x+=wa;
  ctx.font=VS_FONT; namensText(ctx, " vs ", x, Y+0.5, "#555555"); x+=ws;
  ctx.font=WEIT_FONT; namensText(ctx, vn, x, Y);
}
/** Waagerechte Zeile ohne Zeichen, mittig bei (X,Y). */
function textZeile(X, Y, t, belegt){
  ctx.font=NAME_FONT; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineJoin="round";
  const w=ctx.measureText(t).width+6, box=[X-w/2, Y-7, X+w/2, Y+7];
  if(X<-w || X>W+w || Y<-20 || Y>H+20 || !frei(belegt,[box])) return;
  belegt.push(box); namensText(ctx, t, X, Y);
}
/** Mini-Zeichen plus Name, mittig bei (X,Y), um ang gedreht. Für die Kollision zählen kleine Quadrate längs
    der Zeile, damit schräge Namen nicht ihre ganze Umgebung sperren. */
function zeichenName(X, Y, ang, art, rand, t, belegt){
  ctx.font=NAME_FONT;
  const tw=ctx.measureText(t).width, w=tw+15, ux=Math.cos(ang), uy=Math.sin(ang), boxen=[];
  for(let s=-w/2; s<=w/2; s+=7){ const px=X+ux*s, py=Y+uy*s; boxen.push([px-6, py-6, px+6, py+6]); }
  if(X<-w || X>W+w || Y<-20 || Y>H+20 || !frei(belegt, boxen)) return;
  belegt.push(...boxen);
  ctx.save(); ctx.translate(X, Y); ctx.rotate(ang);
  plakette(ctx, -w/2+5, 0, 5, art, rand);
  ctx.font=NAME_FONT; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.lineJoin="round";
  namensText(ctx, t, -w/2+12.5, 0);
  ctx.restore();
}
/** Name längs des Pfeils auf Höhe der Plakette (45 %), seitlich versetzt, Schrift nie auf dem Kopf. */
function pfeilName(f, t, belegt){
  const dx=f.x2-f.x1, dy=f.y2-f.y1, d=Math.hypot(dx,dy); if(d<40) return;
  let ang=Math.atan2(dy,dx); if(ang>Math.PI/2) ang-=Math.PI; else if(ang<-Math.PI/2) ang+=Math.PI;
  const pr=d>46? Math.max(6.5, Math.min(10, f.breite+4.5)) : f.breite/2, abst=pr+7;
  // Normale nach „oben“ im gedrehten Bild
  const nx=Math.sin(ang), ny=-Math.cos(ang);
  zeichenName(f.x1+dx*0.45+nx*abst, f.y1+dy*0.45+ny*abst, ang, f.art, pFarbe(f.pid), t, belegt);
}

/** Pfeile am oberen rechten Rand des Dorfes: Zuwachs des Spielers, drei Stufen je Richtung. */
function drawArrows(x0,x1,y0,y1,size){
  const h=Math.max(2.5, Math.min(5, scale*0.3)), w=h*1.1, gap=h*0.28;
  ctx.lineWidth=1;
  if(!arrowOf) return;
  for(let i=0;i<N;i++){
    const a=arrowOf[i]; if(!a) continue;
    const x=vx[i], y=vy[i];
    if(x<x0||x>x1||y<y0||y>y1) continue;
    const n=Math.abs(a), up=a>0;
    ctx.fillStyle = up? "#00c853" : "#ff1744";
    ctx.strokeStyle="rgba(0,0,0,.7)";
    let ty=sy(y)+(scale-size)/2-1;                 // Oberkante des Dorfes
    const tx=sx(x)+(scale-size)/2+size+1;          // rechts daneben
    for(let k=0;k<n;k++){
      ctx.beginPath();
      if(up){ ctx.moveTo(tx, ty); ctx.lineTo(tx+w, ty); ctx.lineTo(tx+w/2, ty-h); }
      else  { ctx.moveTo(tx, ty-h); ctx.lineTo(tx+w, ty-h); ctx.lineTo(tx+w/2, ty); }
      ctx.closePath(); ctx.fill();
      if(h>=3.5) ctx.stroke();
      ty -= h+gap;
    }
  }
}

function draw(){
  ctx.fillStyle=GRASS;
  ctx.fillRect(0,0,W,H);
  if(!N) return;
  drawGrid();
  const size=scale<2? Math.max(1, scale) : scale*0.84, off=(scale-size)/2;
  const x0=wxAt(-2), x1=wxAt(W+2), y0=wyAt(-2), y1=wyAt(H+2);
  const alsDorf = shape==="village" && scale>=6;
  for(let b=0;b<buckets.length;b++){
    const list=buckets[b]; if(!list.length) continue;
    ctx.fillStyle=colorList[b];
    for(let k=0;k<list.length;k++){
      const i=list[k], x=vx[i], y=vy[i];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      if(alsDorf) drawVillage(sx(x)+scale/2, sy(y)+scale/2, size*0.62, colorList[b], stageOf(vpts[i]));
      else ctx.fillRect(sx(x)+off, sy(y)+off, size, size);
    }
  }
  if(scale>=7 && !alsDorf){
    ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.lineWidth=1;
    for(let b=0;b<buckets.length;b++) for(const i of buckets[b]){
      const x=vx[i], y=vy[i];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      ctx.strokeRect(Math.round(sx(x)+off)+.5, Math.round(sy(y)+off)+.5, Math.round(size)-1, Math.round(size)-1);
    }
  }
  if(scale>=7) drawMarks(x0,x1,y0,y1,size);
  if(scale>=8 && arrowOf) drawArrows(x0,x1,y0,y1,size);
  drawKaempfe();
  drawNames();
  drawOverlay();
}

/** Namen: zuerst die Beteiligten der sichtbaren Kämpfe (kampfLabels), in den Bash-Ansichten dazu Spieler ab der
    gewählten Stufe über dem Schwerpunkt ihrer Dörfer. Größere Werte zuerst, Überdeckungen entfallen. */
function drawNames(){
  // Weit weg bleiben Kampfsymbole frei, aber nur die von Gebieten mit mindestens so vielen besiegten Gegnern:
  // so verdrängt ein kleines Nachbarsymbol nie den Namen eines großen Kampfes
  const belegt=[], sym = scale<KAMPF_ZOOM? kampfHits.filter(h=>h.sum!=null).sort((a,b)=>b.sum-a.sum) : [];
  let si=0;
  kampfLabels().sort((a,b)=>b.wert-a.wert).forEach(l=>{
    for(; si<sym.length && sym[si].sum>=l.wert; si++){ const h=sym[si]; belegt.push([h.X-h.r*0.7, h.Y-h.r*0.7, h.X+h.r*0.7, h.Y+h.r*0.7]); }
    l.zeichne(belegt);
  });
  if(!isBash(view) || !bashTier) return;
  const liste=[];
  for(let p=0;p<bashTier.length;p++){
    if(bashTier[p]<namesFrom || !pCount[p]) continue;
    liste.push([bashValue(p), p, sx(pSumX[p]/pCount[p]+0.5), sy(pSumY[p]/pCount[p]+0.5)]);
  }
  liste.sort((a,b)=>b[0]-a[0]).forEach(([, p, X, Y])=>textZeile(X, Y, P.rows[p][pIdx.name], belegt));
}

/** Zeiger und Suchtreffer liegen auf einer eigenen Ebene. Beim Bewegen der Maus wird nur sie
    neu gezeichnet, nicht die ganze Karte mit ihren rund 29.500 Feldern. */
function drawOverlay(){
  octx.clearRect(0,0,W,H);
  if(!N) return;
  const fk=pfeilFix||pfeilHover;
  if(fk && KAMPF) drawFokus(fk);
  const size=scale<2? Math.max(1, scale) : scale*0.84, off=(scale-size)/2;
  const x0=wxAt(-2), x1=wxAt(W+2), y0=wyAt(-2), y1=wyAt(H+2);
  if(marked && marked.size){
    octx.strokeStyle="#ffffff"; octx.lineWidth=Math.max(1.5, Math.min(2.5, scale/5));
    for(const i of marked){
      const x=vx[i], y=vy[i]; if(x<x0||x>x1||y<y0||y>y1) continue;
      octx.strokeRect(sx(x)+off-1.5, sy(y)+off-1.5, size+3, size+3);
    }
  }
  if(selA>=0){
    const punkte=[[selA,"A"]].concat(selB>=0? [[selB,"B"]] : []);
    const mitte=i=>[sx(vx[i])+off+size/2, sy(vy[i])+off+size/2];
    if(selB>=0){
      const [ax,ay]=mitte(selA), [bx2,by2]=mitte(selB);
      octx.setLineDash([6,4]); octx.lineWidth=3; octx.strokeStyle="rgba(0,0,0,.55)";
      octx.beginPath(); octx.moveTo(ax,ay); octx.lineTo(bx2,by2); octx.stroke();
      octx.lineWidth=1.5; octx.strokeStyle="#ffd54a";
      octx.beginPath(); octx.moveTo(ax,ay); octx.lineTo(bx2,by2); octx.stroke();
      octx.setLineDash([]);
    }
    punkte.forEach(([i,label])=>{
      const bx2=sx(vx[i])+off, by2=sy(vy[i])+off, s2=Math.max(size,4);
      octx.strokeStyle="rgba(0,0,0,.65)"; octx.lineWidth=3.5;
      octx.strokeRect(bx2-3, by2-3, s2+6, s2+6);
      octx.strokeStyle="#ffd54a"; octx.lineWidth=2;
      octx.strokeRect(bx2-3, by2-3, s2+6, s2+6);
      octx.font="bold 12px system-ui, sans-serif"; octx.textAlign="center"; octx.textBaseline="bottom";
      octx.lineWidth=3; octx.strokeStyle="rgba(0,0,0,.7)";
      octx.strokeText(label, bx2+s2/2, by2-5); octx.fillStyle="#ffd54a";
      octx.fillText(label, bx2+s2/2, by2-5);
    });
  }
  if(hover>=0){
    const bx=sx(vx[hover])+off, by=sy(vy[hover])+off, s2=Math.max(size,4);
    octx.strokeStyle="#000000"; octx.lineWidth=3;
    octx.strokeRect(bx-2.5, by-2.5, s2+5, s2+5);
    octx.strokeStyle="#ffffff"; octx.lineWidth=1.5;
    octx.strokeRect(bx-2.5, by-2.5, s2+5, s2+5);
  }
}

/* ---------- Farbzuordnung je Ansicht ---------- */
function pct(row, key){
  const d=row[pIdx["d"+key+"_points"]];
  if(d==null) return null;
  const now=row[pIdx.points], before=now-d;
  if(before<=0) return d>0? 999 : 0;
  return d/before*100;
}
function arrowWindow(){
  // Über eine Stunde bewegt sich zu wenig, als dass Pfeile etwas aussagen würden. Deshalb 24 Stunden,
  // ersatzweise 12; in einer Zuwachs-Ansicht gilt deren Fenster.
  if(isGrowth(view)) return view.slice(1);
  return refs["24h"]? "24h" : (refs["12h"]? "12h" : null);
}
function computeArrows(){
  arrowOf=new Int8Array(N);
  if(!P) return;
  const key=arrowWindow();
  const lvl=new Int8Array(P.rows.length);
  P.rows.forEach((r,i)=>{
    if(key){
      const e=STEPS["d"+key], g=pct(r,key);
      if(g!=null) lvl[i] = g>e[3]? 3 : g>e[2]? 2 : g>e[1]? 1 : g<-e[3]? -3 : g<-e[2]? -2 : g<-e[1]? -1 : 0;
    }
  });
  for(let i=0;i<N;i++){
    const p=vp[i];
    arrowOf[i]= p>=0? lvl[p] : 0;
  }
}
function computeGrowth(){
  growth={}; rankOf={};
  if(isGrowth(view) && P){
    const key=view.slice(1);
    P.rows.forEach((r,i)=>{ const v=pct(r,key); if(v!=null) growth[i]=v; });
  } else if(isRank(view)){
    P.rows.forEach((r,i)=>{
      const e=inaday.get(r[pIdx.id]);
      if(e && e[view]) rankOf[i]=e[view].rank;
    });
  }
}
// Der Server rechnet die Kampfwerte nicht jede Stunde neu, ein Stundenfenster wäre oft leer.
// Wählbar sind deshalb 3, 6, 12 und 24 Stunden; fehlt der gewählte Vergleichsstand, gilt ein vorhandener.
function bashWindow(){
  if(refs[axWin]) return axWin;
  return ["24h","12h","6h","3h","1h"].find(k=>refs[k]) || null;
}
function bashValue(p, v){
  const r=P.rows[p], cfg=BASH[v||view];
  if(!cfg.neu) return r[pIdx[cfg.art]]||0;
  const k=bashWindow();
  return k? (r[pIdx["d"+k+"_"+cfg.art]]||0) : 0;
}
function tribeColorOf(id){ return marks.get(id) || tribeColor.get(id); }
function buildBuckets(){
  const map=new Map();
  const push=(color,i)=>{ let l=map.get(color); if(!l) map.set(color,l=[]); l.push(i); };
  if(view==="tribes"){
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(vb[i]? C_BONUS : C_BARB, i); continue; }
      push(tribeColorOf(allyOf[p]) || C_OTHER, i);
    }
  } else if(isRank(view)){
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const r=rankOf[p];
      if(r==null){ push(C_NONE, i); continue; }
      let s=0; while(s<RANK_STEPS.length && r>RANK_STEPS[s]) s++;
      push(RANK_COLORS[s], i);
    }
  } else if(isBash(view)){
    const steps=bashSteps()||[];
    bashTier=new Int8Array(P.rows.length).fill(-1);
    for(let p=0;p<P.rows.length;p++){
      const v=bashValue(p);
      if(!v || !steps.length) continue;
      let s=0; while(s<steps.length && v>steps[s]) s++;
      bashTier[p]=s;
    }
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const s=bashTier[p];
      push(s<0? C_NONE : BASH_COLORS[s], i);
    }
  } else {
    const edges=STEPS[view];
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const g=growth[p];
      if(g==null || g===0){ push(C_NONE, i); continue; }
      if(g<0){ push(C_LOSS, i); continue; }
      let s=0; while(s<edges.length && g>edges[s]) s++;
      push(GROWTH_COLORS[s], i);
    }
  }
  const order=[C_BARB,C_BONUS,C_NONE,C_OTHER,...GROWTH_COLORS,...BASH_COLORS,...RANK_SCALE,C_LOSS,
               ...TRIBE_COLORS,C_TRACKED,...EXTRA_COLORS];
  const keys=[...map.keys()].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  colorList=keys; buckets=keys.map(k=>map.get(k));
}

function renderLegend(){
  const items=$("legend-items");
  items.replaceChildren();
  const add=(color,text)=>{ const li=document.createElement("li"); const i=document.createElement("i");
    i.style.background=color; li.append(i, document.createTextNode(text)); items.appendChild(li); };
  if(view==="tribes"){
    $("legend-title").textContent="Stämme";
    [...marks.keys()].forEach(id=>add(marks.get(id), (tagOf.get(id)||"?")+" (gewählt)"));
    (T.tribe_ids||[]).forEach(id=>{ if(!marks.has(id)) add(C_TRACKED, tagOf.get(id)||"?"); });
    tribeList.forEach(a=>{ if(!marks.has(a[0]) && !(T.tribe_ids||[]).includes(a[0])) add(tribeColor.get(a[0]), a[2]||a[1]); });
    add(C_OTHER,"übrige Spieler"); add(C_BARB,"Barbaren"); add(C_BONUS,"Bonusdörfer");
    items.lastChild.querySelector("i").className="bonus";     // gelbe Raute links unten wie auf der Karte
  } else if(isBash(view)){
    const cfg=BASH[view], steps=bashSteps()||[], colors=BASH_COLORS;
    $("legend-title").textContent = "Besiegte Gegner "+BASH_ART[cfg.art]
      + (cfg.neu? ", dazugekommen in "+windowText(bashWindow()) : ", Stand jetzt");
    add(C_NONE,"keine");
    if(steps.length){
      add(colors[0],"bis "+nf.format(steps[0]));
      for(let s=1;s<steps.length;s++) add(colors[s], "bis "+nf.format(steps[s]));
      add(colors[steps.length],"über "+nf.format(steps[steps.length-1]));
    }

// Die vollständigen Ranglisten sind groß und werden erst geholt, wenn sie gebraucht werden.
let deepLoaded=false, deepLoading=null;
async function ensureDeep(){
  if(deepLoaded) return;
  if(!deepLoading) deepLoading=(async()=>{
    try{
      const d=await load("inaday");
      (d.rows||[]).forEach(([pid,type,rank,value,date])=>{
        let e=inaday.get(pid); if(!e) inaday.set(pid, e={});
        if(!e[type] || e[type].rank>rank) e[type]={rank,value,date};
      });
      deepCounts=d.counts||{};
    }catch(e){ /* Datei fehlt, solange noch kein Durchgang gelaufen ist */ }
    deepLoaded=true;
  })();
  return deepLoading;
}

/* ---------- Tooltip ---------- */
function hit(px,py){
  const wx=wxAt(px), wy=wyAt(py), x=Math.round(wx), y=Math.round(wy);
  const direkt=byXY.get(x*1000+y);
  if(direkt!=null) return direkt;
  // Nichts genau unter dem Zeiger: das nächstgelegene Dorf im Umkreis nehmen. Ohne das wirkt die
  // Karte hakelig, weil zwischen den Quadraten Lücken liegen.
  const reichweite = scale>=8? 1 : (scale>=3? 1 : 2);
  const grenze = scale>=8? 0.75 : 1.4;
  let best=-1, bestD=Infinity;
  for(let dy=-reichweite;dy<=reichweite;dy++) for(let dx=-reichweite;dx<=reichweite;dx++){
    const i=byXY.get((x+dx)*1000+(y+dy));
    if(i==null) continue;
    const d=Math.hypot(vx[i]-wx, vy[i]-wy);
    if(d<bestD){ bestD=d; best=i; }
  }
  return bestD<=grenze? best : -1;
}
function trow(k, v, cls, cur){
  const d=document.createElement("div"); d.className=cur? "row cur" : "row";
  const a=document.createElement("span"); a.className="k"; a.textContent=k;
  const b=document.createElement("span"); if(cls) b.className=cls; b.textContent=v;
  d.append(a,b); tip.appendChild(d);
}
function tsec(text){
  const d=document.createElement("div"); d.className="sec"; d.textContent=text; tip.appendChild(d);
}
function showTip(i, px, py){
  tip.replaceChildren();
  const head=document.createElement("div"); head.className="th";
  head.textContent=vname[i]||"Dorf";
  const co=document.createElement("span");
  co.textContent=" ("+vx[i]+"|"+vy[i]+") K"+Math.floor(vy[i]/100)+Math.floor(vx[i]/100);
  head.appendChild(co); tip.appendChild(head);
  const stufen=["Hütte","Weiler","Palisade","Wall","Burg","Festung"];
  trow("Dorfpunkte", nf.format(vpts[i])+" · "+stufen[stageOf(vpts[i])]);
  if(vb[i]) trow("Bonus","Bonusdorf");
  const p=vp[i];
  if(p<0){ trow("Besitzer","Barbaren"); }
  else{
    const r=P.rows[p], aid=allyOf[p];
    trow("Besitzer", r[pIdx.name]+" ("+nf.format(r[pIdx.points])+" Punkte)");
    const av=aid? allyById.get(aid) : null;
    trow("Stamm", aid? ((tagOf.get(aid)||"?")+(av? " ("+nf.format(av[5])+" Punkte)" : "")) : "ohne Stamm");
    trow("Dörfer", nf.format(r[pIdx.villages]));
    ["1h","12h","24h","7d"].forEach(k=>{
      if(!refs[k]) return;
      const d=r[pIdx["d"+k+"_points"]];
      if(d==null) return;
      const g=pct(r,k);
      const txt=(d>0?"+":"")+nf.format(d)+(g!=null&&g<999? " ("+(g>0?"+":"")+nf1.format(g)+" %)" : "");
      trow("Zuwachs "+(k==="7d"?"7 Tage":k.replace("h"," h")), txt, d>0?"up":(d<0?"down":"na"), view==="d"+k);
    });
    tsec("Besiegte Gegner");
    trow("Gesamt", nf.format(r[pIdx.all]), null, view==="bash_all");
    const bw=bashWindow();
    [["att","Angriff (Off)"],["def","Verteidigung (Deff)"],["sup","Unterstützung"]].forEach(([art,label])=>{
      trow(label, nf.format(r[pIdx[art]]), null, view==="bash_"+art);
      if(view==="bash_"+art+"_new" && bw) trow(label+" + "+winShort(bw), "+"+nf.format(bashValue(p)), null, true);
    });
    const e=inaday.get(r[pIdx.id]);
    // Ist die Karte nach einer Bestwert-Kategorie eingefärbt, erscheint deren Zeile immer, notfalls
    // als "kein Wert erfasst", damit sichtbar bleibt, warum das Dorf grau ist.
    const aktiv=isRank(view)? view : null;
    if(e || aktiv){
      tsec("Bester Tag (An einem Tag)");
      ["loot_res","scavenge","loot_vil","conquer","kill_att","kill_def","kill_sup"].forEach(t=>{
        const v=e&&e[t];
        if(!v){ if(t===aktiv) trow(INADAY_SHORT[t], "kein Wert erfasst", "na", true); return; }
        trow(INADAY_SHORT[t], nf.format(v.value)+" · Rang "+nf.format(v.rank)+(v.date? " ("+fmtDay(v.date)+")" : ""), null, t===aktiv);
      });
    }
  }
  tip.style.display="block";
  const r=wrap.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let left=px+14, top=py+14;
  if(left+tw>r.width-8) left=px-tw-14;
  if(top+th>r.height-8) top=Math.max(4, r.height-th-8);
  tip.style.left=Math.max(4,left)+"px"; tip.style.top=Math.max(4,top)+"px";
}

/* ---------- Laufzeiten zwischen zwei Dörfern ----------
   Erster Klick setzt das Startdorf, der zweite das Ziel. Jeder weitere Klick verschiebt nur das Ziel,
   damit man von einem Dorf aus mehrere Ziele abmessen kann. Klick auf das Startdorf oder Escape hebt auf.
   Laufzeit = Entfernung in Feldern × Minuten je Feld aus units.json (get_unit_info geteilt durch
   Weltgeschwindigkeit × Einheitengeschwindigkeit). Einheiten mit gleicher Geschwindigkeit stehen in einer Zeile. */
const UNIT_SHORT={spear:"Speer", sword:"Schwert", axe:"Axt", archer:"Bogen", spy:"Späher", light:"LKav",
                  marcher:"BBogen", heavy:"SKav", ram:"Ramme", catapult:"Kata", knight:"Paladin",
                  snob:"Adelsgeschlecht", militia:"Miliz"};
let selA=-1, selB=-1, distTimer=0;

function fieldsBetween(i,j){ return Math.hypot(vx[i]-vx[j], vy[i]-vy[j]); }
function dauerText(min){
  const s=Math.round(min*60), t=Math.floor(s/86400), r=s%86400;
  const hh=String(Math.floor(r/3600)).padStart(2,"0"), mm=String(Math.floor(r%3600/60)).padStart(2,"0"),
        ss=String(r%60).padStart(2,"0");
  return (t? t+" d " : "")+hh+":"+mm+":"+ss;
}
function ankunft(min){
  const d=new Date(Date.now()+min*60000);
  const heute=new Date();
  const tag=d.toDateString()===heute.toDateString()? "" : dtfTag.format(d)+" ";
  return {text:tag+hmf.format(d)+" Uhr", nacht:inNight(d)};
}
function inNight(d){
  const n=UNITS&&UNITS.night;
  if(!n||!n.active||n.start_hour==null||n.end_hour==null) return false;
  // Serverzeit ist Europe/Berlin, dieselbe Zeitzone wie die übrigen Anzeigen
  // de-DE hängt " Uhr" an, deshalb parseInt statt +
  const h=parseInt(new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",hour12:false}).format(d),10);
  return n.start_hour<=n.end_hour ? (h>=n.start_hour && h<n.end_hour) : (h>=n.start_hour || h<n.end_hour);
}
function selectVillage(i){
  const prevA=selA, prevB=selB;
  if(i<0){ selA=-1; selB=-1; }
  else if(selA<0) selA=i;
  else if(i===selA){ selA=-1; selB=-1; }
  else selB=i;
  if(selA!==prevA || selB!==prevB) pushUndo(()=>{ selA=prevA; selB=prevB; renderDist(); drawOverlay(); });
  renderDist(); drawOverlay();
}
function renderDist(){
  const box=$("dist"), body=$("dist-body");
  if(selA<0){ box.hidden=true; body.replaceChildren(); return; }
  box.hidden=false;
  body.replaceChildren();
  const name=i=>(vname[i]||"Dorf")+" ("+vx[i]+"|"+vy[i]+")";
  const pair=el("div","pair");
  pair.append(el("b",null,name(selA)));
  if(selB>=0){
    pair.append(el("span",null,"→"), el("b",null,name(selB)),
                el("span","fields", nf1.format(fieldsBetween(selA,selB))+" Felder"));
  }
  body.appendChild(pair);
  if(selB<0){
    body.appendChild(el("p","note","Startdorf gewählt. Jetzt ein zweites Dorf anklicken, dann stehen hier die Laufzeiten aller Einheiten."));
    $("dist-title").textContent="Laufzeit";
    return;
  }
  const felder=fieldsBetween(selA,selB);
  $("dist-title").textContent="Laufzeit · "+nf1.format(felder)+" Felder";
  if(!UNITS || !UNITS.units || !UNITS.units.length){
    body.appendChild(el("p","note","Die Einheitendaten fehlen noch. Der Sammler holt sie einmal je Woche von der Welt; danach stehen hier die Laufzeiten."));
    return;
  }
  // Einheiten mit gleicher Geschwindigkeit zusammenfassen, schnellste zuerst
  const gruppen=new Map();
  UNITS.units.forEach(u=>{
    const k=u.min_per_field.toFixed(4);
    if(!gruppen.has(k)) gruppen.set(k,{min:u.min_per_field, namen:[], voll:[]});
    const g=gruppen.get(k);
    g.namen.push(UNIT_SHORT[u.id]||u.name); g.voll.push(u.name);
  });
  const reihen=[...gruppen.values()].sort((a,b)=>a.min-b.min);
  const t=document.createElement("table");
  const thead=document.createElement("thead"), hr=document.createElement("tr");
  ["Einheiten","Laufzeit","Ankunft"].forEach(h=>{ const th=document.createElement("th"); th.textContent=h; hr.appendChild(th); });
  thead.appendChild(hr); t.appendChild(thead);
  const tb=document.createElement("tbody");
  const langsamste=reihen[reihen.length-1];
  reihen.forEach(g=>{
    const min=felder*g.min, a=ankunft(min), tr=document.createElement("tr");
    if(g===langsamste && reihen.length>1) tr.className="slow";
    const c1=document.createElement("td");
    c1.title=g.voll.join(", ")+" · "+nf1.format(g.min)+" Minuten je Feld";
    c1.textContent=g.namen.join(", ");
    const c2=document.createElement("td"); c2.className="t"; c2.textContent=dauerText(min);
    const c3=document.createElement("td"); c3.className="arr"; c3.textContent=a.text;
    if(a.nacht){ const m=el("span","moon"," ☾"); m.title="Ankunft im Nachtbonus"+(UNITS.night.def_factor? " (Verteidigung ×"+nf1.format(UNITS.night.def_factor)+")" : ""); c3.appendChild(m); }
    tr.append(c1,c2,c3); tb.appendChild(tr);
  });
  t.appendChild(tb); body.appendChild(t);
  const hinweise=["Abschickzeit jetzt, Rückweg dauert genauso lang.",
                  "Ein Angriff ist so langsam wie seine langsamste Einheit (letzte Zeile).",
                  "Klick auf ein weiteres Dorf setzt ein neues Ziel, Klick auf das Startdorf oder Escape hebt die Auswahl auf."];
  if(UNITS.night && UNITS.night.active) hinweise.splice(1, 0, "☾ heißt Ankunft im Nachtbonus ("+UNITS.night.start_hour+" bis "+UNITS.night.end_hour+" Uhr).");
  body.appendChild(el("p","note", hinweise.join(" ")));
}

/* ---------- Stamm markieren ---------- */
function nextColor(){
  const used=new Set([...marks.values(), ...tribeColor.values()]);
  return EXTRA_COLORS.find(c=>!used.has(c)) || EXTRA_COLORS[marks.size % EXTRA_COLORS.length];
}
function addMark(id, color){
  if(!id || marks.has(id)) return;
  marks.set(id, color || nextColor());
  pushUndo(()=>{ marks.delete(id); renderMarks(); buildBuckets(); renderLegend(); draw(); });
  renderMarks(); buildBuckets(); renderLegend(); draw();
}
function renderMarks(){
  const box=$("marks"); box.replaceChildren();
  if(!marks.size) return;
  const label=document.createElement("b"); label.textContent="Markiert"; box.appendChild(label);
  for(const [id,color] of marks){

/* ---------- Suche mit Vorschlägen ---------- */
function suggestions(qRaw){
  const q=qRaw.trim().toLowerCase();
  if(q.length<2) return [];
  const out=[];
  for(const a of A.rows){
    const tag=(a[2]||""), name=(a[1]||"");
    if(tag.toLowerCase().includes(q) || name.toLowerCase().includes(q))
      out.push({kind:"ally", id:a[0], label:tag||name, meta:name+" · "+nf.format(a[3])+" Mitglieder · "+nf.format(a[4])+" Dörfer", sort:-a[5]});
    if(out.length>40) break;
  }
  for(let i=0;i<P.rows.length && out.length<=60;i++){
    const r=P.rows[i];
    if(r[pIdx.name].toLowerCase().includes(q))
      out.push({kind:"player", id:r[pIdx.id], label:r[pIdx.name],
                meta:nf.format(r[pIdx.points])+" Punkte · "+(allyOf[i]? (tagOf.get(allyOf[i])||"") : "ohne Stamm"),
                sort:-r[pIdx.points]});
  }
  return out.sort((a,b)=>a.sort-b.sort).slice(0,10);
}
function renderSuggestions(){
  const box=$("sugg"), list=suggestions($("q").value);
  box.replaceChildren();
  if(!list.length){ box.hidden=true; $("q").setAttribute("aria-expanded","false"); return; }
  list.forEach(s=>{
    const d=document.createElement("div"); d.setAttribute("role","option");
    const l=document.createElement("span");
    l.textContent=(s.kind==="ally"? "Stamm " : "")+s.label;
    const m=document.createElement("span"); m.className="meta"; m.textContent=s.meta;
    d.append(l,m);
    d.addEventListener("mousedown", e=>{ e.preventDefault(); $("q").value=s.label; box.hidden=true; search(s.label); });
    box.appendChild(d);
  });
  box.hidden=false; $("q").setAttribute("aria-expanded","true");
}
function updateClearMarkBtn(){ const b=$("clearmark"); if(b) b.hidden=!marked; }
function clearMarked(){ marked=null; draw(); showStand(); updateClearMarkBtn(); }
function search(qRaw){
  const q=qRaw.trim(); marked=null;
  if(!q){ showStand(); draw(); updateClearMarkBtn(); return; }
  const m=q.match(/^(\d{1,3})\s*[|,; ]\s*(\d{1,3})$/);
  if(m){ ownView(); cx=+m[1]; cy=+m[2]; scale=Math.max(scale,10); clampView(); draw(); saveUrl(); return; }
  const low=q.toLowerCase();
  const ally=A.rows.find(a=>(a[2]||"").toLowerCase()===low) || A.rows.find(a=>(a[1]||"").toLowerCase()===low)
          || A.rows.find(a=>(a[2]||"").toLowerCase().includes(low));
  const player=P.rows.find(r=>r[pIdx.name].toLowerCase()===low) || P.rows.find(r=>r[pIdx.name].toLowerCase().includes(low));
  let set=new Set(), label="";
  if(player && (!ally || player[pIdx.name].toLowerCase()===low)){
    const pi=P.rows.indexOf(player);
    for(let i=0;i<N;i++) if(vp[i]===pi) set.add(i);
    label=player[pIdx.name];
    if(allyOf[pi]) addMark(allyOf[pi]);          // Stamm des Spielers gleich mit markieren
  } else if(ally){
    for(let i=0;i<N;i++) if(vp[i]>=0 && allyOf[vp[i]]===ally[0]) set.add(i);
    label=(ally[2]||ally[1]);
    addMark(ally[0]);
  }
  if(!set.size){ $("stand").textContent="Nichts gefunden zu „"+q+"“"; return; }
  marked=set; ownView();
  let mx=0, my=0;
  for(const i of set){ mx+=vx[i]; my+=vy[i]; }
  cx=mx/set.size; cy=my/set.size;
  scale=Math.max(scale, set.size>200? 3 : 8); clampView(); draw(); saveUrl();
  $("stand").textContent=label+": "+nf.format(set.size)+" Dörfer hervorgehoben";
  updateClearMarkBtn();
  pushUndo(clearMarked);
}

/* ---------- Kriege (data/krieg.json, collector/krieg.py) ----------
   Entscheidungen Dennis 29.10.2026: Krieg ab 100.000 besiegten Gegnern in 7 Tagen zwischen zwei Stämmen,
   ein großer Kampftag reicht (2b); junge Kriege als „Kriegsbeginn“; Frieden erst nach 3 Wochen ohne Kampf (3c). */
const nfMio=new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const menge = v => v>=1e6? nfMio.format(v/1e6)+" Mio." : nf.format(v);
const sFarbe = id => tribeColorOf(id) || C_OTHER;
const sTag = (k,j) => tagOf.get(k.s[j]) || k.tags[j];
function tageSeit(iso){ return Math.floor((Date.now()-Date.parse(iso))/864e5); }
function dauerText(t){ return t<1? "seit heute" : t===1? "1 Tag" : t+" Tage"; }
function setKrieg(offen){
  kriegOffen=offen;
  $("kriege").hidden=!offen; $("kriegbtn").setAttribute("aria-pressed", String(offen));
  if(offen) renderKriege();
  else if(kriegSel){ kriegSel=null; draw(); }
  saveUrl();
}
function waehleKrieg(k, karte){
  const gleich = kriegSel && kriegSel[0]===k.s[0] && kriegSel[1]===k.s[1];
  kriegSel = gleich? null : k.s.slice();
  if(!gleich && karte && k.ort){ cx=k.ort[0]+0.5; cy=k.ort[1]+0.5; scale=Math.max(scale, KAMPF_ZOOM); ownView(); clampView(); }
  renderKriege(); draw(); saveUrl();
}
function renderKriege(){

  $("kriege-title").textContent=n+" Stammespaare im Krieg";
  body.append(el("p","regel","Aus der Kampfauswertung: Krieg ab "+nf.format(rg.min_krieg)+" besiegten Gegnern zwischen zwei Stämmen in "
    +rg.fenster_tage+" Tagen, ein großer Kampftag reicht. „Kriegsbeginn“ in den ersten "+rg.beginn_tage+" Tagen. Frieden erst nach "
    +rg.frieden_tage+" Tagen ohne Kampf. Gezählt werden nur wahrscheinliche und mögliche Angreifer. Historie seit "
    +dtfTag.format(new Date(KRIEG.historie_ab))+(n>KRIEG.kriege.length? ", gezeigt die "+KRIEG.kriege.length+" mit den meisten besiegten Gegnern der letzten 7 Tage." : "")
    +" Klick auf ein Paar zeigt nur dessen Kämpfe auf der Karte."));
  KRIEG.kriege.forEach(k=>{
    const sel = kriegSel && kriegSel[0]===k.s[0] && kriegSel[1]===k.s[1];
    const box=el("div","kr"+(sel? " sel" : ""));
    const kt=el("div","kt"); kt.title=sel? "Hervorhebung aufheben" : "Nur diese Kämpfe zeigen und Karte dorthin";
    const dot=j=>{ const d=el("i","dot"); d.style.background=sFarbe(k.s[j]); return d; };
    const vs=el("span","vs"); vs.append(dot(0), document.createTextNode(" "+sTag(k,0)+" "), el("span","kart"), document.createTextNode(" "+sTag(k,1)+" "), dot(1));
    vs.querySelector(".kart").innerHTML=PLAKETTE_IMG.a;
    kt.append(vs, el("span","badge "+k.status, k.status==="beginn"? "Kriegsbeginn" : "Krieg"));
    kt.addEventListener("click", ()=>waehleKrieg(k, true));
    box.append(kt);
    const t=tageSeit(k.seit), ruhe=tageSeit(k.letzte);
    const meta=el("div","meta",(k.seit_mindestens? "seit mindestens " : "seit ")+dtfTag.format(new Date(k.seit))+" ("+dauerText(t)+")"
      +" · "+k.kampftage+(k.kampftage===1? " Kampftag" : " Kampftage")+" · zuletzt "+dtfTag.format(new Date(k.letzte))+" "+hmf.format(new Date(k.letzte)));
    if(ruhe>=2) meta.append(el("span","ruhe"," · ruhig seit "+ruhe+" Tagen"));
    box.append(meta);
    // Verlauf je Tag: oben greift der erste Stamm an, unten der zweite, Höhe nach besiegten Gegnern (Wurzel)
    const tage=new Map(k.verlauf.map(v=>[v[0], v]));
    const start=new Date(Math.max(Date.parse(k.verlauf[0][0]), Date.now()-59*864e5)), heute=new Date();
    const spark=el("div","spark"); const max=Math.sqrt(Math.max(...k.verlauf.map(v=>Math.max(v[1],v[2])),1));
    for(let d=new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate())); d<=heute; d=new Date(d.getTime()+864e5)){
      const key=d.toISOString().slice(0,10), v=tage.get(key)||[key,0,0];
      const i=el("i"), o=el("b"), u=el("u");
      o.style.height=(Math.sqrt(v[1])/max*16)+"px"; o.style.background=sFarbe(k.s[0]);
      u.style.height=(Math.sqrt(v[2])/max*16)+"px"; u.style.background=sFarbe(k.s[1]);
      i.title=dtfTag.format(d)+": "+sTag(k,0)+" greift an "+menge(v[1])+" · "+sTag(k,1)+" greift an "+menge(v[2]);
      i.append(o,u); spark.append(i);
    }
    box.append(spark);
    [0,1].forEach(j=>{
      const s=k.seiten[j], z=el("div","seite");
      const l=el("span"); l.append(dot(j), document.createTextNode(" "+sTag(k,j)+" greift an, "+s.kaempfe+" Kämpfe"));
      z.append(l, el("span",null,"Off "+menge(s.off)));
      box.append(z, el("div","seite s","dabei Deff "+sTag(k,1-j)+" "+menge(s.deff_gegner)));
    });
    const det=el("details"); det.append(el("summary",null,"Einzelheiten: Angreifer, Ziele, Unterstützung im Stamm"));
    [0,1].forEach(j=>{
      const s=k.seiten[j], gegner=sTag(k,1-j);
      const liste=(titel, rows, fmt)=>{ if(!rows.length) return; det.append(el("div","sec",titel));
        rows.forEach(r=>{ const z=el("div","li"); z.append(el("span",null,fmt(r)), el("span",null,"+"+nf.format(r[r.length-1]))); det.append(z); }); };
      liste("Angreifer "+sTag(k,j)+" (Off)", s.angreifer, r=>pName(r[0]));
      liste("Angegriffen in "+gegner+" (Deff)", s.ziele, r=>pName(r[0]));
      liste("Unterstützung innerhalb "+gegner, s.gegner_unt, r=>pName(r[0])+" → "+pName(r[1]));
    });
    box.append(det);
    body.append(box);
  });
}

/* ---------- Vergangene Tage (data/kampf_tage.json, data/kampf_tage/JJJJ-MM-TT.json) ----------
   Je Kalendertag (Europe/Berlin) die Intervalle, die an diesem Tag enden, im Format von kampf.json. Unter jedem
   Tag ein Balken mit der Menge besiegter Gegner der Verteidiger, linear zum stärksten Tag. */
const TAGE_SICHTBAR=7;
let TAGE=null, kampfTag=null, tagEnde=-1, KAMPF_LIVE=null;
const tagCache=new Map();
const isoBerlin=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Berlin"});
const wdKurz=new Intl.DateTimeFormat("de-DE",{timeZone:"UTC", weekday:"short"});
const dtfTagLang=new Intl.DateTimeFormat("de-DE",{timeZone:"UTC", weekday:"long", day:"2-digit", month:"2-digit"});
const tagDatum = t => new Date(t+"T12:00:00Z");
const tagLang = t => dtfTagLang.format(tagDatum(t));
function tagKurz(t){
  if(t===isoBerlin.format(new Date())) return "Heute";
  if(t===isoBerlin.format(new Date(Date.now()-864e5))) return "Gestern";
  return wdKurz.format(tagDatum(t))+" "+(+t.slice(8))+".";
}
function setKampfData(k){
  KAMPF=k; kF=k? Object.fromEntries(k.felder.map((f,i)=>[f,i])) : {};
  computeKaempfe(); renderLegend(); draw();
}
function setKampfTag(neu){
  kampfTag=neu||null; pfeilFix=null; pfeilHover=null; $("kampf").hidden=true;
  if(kampfTag && TAGE){
    const i=TAGE.tage.findIndex(d=>d.tag===kampfTag);
    if(i>=0 && (i>tagEnde || i<=tagEnde-TAGE_SICHTBAR)) tagEnde=Math.min(TAGE.tage.length-1, Math.max(i+3, TAGE_SICHTBAR-1));
  }
  labelBashButtons(); renderTage(); renderZeitBadge(); saveUrl();
  if(!kampfTag){ if(KAMPF_LIVE) setKampfData(KAMPF_LIVE); return; }
  const tag=kampfTag, fertig=k=>{ if(kampfTag===tag) setKampfData(k); };
  if(tagCache.has(tag)){ fertig(tagCache.get(tag)); return; }
  setKampfData(null);                               // bis der Tag da ist, keine Kämpfe eines anderen Zeitraums zeigen
  load("kampf_tage/"+tag).then(k=>{ tagCache.set(tag,k); fertig(k); })
    .catch(()=>{ if(kampfTag===tag) setKampfTag(null); });
}
function renderTage(){
  const seg=$("tage-seg"); seg.replaceChildren();
  if(!TAGE || !TAGE.tage.length){ $("tage").hidden=true; return; }
  $("tage").hidden=false;
  const t=TAGE.tage, n=t.length;
  if(tagEnde<0 || tagEnde>n-1) tagEnde=n-1;
  const ab=Math.max(0, tagEnde-TAGE_SICHTBAR+1), max=Math.max(...t.map(d=>d.deff), 1);
  const opt=(b, anteil)=>{
    const o=el("span","opt"), m=el("i","scale menge");
    if(anteil!=null){ const f=el("i"); f.style.width=Math.max(4, anteil*100).toFixed(1)+"%"; m.append(f); }
    o.append(b, m); seg.append(o);
  };
  const nav=(txt, title, aus, fn)=>{ const b=el("button","tw nav",txt); b.type="button"; b.title=title; b.disabled=aus;
    b.addEventListener("click", fn); return b; };
  opt(nav("◀", "Ältere Tage", ab===0, ()=>{ tagEnde=Math.max(TAGE_SICHTBAR-1, tagEnde-TAGE_SICHTBAR); renderTage(); }));
  for(let i=ab;i<=tagEnde;i++){
    const d=t[i], b=el("button","tw",tagKurz(d.tag)), an=d.tag===kampfTag;
    b.type="button"; b.setAttribute("aria-pressed", String(an));
    b.title=tagLang(d.tag)+": "+nf.format(d.kaempfe)+" Kämpfe, "+menge(d.deff)+" besiegte Gegner der Verteidiger"
      +"\nIntervalle "+zeitraum(d.von, d.bis)+(an? "\nNochmal klicken: zurück zu jetzt" : "");
    b.addEventListener("click", ()=>setKampfTag(an? null : d.tag));
    opt(b, d.deff/max);
  }
  opt(nav("▶", "Neuere Tage", tagEnde>=n-1, ()=>{ tagEnde=Math.min(n-1, tagEnde+TAGE_SICHTBAR); renderTage(); }));
  fuelleZuletzt(max);
}
/** Balken unter 3 h bis 24 h im selben Maßstab wie die Tage. */
function fuelleZuletzt(max){
  if(!KAMPF_LIVE) return;
  const ende=Date.parse(KAMPF_LIVE.data_time_utc), dvI=KAMPF_LIVE.felder.indexOf("dv"), iI=KAMPF_LIVE.felder.indexOf("i");
  document.querySelectorAll("#axwin .opt").forEach(o=>{
    const ab=ende-kHours(o.querySelector("button").dataset.w)*3600e3;
    const iv=KAMPF_LIVE.intervalle.map(t=>Date.parse(t.bis)>ab);
    const sum=KAMPF_LIVE.rows.reduce((s,r)=>s+(iv[r[iI]]? r[dvI] : 0), 0);
    const m=o.querySelector(".menge"), f=el("i"); f.style.width=Math.max(sum? 4 : 0, Math.min(1, sum/max)*100).toFixed(1)+"%";
    m.replaceChildren(f); o.title=menge(sum)+" besiegte Gegner der Verteidiger";
  });
}
function renderZeitBadge(){
  const d=kampfTag && TAGE && TAGE.tage.find(x=>x.tag===kampfTag);
  $("zeitbadge").hidden=!d;
  if(!d) return;
