/* ---------- Adresszeile ---------- */
let saveTimer=0;
function saveUrl(){
  if(!initDone) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const p=new URLSearchParams();
    if(userView){ p.set("c", Math.round(cx)+"|"+Math.round(cy)); p.set("z", scale.toFixed(2)); }
    if(view!=="tribes") p.set("v", view);
    if(axWin!=="24h") p.set("w", axWin);
    if(kampfTag) p.set("t", kampfTag);
    if(namesFrom===NAME_AB_ROT) p.set("n", "rot");
    if(kriegOffen) p.set("k", kriegSel? kriegSel.join("-") : "1");
    if(marks.size) p.set("m", [...marks].map(([id,c])=>id+"-"+c.replace("#","")).join(","));
    const q=p.toString();
    history.replaceState(null,"", q? "?"+q : location.pathname);
  }, 400);
  renderSlim();
}
function readUrl(){
  const p=new URLSearchParams(location.search);
  const v=p.get("v"); if(v && (STEPS[v]||isRank(v)||isBash(v))) view=v;
  const w=p.get("w"); if(BASH_WINDOWS.includes(w)) axWin=w;
  const t=p.get("t"); if(/^\d{4}-\d{2}-\d{2}$/.test(t||"")) kampfTag=t;
  if(p.get("n")==="rot") namesFrom=NAME_AB_ROT;
  const k=p.get("k");
  if(k){ kriegOffen=true; const m=k.match(/^(\d+)-(\d+)$/); if(m) kriegSel=[+m[1], +m[2]]; }
  (p.get("m")||"").split(",").filter(Boolean).forEach(s=>{
    const [id,c]=s.split("-");
    if(/^\d+$/.test(id) && /^[0-9a-fA-F]{6}$/.test(c||"")) marks.set(+id, "#"+c);
  });
  const c=(p.get("c")||"").match(/^(\d{1,3})[|,](\d{1,3})$/);
  const z=parseFloat(p.get("z")), r=parseFloat(p.get("r"));
  if(c){
    cx=+c[1]; cy=+c[2];
    if(z>0) scale=z; else if(r>0) scale=Math.min(W,H)/(2*r+1); else scale=10;
    clampView(); return true;
  }
  return false;
}

/* ---------- Laden ---------- */
async function load(name){ const r=await fetch("data/"+name+".json",{cache:"no-cache"}); if(!r.ok) throw new Error(name+": HTTP "+r.status); return r.json(); }

(async function(){
  resize();
  try{ [V,P,A,T]=await Promise.all([load("villages"),load("players"),load("allies"),load("tribe")]); }
  catch(e){
    $("msg").hidden=false;
    $("msg").textContent="Die Kartendaten konnten nicht geladen werden ("+e.message+"). Der Sammler schreibt sie bei jedem Lauf neu.";
    $("stand").textContent="Keine Kartendaten";
    return;
  }
  pIdx=Object.fromEntries(P.fields.map((f,i)=>[f,i]));
  aIdx=Object.fromEntries(A.fields.map((f,i)=>[f,i]));
  refs=P.refs_utc||{};
  N=V.rows.length;
  vx=new Int16Array(N); vy=new Int16Array(N); vp=new Int32Array(N); vpts=new Int32Array(N);
  vb=new Uint8Array(N); vname=new Array(N); byXY=new Map();
  V.rows.forEach((r,i)=>{
    vx[i]=Math.floor(r[0]/1000); vy[i]=r[0]%1000; vp[i]=r[1]; vpts[i]=r[2]; vb[i]=r[3]; vname[i]=r[4];
    byXY.set(r[0], i);
  });
  allyOf=new Int32Array(P.rows.length);
  P.rows.forEach((r,i)=>{ allyOf[i]=r[pIdx.ally]||0; rowOfPid.set(r[pIdx.id], i); });
  // Schwerpunkt der Dörfer je Spieler, für die Namen in den Bash-Ansichten
  pSumX=new Float64Array(P.rows.length); pSumY=new Float64Array(P.rows.length); pCount=new Int32Array(P.rows.length);
  for(let i=0;i<N;i++){ const p=vp[i]; if(p>=0){ pSumX[p]+=vx[i]; pSumY[p]+=vy[i]; pCount[p]++; } }
  A.rows.forEach(a=>{ tagOf.set(a[0], a[2]||a[1]); allyById.set(a[0], a); });

  // Werte aus "An einem Tag": erfasste Stämme und die Weltspitze je Kategorie
  ((T.inaday_all)||(T.records)||[]).forEach(([pid,type,rank,value,date])=>{
    let e=inaday.get(pid); if(!e) inaday.set(pid, e={});
    if(!e[type] || e[type].rank>rank) e[type]={rank,value,date};
  });

  // Die erfassten Stämme immer blau, danach die punktstärksten Stämme aus der Palette
  const tracked=new Set(T.tribe_ids||[]);
  tracked.forEach(id=>tribeColor.set(id, C_TRACKED));
  tribeList=[...A.rows].filter(a=>!tracked.has(a[0])).sort((a,b)=>b[5]-a[5]).slice(0, TRIBE_COLORS.length);
  tribeList.forEach((a,i)=>tribeColor.set(a[0], TRIBE_COLORS[i]));

  const rankCount={};
  inaday.forEach(e=>{ for(const t in e) rankCount[t]=(rankCount[t]||0)+1; });
  document.querySelectorAll("#views button").forEach(b=>{
    const v=b.dataset.v;
    if(isGrowth(v)){
      b.title="Punktezuwachs über "+VIEW_LABEL[v];
      if(!refs[v.slice(1)]){ b.disabled=true; b.title="Noch kein Vergleichsstand für dieses Zeitfenster"; }
    } else if(isRank(v)){
      const n=rankCount[v]||0;
      b.title = INADAY_LABEL[v]+": "+(n? n+" Spieler mit erfasstem Wert (vollständige Liste wird beim Umschalten geladen)"
                 : "wird beim Umschalten geladen, falls schon ein Durchgang gelaufen ist");
    }
  });
  // Farbstreifen unter den Knöpfen aus denselben Paletten wie die Karte
  const verlauf = cs => "linear-gradient(90deg,"+cs.join(",")+")";
  const streifen={ tribes:"linear-gradient(90deg,"+TRIBE_COLORS.slice(0,6).map((c,i)=>c+" "+(i*100/6)+"% "+((i+1)*100/6)+"%").join(",")+")",
    growth:verlauf(GROWTH_COLORS), rank:verlauf(RANK_SCALE) };
  for(const v in BASH) streifen["bash_"+BASH[v].art]=verlauf(BASH_COLORS);
  $("axicon").innerHTML=AXES_IMG[2];
  document.querySelectorAll("#axwin button").forEach(b=>{
    if(!refs[b.dataset.w]){ b.disabled=true; b.title="Noch kein Vergleichsstand für dieses Zeitfenster"; }
    else b.title="Kampfsymbole und Ansichten „+“ über "+windowText(b.dataset.w);
  });
  document.querySelectorAll("#views .scale").forEach(s=>{ s.style.background=streifen[s.dataset.scale]||"none"; });

  // Einheitendaten nur für die Laufzeiten, ihr Fehlen darf die Karte nicht aufhalten
  load("units").then(u=>{ UNITS=u; if(selB>=0) renderDist(); }).catch(()=>{ /* noch kein Abruf gelaufen */ });
  // Stufennamen für die Spieler-Details, ebenfalls ohne die Karte aufzuhalten (STUFE_FALLBACK greift sonst)
  load("erfahrung").then(e=>{ ERF=e; }).catch(()=>{ /* Fallback-Namen reichen */ });
  // Kämpfe ebenfalls nachgeladen; fehlt die Datei, bleibt die Karte ohne Kampfsymbole
  load("kampf").then(k=>{ KAMPF_LIVE=k; if(!kampfTag) setKampfData(k); renderTage(); }).catch(()=>{ /* noch kein Seitenbau mit Kämpfen */ });
  // Tage mit Kämpfen; ein Tag aus der Adresszeile wird erst geladen, wenn es ihn gibt
  load("kampf_tage").then(t=>{ TAGE=t;
    if(kampfTag && !t.tage.some(d=>d.tag===kampfTag)) kampfTag=null;
    setKampfTag(kampfTag);
  }).catch(()=>setKampfTag(null));
  load("krieg").then(k=>{ KRIEG=k; if(kriegOffen) renderKriege(); }).catch(()=>{ /* noch kein Seitenbau mit Kriegen */ });

  if(readUrl()) ownView();
  let leiste="1"; try{ leiste=localStorage.getItem("karte.leiste")||"1"; }catch(e){ /* ohne Speicher ausgeklappt */ }
  if(leiste==="0") setLeiste(false);
  $("names").setAttribute("aria-pressed", String(namesFrom===NAME_AB_ROT));
  if(kriegOffen){ $("kriege").hidden=false; $("kriegbtn").setAttribute("aria-pressed","true"); renderKriege(); }
  labelBashButtons();
  resize();
  if(isGrowth(view) && !refs[view.slice(1)]) view="tribes";
  if(isBash(view) && BASH[view].neu && !bashWindow()) view="tribes";
  renderMarks();
  setView(view);
  initDone=true;
  new ResizeObserver(resize).observe(wrap);
  showStand();
  updateUndoBtn(); updateClearMarkBtn();
  // Der Browser stellt den Zustand von <details> nach dem Laden wieder her, deshalb erst danach setzen
  requestAnimationFrame(()=>{ $("legend").open = wrap.clientWidth>=560; });
})();

// Die Ankunftszeiten hängen an der Uhr, deshalb minütlich neu rechnen, solange eine Strecke gewählt ist
setInterval(()=>{ if(selA>=0 && selB>=0) renderDist(); }, 60000);

function showStand(){
  if(!V) return;
  const src = V.source==="cache" ? "aktueller Lauf"
    : (V.source||"").startsWith("daily:") ? "Tagesarchiv vom "+fmtDay(V.source.slice(6))
    : "unbekannt";
  const b=document.createElement("b");
  b.textContent = V.data_time_utc? fmtTime(V.data_time_utc) : src;
  $("stand").replaceChildren(document.createTextNode(nf.format(N)+" Dörfer · Stand: "), b,
    document.createTextNode(V.data_time_utc? " ("+src+")" : ""));
  renderSlim();
}

/* ---------- Bedienung ---------- */
document.addEventListener("themechange", ()=>{ readColors();
  tribeList.forEach((a,i)=>tribeColor.set(a[0], TRIBE_COLORS[i]));
  if(N){ buildBuckets(); renderLegend(); } draw(); });
window.addEventListener("resize", resize);
$("zin").addEventListener("click", ()=>zoomAt(W/2,H/2,1.6));
$("names").addEventListener("click", ()=>{
  namesFrom = namesFrom===NAME_AB_GELB? NAME_AB_ROT : NAME_AB_GELB;
  $("names").setAttribute("aria-pressed", String(namesFrom===NAME_AB_ROT));
  renderLegend(); draw(); saveUrl();
});
$("zout").addEventListener("click", ()=>zoomAt(W/2,H/2,1/1.6));
$("kriegbtn").addEventListener("click", ()=>setKrieg(!kriegOffen));
$("kriege-close").addEventListener("click", ()=>setKrieg(false));
$("einklappen").addEventListener("click", ()=>setLeiste(false));
$("ausklappen").addEventListener("click", ()=>setLeiste(true));
$("zeitbadge-jetzt").addEventListener("click", ()=>setKampfTag(null));
$("zfit").addEventListener("click", ()=>{ marked=null; userView=false; fitWorld(); draw(); saveUrl(); updateClearMarkBtn(); });
$("clearmark").addEventListener("click", clearMarked);
$("undo").addEventListener("click", doUndo);
document.getElementById("shape").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(!b.dataset.shape) return;
  shape=b.dataset.shape;
  document.querySelectorAll("#shape button").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.shape===shape)));
  draw();
});
$("axwin").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(b && !b.disabled) setAxWin(b.dataset.w);
});
document.querySelectorAll("#views").forEach(g=>g.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b || b.disabled) return;
  const prev=view;
  setView(b.dataset.v);
  if(view!==prev) pushUndo(()=>setView(prev));
}));
$("searchform").addEventListener("submit", e=>{ e.preventDefault(); $("sugg").hidden=true; search($("q").value); });
$("q").addEventListener("input", renderSuggestions);
$("q").addEventListener("focus", renderSuggestions);
$("q").addEventListener("blur", ()=>setTimeout(()=>{ $("sugg").hidden=true; }, 150));
$("q").addEventListener("keydown", e=>{ if(e.key==="Escape") $("sugg").hidden=true; });

const pts=new Map();
let dragging=false, lastX=0, lastY=0, moved=0, pinch=0;
// Legende, Infofelder, Kriegspanel und Zoomknöpfe liegen über der Karte. Ein Zeiger dort gehört ihnen:
// kein Ziehen, kein Dorf-Treffer, kein Zoom per Rad (sonst landete der Klick auf das Einklapp-Dreieck oder
// das × über Pointer-Capture bei der Karte und wählte das Dorf darunter).
const aufPanel = e => !!(e.target.closest && e.target.closest(".legend,.dist,.pdet,.zoom,.kriege,.zeitbadge"));
wrap.addEventListener("pointerdown", e=>{
  if(aufPanel(e)) return;
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size>1){ dragging=false; wrap.classList.remove("drag"); return; }
  if(e.pointerType==="mouse" && e.button!==0) return;
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; wrap.style.cursor="";
  wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener("pointermove", e=>{
  if(!dragging && !pts.size && aufPanel(e)){
    tip.style.display="none"; wrap.style.cursor="";
    if(hover>=0 || pfeilHover){ hover=-1; pfeilHover=null; drawOverlay(); }
    return;
  }
  if(pts.has(e.pointerId)) pts.set(e.pointerId,[e.clientX,e.clientY]);
  const r=wrap.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a[0]-b[0], a[1]-b[1]);
    if(pinch) zoomAt((a[0]+b[0])/2-r.left, (a[1]+b[1])/2-r.top, d/pinch);
    pinch=d; tip.style.display="none";
    return;
  }
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(dx||dy) ownView();
    moved+=Math.abs(dx)+Math.abs(dy);
    cx-=dx/scale; cy-=dy/scale; lastX=e.clientX; lastY=e.clientY;
    clampView(); draw(); saveUrl();
    tip.style.display="none"; hover=-1;
    return;
  }
  if(e.pointerType!=="mouse") return;
  const f = scale>=KAMPF_ZOOM? pfeilAt(px,py) : null;
  if(!gleicherPfeil(f, pfeilHover)){ pfeilHover=f; if(f) hover=-1; drawOverlay(); }
  if(f){ showKampfTip(f,px,py); wrap.style.cursor="pointer"; return; }
  wrap.style.cursor="";
  const i=hit(px,py);
  if(i!==hover){ hover=i; drawOverlay(); }
  if(i>=0) showTip(i,px,py); else tip.style.display="none";
});
let lastClick={i:-1, t:0};
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=0;
  if(!dragging) return;
  dragging=false; wrap.classList.remove("drag");
  if(moved>=6) return;
  const r=wrap.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  const f = scale>=KAMPF_ZOOM? pfeilAt(px,py) : null;
  if(f){ pfeilFix=f; tip.style.display="none"; openKampf([f.r], f); drawOverlay(); return; }
  const k=kampfAt(px,py);
  if(k){ pfeilFix = k.items.length===1? {r:k.items[0], art:"a", u:null} : null; openKampf(k.items); drawOverlay(); return; }
  closeKampf();
  const i=hit(px,py);
  if(e.pointerType!=="mouse"){
    hover=i;
    if(i>=0) showTip(i,px,py); else tip.style.display="none";
  }
  // Doppelklick auf dasselbe (nicht-Barbaren-)Dorf öffnet die Spieler-Details, einfacher Klick
  // bleibt unverändert die Laufzeitmessung (selectVillage).
  const now=Date.now(), istDoppelklick = i>=0 && vp[i]>=0 && lastClick.i===i && (now-lastClick.t)<450;
  lastClick = istDoppelklick? {i:-1, t:0} : {i, t:now};
  if(istDoppelklick) openPlayerPanel(vp[i]);
  else selectVillage(i);       // zeichnet die Auswahl und füllt die Laufzeiten
}
wrap.addEventListener("pointerup", endPointer);
wrap.addEventListener("pointercancel", endPointer);
wrap.addEventListener("pointerleave", e=>{ endPointer(e); tip.style.display="none";
  if(hover>=0 || pfeilHover){ hover=-1; pfeilHover=null; drawOverlay(); } });
wrap.addEventListener("wheel", e=>{
  if(aufPanel(e)) return;                    // Infofelder und Panel scrollen selbst
  e.preventDefault();
  const r=wrap.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0? 1.25 : 1/1.25);
}, {passive:false});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(!$("kampf").hidden) closeKampf();
    else if(undoStack.length) doUndo();
    else if(selA>=0) selectVillage(-1);
    return;
  }
  if(e.target.tagName==="INPUT") return;
  const step=60/scale;
  if(e.key==="ArrowLeft") cx-=step;
  else if(e.key==="ArrowRight") cx+=step;
  else if(e.key==="ArrowUp") cy-=step;
  else if(e.key==="ArrowDown") cy+=step;
  else if(e.key==="+"||e.key==="="){ zoomAt(W/2,H/2,1.4); return; }
  else if(e.key==="-"){ zoomAt(W/2,H/2,1/1.4); return; }
  else return;
  ownView(); e.preventDefault(); clampView(); draw(); saveUrl();
});
</script>
