<!doctype html>
<html lang="de" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Karte · Welt 259</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23416729'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
/* Nur was die Karte zusätzlich braucht. Farben und Formen kommen aus style.css. */
body{display:flex; flex-direction:column; overflow:hidden; background-attachment:scroll}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:5px 14px;
  padding:5px clamp(10px,3vw,18px); background:var(--panel); border-bottom:1px solid var(--edge-soft)}
.bar:last-of-type{border-bottom:1px solid var(--edge)}
.grp{display:inline-flex; align-items:center; gap:3px; flex-wrap:wrap}
.grp>b{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:2px}
button.tw.small{padding:2px 6px; font-size:11px}
.search{display:flex; gap:5px; align-items:center; position:relative}
.search input{width:min(220px,40vw)}
.sugg{position:absolute; z-index:20; top:100%; left:0; margin-top:2px; width:min(280px,62vw);
  background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 4px 14px rgba(0,0,0,.45); max-height:230px; overflow:auto}
.sugg div{padding:3px 8px; cursor:pointer; font-size:12px; display:flex; justify-content:space-between; gap:10px}
.sugg div:hover{background:var(--row-hover)}
.sugg .meta{color:var(--muted); font-size:11px}
.mark{display:inline-flex; align-items:center; gap:5px; padding:1px 6px; border:1px solid var(--edge);
  border-radius:var(--radius); background:var(--panel-2)}
.mark .tag{font-weight:700; font-size:12px}
.mark .meta{font-size:10.5px; color:var(--muted)}
.mark .dot{width:13px; height:13px; border:1px solid rgba(0,0,0,.45); display:inline-block}
.mark input[type="color"]{width:26px; height:20px; padding:0; border:1px solid var(--edge); background:none; cursor:pointer}
.stand{font-size:11.5px; color:var(--ink-2); margin-left:auto; text-align:right}
.stand b{font-weight:700}
.mapwrap{position:relative; flex:1; min-height:0; background:var(--map-bg); touch-action:none; cursor:default}
.mapwrap.drag{cursor:grabbing}
canvas{display:block; width:100%; height:100%; position:absolute; inset:0}
#ov{pointer-events:none}
.overlay{position:absolute; inset:auto 0 0 0; display:flex; flex-wrap:wrap; align-items:flex-end;
  justify-content:space-between; gap:8px; padding:9px 10px; pointer-events:none; z-index:3}
.legend{background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(0,0,0,.4); font-size:11.5px; max-width:min(470px,93vw); pointer-events:auto}
.legend summary{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--head-ink); background:var(--head); border-bottom:1px solid var(--edge-soft);
  padding:3px 8px; cursor:pointer; list-style-position:inside}
.legend:not([open]) summary{border-bottom:0}
.legend ul{margin:0; padding:6px 8px; list-style:none; display:flex; flex-wrap:wrap; gap:3px 12px}
.legend li{display:flex; align-items:center; gap:5px; white-space:nowrap}
.legend i{width:11px; height:11px; border:1px solid var(--map-edge); flex:none}
.legend .arrows{border-top:1px solid var(--edge-line); padding:4px 8px; color:var(--ink-2); margin:0}
.legend .arrows b{color:var(--good)} .legend .arrows u{color:var(--bad); text-decoration:none}
.zoom{display:flex; gap:5px; pointer-events:auto}
.zoom button{font:inherit; font-weight:700; font-size:15px; width:32px; height:32px; cursor:pointer;
  background:var(--btn); color:var(--ink); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:var(--shine)}
.tip{position:absolute; z-index:5; pointer-events:none; display:none; width:max-content; max-width:min(360px,92vw);
  background:var(--panel-solid); color:var(--ink); border:1px solid var(--edge); border-radius:var(--radius);
  padding:0 0 5px; font-size:12px; line-height:1.35; box-shadow:0 4px 14px rgba(0,0,0,.45)}
.tip .th{background:var(--head); border-bottom:1px solid var(--edge-soft); padding:3px 9px; font-weight:700;
  color:var(--head-ink)}
.tip .th span{font-weight:400; opacity:.85}
.tip .sec{margin-top:3px; padding:2px 9px 1px; font-size:9.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); border-top:1px solid var(--edge-line)}
.tip .row{display:flex; gap:14px; justify-content:space-between; padding:1px 9px; white-space:nowrap}
.tip .row:nth-of-type(even){background:var(--row-alt)}
.tip .k{color:var(--muted)}
.tip .up{color:var(--good); font-weight:700} .tip .down{color:var(--bad); font-weight:700} .tip .na{color:var(--muted)}
.msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--ink); background:var(--panel-solid); opacity:.94; font-size:13px; padding:24px; z-index:4}
@media (max-width:640px){ .stand{width:100%; text-align:left; margin-left:0} .legend{font-size:11px} }
</style>

<body>
<header class="appbar" id="appbar"></header>

<div class="bar">
  <div class="grp" id="views" role="group" aria-label="Ansicht">
    <b>Ansicht</b>
    <button class="tw" type="button" data-v="tribes" aria-pressed="true">Stämme</button>
    <button class="tw" type="button" data-v="d1h">Punktezuwachs 1 h</button>
    <button class="tw" type="button" data-v="d12h">Punktezuwachs 12 h</button>
    <button class="tw" type="button" data-v="d24h">Punktezuwachs 24 h</button>
    <button class="tw" type="button" data-v="d7d">Punktezuwachs 7 Tage</button>
  </div>
  <div class="grp" id="views3" role="group" aria-label="Besiegte Gegner">

  <div class="grp" id="views2" role="group" aria-label="Ranglisten An einem Tag">
    <b>An einem Tag</b>

    <button class="tw" type="button" data-v="scavenge">Rohstoffe gesammelt</button>

<div class="bar">
  <form class="search" id="searchform" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="500|500, Spieler oder Stamm" aria-label="Suche nach Koordinate, Spieler oder Stamm"
           aria-expanded="false" aria-controls="sugg">
    <button class="tw" type="submit">Suchen</button>
    <div class="sugg" id="sugg" hidden role="listbox"></div>
  </form>
  <div class="grp" id="marks" aria-live="polite"></div>

<div class="mapwrap" id="mapwrap">
  <canvas id="c"></canvas>
  <canvas id="ov"></canvas>
  <div class="msg" id="msg" hidden></div>
  <div class="tip" id="tip"></div>
  <div class="overlay">
    <details class="legend" id="legend" hidden open>
      <summary id="legend-title">Legende</summary>

    </details>
    <div class="zoom">
      <button type="button" id="zin" title="Näher" aria-label="Näher">+</button>
      <button type="button" id="zout" title="Weiter weg" aria-label="Weiter weg">&minus;</button>
      <button type="button" id="zfit" title="Ganze Welt" aria-label="Ganze Welt">⤢</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
buildAppbar("karte", "Karte");

/* Farben je Fassung. Beim Umschalten werden sie neu gelesen, damit die Karte mitzieht. */
let GRASS, GRID, GRID_MAJOR, LABEL, C_BARB, C_BONUS, C_OTHER, C_NONE, EDGE;
const C_LOSS="#d50000";
const C_TRACKED="#1e6fff";          // Stämme, deren Tagesbeste erhoben werden, immer blau
const TRIBE_COLORS=["#e53935","#fdd835","#d81b60","#00bcd4","#fb8c00","#8e24aa","#c6ff00",
                    "#3949ab","#00e676","#6d4c41","#ff80ab","#b0bec5"];
// Reserve für selbst markierte Stämme, in dieser Reihenfolge vergeben
const EXTRA_COLORS=["#ffffff","#000000","#ff3d00","#76ff03","#18ffff","#f50057","#ffea00","#651fff"];
// Stufen des prozentualen Punktzuwachses, hergeleitet aus der gemessenen Verteilung vom 12.09.2026:
// über 1 h wachsen 11,4 % der Spieler überhaupt, über 24 h rund 39 %.
// wenig Zuwachs gelb, viel Zuwachs grün, Verlust rot.
const GROWTH_COLORS=["#fff59d","#ffeb3b","#c6ff00","#76ff03","#00e676"];
const STEPS={ d1h:[1,2,3,5], d12h:[3,6,10,18], d24h:[5,10,15,25], d7d:[10,20,35,60] };
const VIEW_LABEL={ d1h:"1 Stunde", d12h:"12 Stunden", d24h:"24 Stunden", d7d:"7 Tage" };
// Besiegte Gegner. Grau heißt keine, danach gelb über orange nach grün, weil es keine negativen Werte gibt.
// Stufen aus der Verteilung vom 12.09.2026: 58 % der Spieler haben null, p90 liegt bei 3.108.
const BASH_STEPS=[500,2500,10000,30000];
const BASH_NEW_STEPS=[100,1000,5000,20000];
const BASH_COLORS=["#ffe066","#ffa726","#c6ff00","#76ff03","#00e676"];
const isBash = v => v==="bash_all" || v==="bash_new";
// Ranglisten "An einem Tag": Farbe nach Weltrang, Stufen wie im Artefakt vom 11.09.2026
const RANK_STEPS=[10,50,100,500,2500];
const RANK_COLORS=["#00e676","#76ff03","#c6ff00","#ffeb3b","#fff59d","#9e9e9e"];
const INADAY_LABEL={ loot_res:"Rohstoffe geplündert", scavenge:"Rohstoffe gesammelt", loot_vil:"Dörfer geplündert",
                     kill_att:"Bash Angriff", kill_def:"Bash Verteidigung", kill_sup:"Bash Unterstützung",
                     conquer:"Dörfer erobert" };
// kurze Fassung für die Detailinfo, damit jede Zeile einzeilig bleibt
const INADAY_SHORT={ loot_res:"Rohst. gepl.", scavenge:"Rohst. ges.", loot_vil:"Dörfer gepl.",
                     kill_att:"Bash Angriff", kill_def:"Bash Vert.", kill_sup:"Bash Unt.", conquer:"Erobert" };
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  const v=n=>cs.getPropertyValue(n).trim();
  GRASS=v("--map-bg"); GRID=v("--map-grid"); GRID_MAJOR=v("--map-grid-major"); LABEL=v("--map-label");
  C_BARB=v("--map-barb"); C_BONUS=C_BARB;          // Bonusdörfer tragen ein Zeichen, keine eigene Farbe
  C_OTHER=v("--map-other"); C_NONE=v("--map-none"); EDGE=v("--map-edge");
}
readColors();
const isGrowth = v => !!STEPS[v];
const isRank = v => v==="loot_res" || v==="scavenge" || v==="loot_vil";

const cv=$("c"), ctx=cv.getContext("2d", {alpha:false});
const ov=$("ov"), octx=ov.getContext("2d");
const wrap=$("mapwrap"), tip=$("tip");
let W=0, H=0, dpr=1;
let V=null, P=null, A=null, T=null;
let N=0, vx=null, vy=null, vp=null, vpts=null, vb=null, vname=null, byXY=null;
let pIdx={}, allyOf=null, growth={}, arrowOf=null, bashOf=null, bashNewOf=null, refs={}, tagOf=new Map(), allyById=new Map();
let tribeColor=new Map(), tribeList=[], marks=new Map();   // selbst markierte Stämme: id -> Farbe
let inaday=new Map();                                      // player_id -> {typ: {rank, value, date}}
let rankOf={};                                             // Spielerzeile -> Weltrang in der aktiven Rangliste
let buckets=[], colorList=[];
let view="tribes", scale=2, cx=500, cy=500, hover=-1, marked=null;
let userView=false, initDone=false;
const ownView = () => { userView=true; };

/* ---------- Ansicht und Umrechnung ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 2);
  const r=wrap.getBoundingClientRect();
  W=Math.max(1, Math.round(r.width)); H=Math.max(1, Math.round(r.height));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ov.width=cv.width; ov.height=cv.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  octx.setTransform(dpr,0,0,dpr,0,0);
  if(!userView && N) fitWorld();
  draw();
}
const sx = x => (x - cx) * scale + W/2;
const sy = y => (y - cy) * scale + H/2;
const wxAt = px => (px - W/2) / scale + cx;
const wyAt = py => (py - H/2) / scale + cy;

function clampView(){
  scale=Math.min(28, Math.max(0.35, scale));
  cx=Math.min(1000, Math.max(0, cx)); cy=Math.min(1000, Math.max(0, cy));
}
function fitWorld(){
  if(!N){ scale=Math.min(W,H)/1000; cx=cy=500; return; }
  let x0=1000,y0=1000,x1=0,y1=0;
  for(let i=0;i<N;i++){ if(vx[i]<x0)x0=vx[i]; if(vx[i]>x1)x1=vx[i]; if(vy[i]<y0)y0=vy[i]; if(vy[i]>y1)y1=vy[i]; }
  const pad=6;
  scale=Math.min(W/(x1-x0+2*pad), H/(y1-y0+2*pad));
  cx=(x0+x1)/2; cy=(y0+y1)/2; clampView();
}
function zoomAt(px, py, factor){
  ownView();
  const wx=wxAt(px), wy=wyAt(py);
  scale*=factor; clampView();
  cx=wx-(px-W/2)/scale; cy=wy-(py-H/2)/scale; clampView(); draw(); saveUrl();
}

/* ---------- Zeichnen ---------- */
function drawGrid(){
  ctx.lineWidth=1;
  const sets = scale>=6 ? [[10,GRID],[100,GRID_MAJOR]] : [[100,GRID_MAJOR]];
  for(const [s,color] of sets){
    ctx.strokeStyle=color;
    ctx.beginPath();
    const x0=Math.floor(wxAt(0)/s)*s, x1=wxAt(W), y0=Math.floor(wyAt(0)/s)*s, y1=wyAt(H);
    for(let x=x0;x<=x1;x+=s){ const p=Math.round(sx(x))+.5; ctx.moveTo(p,0); ctx.lineTo(p,H); }
    for(let y=y0;y<=y1;y+=s){ const p=Math.round(sy(y))+.5; ctx.moveTo(0,p); ctx.lineTo(W,p); }
    ctx.stroke();
  }
  ctx.fillStyle=LABEL; ctx.textBaseline="top";
  ctx.font="700 13px Verdana,Geneva,sans-serif"; ctx.textAlign="left";
  const kx0=Math.max(0,Math.floor(wxAt(0)/100)), kx1=Math.min(9,Math.floor(wxAt(W)/100));
  const ky0=Math.max(0,Math.floor(wyAt(0)/100)), ky1=Math.min(9,Math.floor(wyAt(H)/100));
  for(let ky=ky0;ky<=ky1;ky++) for(let kx=kx0;kx<=kx1;kx++){
    const px=Math.min(Math.max(3, sx(kx*100)+5), sx((kx+1)*100)-28);
    const py=Math.min(Math.max(3, sy(ky*100)+3), sy((ky+1)*100)-16);
    if(px<W-26 && py<H-16 && px>-20 && py>-14) ctx.fillText("K"+ky+""+kx, px, py);
  }
  if(scale>=6){
    ctx.font="11px Verdana,Geneva,sans-serif"; ctx.fillStyle="rgba(0,0,0,.62)";
    const x0=Math.ceil(wxAt(0)/10)*10, y0=Math.ceil(wyAt(0)/10)*10;
    ctx.textAlign="center";
    for(let x=x0;x<wxAt(W);x+=10) ctx.fillText(String(x), sx(x)+scale/2, 3);
    ctx.textAlign="left";
    for(let y=y0;y<wyAt(H);y+=10) ctx.fillText(String(y), 3, sy(y)+scale/2-6);
  }
}


/** Zeichen am Dorf: Bonusdorf, hoher Bestand an besiegten Gegnern, frisch dazugekommene.
    Bewusst drei verschiedene Orte am Quadrat, damit sie sich nicht überlagern:
    Bonus unten links, Bestand als Rahmen, frischer Zuwachs als Funke oben links. */
function drawMarks(x0,x1,y0,y1,size){
  const off=(scale-size)/2;
  const r=Math.max(1.6, Math.min(3.4, scale*0.19));
  for(let i=0;i<N;i++){
    const x=vx[i], y=vy[i];
    if(x<x0||x>x1||y<y0||y>y1) continue;
    const bx=sx(x)+off, by=sy(y)+off;
    if(vb[i]){                                   // Bonusdorf: kleine Raute unten links
      ctx.fillStyle="#f2d16b"; ctx.strokeStyle="rgba(0,0,0,.65)"; ctx.lineWidth=1;
      const cx2=bx+r*0.9, cy2=by+size-r*0.9;
      ctx.beginPath();
      ctx.moveTo(cx2, cy2-r); ctx.lineTo(cx2+r, cy2); ctx.lineTo(cx2, cy2+r); ctx.lineTo(cx2-r, cy2);
      ctx.closePath(); ctx.fill(); if(r>=2.4) ctx.stroke();
    }
    const b=bashOf? bashOf[i] : 0;
    if(b){                                       // viele besiegte Gegner: leuchtender Rahmen
      ctx.strokeStyle = b>=3? "#ff3d00" : "#ffb300";
      ctx.lineWidth = b>=3? 2 : 1.5;
      ctx.strokeRect(bx-1, by-1, size+2, size+2);
    }
    const n=bashNewOf? bashNewOf[i] : 0;
    if(n>=2){                                    // frisch dazugekommen: Funke oben links
      const fx=bx-1, fy=by-1, a=Math.max(2.2, Math.min(4.5, scale*0.26));
      ctx.fillStyle = n>=3? "#ffffff" : "#ffd54f";
      ctx.beginPath();
      ctx.moveTo(fx, fy-a); ctx.lineTo(fx+a*0.32, fy-a*0.32); ctx.lineTo(fx+a, fy);
      ctx.lineTo(fx+a*0.32, fy+a*0.32); ctx.lineTo(fx, fy+a); ctx.lineTo(fx-a*0.32, fy+a*0.32);
      ctx.lineTo(fx-a, fy); ctx.lineTo(fx-a*0.32, fy-a*0.32);
      ctx.closePath(); ctx.fill();
    }
  }
}

/** Pfeile am oberen rechten Rand des Dorfes: Zuwachs des Spielers, drei Stufen je Richtung. */
function drawArrows(x0,x1,y0,y1,size){
  const h=Math.max(2.5, Math.min(5, scale*0.3)), w=h*1.1, gap=h*0.28;
  ctx.lineWidth=1;
  if(!arrowOf) return;
  for(let i=0;i<N;i++){
    const a=arrowOf[i]; if(!a) continue;
    const x=vx[i], y=vy[i];
    if(x<x0||x>x1||y<y0||y>y1) continue;
    const n=Math.abs(a), up=a>0;
    ctx.fillStyle = up? "#00c853" : "#ff1744";
    ctx.strokeStyle="rgba(0,0,0,.7)";
    let ty=sy(y)+(scale-size)/2-1;                 // Oberkante des Dorfes
    const tx=sx(x)+(scale-size)/2+size+1;          // rechts daneben
    for(let k=0;k<n;k++){
      ctx.beginPath();
      if(up){ ctx.moveTo(tx, ty); ctx.lineTo(tx+w, ty); ctx.lineTo(tx+w/2, ty-h); }
      else  { ctx.moveTo(tx, ty-h); ctx.lineTo(tx+w, ty-h); ctx.lineTo(tx+w/2, ty); }
      ctx.closePath(); ctx.fill();
      if(h>=3.5) ctx.stroke();
      ty -= h+gap;
    }
  }
}

function draw(){
  ctx.fillStyle=GRASS;
  ctx.fillRect(0,0,W,H);
  if(!N) return;
  drawGrid();
  const size=scale<2? Math.max(1, scale) : scale*0.84, off=(scale-size)/2;
  const x0=wxAt(-2), x1=wxAt(W+2), y0=wyAt(-2), y1=wyAt(H+2);
  for(let b=0;b<buckets.length;b++){
    const list=buckets[b]; if(!list.length) continue;
    ctx.fillStyle=colorList[b];
    for(let k=0;k<list.length;k++){
      const i=list[k], x=vx[i], y=vy[i];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      ctx.fillRect(sx(x)+off, sy(y)+off, size, size);
    }
  }
  if(scale>=7){
    ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.lineWidth=1;
    for(let b=0;b<buckets.length;b++) for(const i of buckets[b]){
      const x=vx[i], y=vy[i];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      ctx.strokeRect(Math.round(sx(x)+off)+.5, Math.round(sy(y)+off)+.5, Math.round(size)-1, Math.round(size)-1);
    }
  }
  if(scale>=7) drawMarks(x0,x1,y0,y1,size);
  if(scale>=8 && arrowOf) drawArrows(x0,x1,y0,y1,size);
  drawOverlay();
}

/** Zeiger und Suchtreffer liegen auf einer eigenen Ebene. Beim Bewegen der Maus wird nur sie
    neu gezeichnet, nicht die ganze Karte mit ihren rund 29.500 Feldern. */
function drawOverlay(){
  octx.clearRect(0,0,W,H);
  if(!N) return;
  const size=scale<2? Math.max(1, scale) : scale*0.84, off=(scale-size)/2;
  const x0=wxAt(-2), x1=wxAt(W+2), y0=wyAt(-2), y1=wyAt(H+2);
  if(marked && marked.size){
    octx.strokeStyle="#ffffff"; octx.lineWidth=Math.max(1.5, Math.min(2.5, scale/5));
    for(const i of marked){
      const x=vx[i], y=vy[i]; if(x<x0||x>x1||y<y0||y>y1) continue;
      octx.strokeRect(sx(x)+off-1.5, sy(y)+off-1.5, size+3, size+3);
    }
  }
  if(hover>=0){
    const bx=sx(vx[hover])+off, by=sy(vy[hover])+off, s2=Math.max(size,4);
    octx.strokeStyle="#000000"; octx.lineWidth=3;
    octx.strokeRect(bx-2.5, by-2.5, s2+5, s2+5);
    octx.strokeStyle="#ffffff"; octx.lineWidth=1.5;
    octx.strokeRect(bx-2.5, by-2.5, s2+5, s2+5);
  }
}

/* ---------- Farbzuordnung je Ansicht ---------- */
function pct(row, key){
  const d=row[pIdx["d"+key+"_points"]];
  if(d==null) return null;
  const now=row[pIdx.points], before=now-d;
  if(before<=0) return d>0? 999 : 0;
  return d/before*100;
}
function arrowWindow(){
  // Über eine Stunde bewegt sich zu wenig, als dass Pfeile etwas aussagen würden. Deshalb 24 Stunden,
  // ersatzweise 12; in einer Zuwachs-Ansicht gilt deren Fenster.
  if(isGrowth(view)) return view.slice(1);
  return refs["24h"]? "24h" : (refs["12h"]? "12h" : null);
}
function computeArrows(){
  arrowOf=new Int8Array(N); bashOf=new Int8Array(N); bashNewOf=new Int8Array(N);
  if(!P) return;
  const key=arrowWindow();
  const lvl=new Int8Array(P.rows.length), bl=new Int8Array(P.rows.length), bn=new Int8Array(P.rows.length);
  const bashKey=refs["1h"]? "1h" : (refs["12h"]? "12h" : null);
  P.rows.forEach((r,i)=>{
    if(key){
      const e=STEPS["d"+key], g=pct(r,key);
      if(g!=null) lvl[i] = g>e[3]? 3 : g>e[2]? 2 : g>e[1]? 1 : g<-e[3]? -3 : g<-e[2]? -2 : g<-e[1]? -1 : 0;
    }
    // Zeichen für besiegte Gegner: gesamt ab der oberen Spitze, frischer Zuwachs immer
    const all=r[pIdx.all]||0;
    bl[i] = all>BASH_STEPS[3]? 3 : all>BASH_STEPS[2]? 2 : 0;
    if(bashKey){
      const d=(r[pIdx["d"+bashKey+"_att"]]||0)+(r[pIdx["d"+bashKey+"_def"]]||0)+(r[pIdx["d"+bashKey+"_sup"]]||0);
      bn[i] = d>BASH_NEW_STEPS[2]? 3 : d>BASH_NEW_STEPS[1]? 2 : d>0? 1 : 0;
    }
  });
  for(let i=0;i<N;i++){
    const p=vp[i];
    arrowOf[i]= p>=0? lvl[p] : 0;
    bashOf[i]= p>=0? bl[p] : 0;
    bashNewOf[i]= p>=0? bn[p] : 0;
  }
}
function computeGrowth(){
  growth={}; rankOf={};
  if(isGrowth(view) && P){
    const key=view.slice(1);
    P.rows.forEach((r,i)=>{ const v=pct(r,key); if(v!=null) growth[i]=v; });
  } else if(isRank(view)){
    P.rows.forEach((r,i)=>{
      const e=inaday.get(r[pIdx.id]);
      if(e && e[view]) rankOf[i]=e[view].rank;
    });
  }
}
// Die Kampfwerte kommen gebündelt etwa alle drei Stunden. Ein Stundenfenster wäre meist leer,
// deshalb rechnet der Zuwachs über 24 Stunden, ersatzweise 12.
function bashWindow(){ return refs["24h"]? "24h" : (refs["12h"]? "12h" : (refs["1h"]? "1h" : null)); }
function bashValue(p){
  const r=P.rows[p];
  if(view==="bash_all") return r[pIdx.all]||0;
  const k=bashWindow();
  if(!k) return 0;
  return (r[pIdx["d"+k+"_att"]]||0)+(r[pIdx["d"+k+"_def"]]||0)+(r[pIdx["d"+k+"_sup"]]||0);
}
function tribeColorOf(id){ return marks.get(id) || tribeColor.get(id); }
function buildBuckets(){
  const map=new Map();
  const push=(color,i)=>{ let l=map.get(color); if(!l) map.set(color,l=[]); l.push(i); };
  if(view==="tribes"){
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(vb[i]? C_BONUS : C_BARB, i); continue; }
      push(tribeColorOf(allyOf[p]) || C_OTHER, i);
    }
  } else if(isRank(view)){
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const r=rankOf[p];
      if(r==null){ push(C_NONE, i); continue; }
      let s=0; while(s<RANK_STEPS.length && r>RANK_STEPS[s]) s++;
      push(RANK_COLORS[s], i);
    }
  } else if(isBash(view)){
    const steps = view==="bash_all"? BASH_STEPS : BASH_NEW_STEPS;
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const v=bashValue(p);
      if(!v){ push(C_NONE, i); continue; }
      let s=0; while(s<steps.length && v>steps[s]) s++;
      push(BASH_COLORS[s], i);
    }
  } else {
    const edges=STEPS[view];
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const g=growth[p];
      if(g==null || g===0){ push(C_NONE, i); continue; }
      if(g<0){ push(C_LOSS, i); continue; }
      let s=0; while(s<edges.length && g>edges[s]) s++;
      push(GROWTH_COLORS[s], i);
    }
  }
  const order=[C_BARB,C_BONUS,C_NONE,C_OTHER,...GROWTH_COLORS,...BASH_COLORS,...RANK_COLORS.slice().reverse(),C_LOSS,
               ...TRIBE_COLORS,C_TRACKED,...EXTRA_COLORS];
  const keys=[...map.keys()].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  colorList=keys; buckets=keys.map(k=>map.get(k));
}

  if(view==="tribes"){

    add(BASH_COLORS[steps.length],"über "+nf.format(steps[steps.length-1]));

    add(RANK_COLORS[RANK_STEPS.length],"dahinter");
    add(C_NONE,"kein Wert erfasst"); add(C_BARB,"Barbaren");
  } else {
    const e=STEPS[view];
    $("legend-title").textContent="Punktezuwachs des Spielers über "+VIEW_LABEL[view]+", in Prozent seiner Punkte";
    add(C_LOSS,"Verlust"); add(C_NONE,"kein Zuwachs");

    for(let s=1;s<e.length;s++) add(GROWTH_COLORS[s], "über "+e[s-1]+" bis "+e[s]+" %");
    add(GROWTH_COLORS[e.length],"über "+e[e.length-1]+" %");
    add(C_BARB,"Barbaren");
  }
  const key=arrowWindow(), e=key? STEPS["d"+key] : null;
  const teile=[];
  teile.push(key
    ? "Pfeile rechts oben, Punktezuwachs über "+VIEW_LABEL["d"+key]+": <b>&#9650;</b> ab "+e[1]+" %, <b>&#9650;&#9650;</b> ab "+e[2]
      +" %, <b>&#9650;&#9650;&#9650;</b> ab "+e[3]+" %, <u>&#9660;</u> entsprechend bei Verlust."
    : "Pfeile für den Punktezuwachs erscheinen ab zwölf Stunden Historie.");
  teile.push("Rahmen um das Dorf: viele besiegte Gegner (gelb ab "+nf.format(BASH_STEPS[2])
    +", rot ab "+nf.format(BASH_STEPS[3])+"). Funke links oben: zuletzt dazugekommen. Raute links unten: Bonusdorf.");
  $("legend-arrows").innerHTML = teile.join(" ") + " Zeichen erscheinen ab mittlerem Zoom.";
  const box=$("legend");
  if(box.hidden){ box.hidden=false; box.open = wrap.clientWidth>=560; }  // auf schmalen Schirmen zugeklappt
}

// Die vollständigen Ranglisten sind groß und werden erst geholt, wenn sie gebraucht werden.
let deepLoaded=false, deepLoading=null;
async function ensureDeep(){
  if(deepLoaded) return;
  if(!deepLoading) deepLoading=(async()=>{
    try{
      const d=await load("inaday");
      (d.rows||[]).forEach(([pid,type,rank,value,date])=>{
        let e=inaday.get(pid); if(!e) inaday.set(pid, e={});
        if(!e[type] || e[type].rank>rank) e[type]={rank,value,date};
      });
      deepCounts=d.counts||{};
    }catch(e){ /* Datei fehlt, solange noch kein Durchgang gelaufen ist */ }
    deepLoaded=true;
  })();
  return deepLoading;
}
let deepCounts={};

function setView(v){
  view=v;
  document.querySelectorAll("#views button, #views2 button, #views3 button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===v)));
  const apply=()=>{ computeGrowth(); computeArrows(); buildBuckets(); renderLegend(); draw(); saveUrl(); };
  if(isRank(v) && !deepLoaded){
    $("stand").textContent="Lade vollständige Rangliste …";
    ensureDeep().then(()=>{ apply(); showStand(); });
    return;
  }
  apply();
}

/* ---------- Tooltip ---------- */
function hit(px,py){
  const wx=wxAt(px), wy=wyAt(py), x=Math.round(wx), y=Math.round(wy);
  const direkt=byXY.get(x*1000+y);
  if(direkt!=null) return direkt;
  // Nichts genau unter dem Zeiger: das nächstgelegene Dorf im Umkreis nehmen. Ohne das wirkt die
  // Karte hakelig, weil zwischen den Quadraten Lücken liegen.
  const reichweite = scale>=8? 1 : (scale>=3? 1 : 2);
  const grenze = scale>=8? 0.75 : 1.4;
  let best=-1, bestD=Infinity;
  for(let dy=-reichweite;dy<=reichweite;dy++) for(let dx=-reichweite;dx<=reichweite;dx++){
    const i=byXY.get((x+dx)*1000+(y+dy));
    if(i==null) continue;
    const d=Math.hypot(vx[i]-wx, vy[i]-wy);
    if(d<bestD){ bestD=d; best=i; }
  }
  return bestD<=grenze? best : -1;
}
function trow(k, v, cls){
  const d=document.createElement("div"); d.className="row";
  const a=document.createElement("span"); a.className="k"; a.textContent=k;
  const b=document.createElement("span"); if(cls) b.className=cls; b.textContent=v;
  d.append(a,b); tip.appendChild(d);
}
function tsec(text){
  const d=document.createElement("div"); d.className="sec"; d.textContent=text; tip.appendChild(d);
}

  if(vb[i]) trow("Bonus","Bonusdorf");

  else{

      trow("Zuwachs "+(k==="7d"?"7 Tage":k.replace("h"," h")), txt, d>0?"up":(d<0?"down":"na"));
    });

  tip.style.left=Math.max(4,left)+"px"; tip.style.top=Math.max(4,top)+"px";
}

/* ---------- Stamm markieren ---------- */
function nextColor(){
  const used=new Set([...marks.values(), ...tribeColor.values()]);
  return EXTRA_COLORS.find(c=>!used.has(c)) || EXTRA_COLORS[marks.size % EXTRA_COLORS.length];
}
function addMark(id, color){
  if(!id || marks.has(id)) return;
  marks.set(id, color || nextColor());
  renderMarks(); buildBuckets(); renderLegend(); draw();
}
function renderMarks(){
  const box=$("marks"); box.replaceChildren();

/* ---------- Suche mit Vorschlägen ---------- */
function suggestions(qRaw){
  const q=qRaw.trim().toLowerCase();
  if(q.length<2) return [];
  const out=[];
  for(const a of A.rows){
    const tag=(a[2]||""), name=(a[1]||"");
    if(tag.toLowerCase().includes(q) || name.toLowerCase().includes(q))
      out.push({kind:"ally", id:a[0], label:tag||name, meta:name+" · "+nf.format(a[3])+" Mitglieder · "+nf.format(a[4])+" Dörfer", sort:-a[5]});
    if(out.length>40) break;
  }
  for(let i=0;i<P.rows.length && out.length<=60;i++){
    const r=P.rows[i];
    if(r[pIdx.name].toLowerCase().includes(q))
      out.push({kind:"player", id:r[pIdx.id], label:r[pIdx.name],
                meta:nf.format(r[pIdx.points])+" Punkte · "+(allyOf[i]? (tagOf.get(allyOf[i])||"") : "ohne Stamm"),
                sort:-r[pIdx.points]});
  }
  return out.sort((a,b)=>a.sort-b.sort).slice(0,10);
}
function renderSuggestions(){
  const box=$("sugg"), list=suggestions($("q").value);
  box.replaceChildren();
  if(!list.length){ box.hidden=true; $("q").setAttribute("aria-expanded","false"); return; }
  list.forEach(s=>{
    const d=document.createElement("div"); d.setAttribute("role","option");
    const l=document.createElement("span");
    l.textContent=(s.kind==="ally"? "Stamm " : "")+s.label;
    const m=document.createElement("span"); m.className="meta"; m.textContent=s.meta;
    d.append(l,m);
    d.addEventListener("mousedown", e=>{ e.preventDefault(); $("q").value=s.label; box.hidden=true; search(s.label); });
    box.appendChild(d);
  });
  box.hidden=false; $("q").setAttribute("aria-expanded","true");
}
function search(qRaw){
  const q=qRaw.trim(); marked=null;
  if(!q){ showStand(); draw(); return; }
  const m=q.match(/^(\d{1,3})\s*[|,; ]\s*(\d{1,3})$/);
  if(m){ ownView(); cx=+m[1]; cy=+m[2]; scale=Math.max(scale,10); clampView(); draw(); saveUrl(); return; }
  const low=q.toLowerCase();
  const ally=A.rows.find(a=>(a[2]||"").toLowerCase()===low) || A.rows.find(a=>(a[1]||"").toLowerCase()===low)
          || A.rows.find(a=>(a[2]||"").toLowerCase().includes(low));
  const player=P.rows.find(r=>r[pIdx.name].toLowerCase()===low) || P.rows.find(r=>r[pIdx.name].toLowerCase().includes(low));
  let set=new Set(), label="";
  if(player && (!ally || player[pIdx.name].toLowerCase()===low)){
    const pi=P.rows.indexOf(player);
    for(let i=0;i<N;i++) if(vp[i]===pi) set.add(i);
    label=player[pIdx.name];
    if(allyOf[pi]) addMark(allyOf[pi]);          // Stamm des Spielers gleich mit markieren
  } else if(ally){
    for(let i=0;i<N;i++) if(vp[i]>=0 && allyOf[vp[i]]===ally[0]) set.add(i);
    label=(ally[2]||ally[1]);
    addMark(ally[0]);
  }
  if(!set.size){ $("stand").textContent="Nichts gefunden zu „"+q+"“"; return; }
  marked=set; ownView();
  let mx=0, my=0;
  for(const i of set){ mx+=vx[i]; my+=vy[i]; }
  cx=mx/set.size; cy=my/set.size;
  scale=Math.max(scale, set.size>200? 3 : 8); clampView(); draw(); saveUrl();
  $("stand").textContent=label+": "+nf.format(set.size)+" Dörfer hervorgehoben";
}

/* ---------- Adresszeile ---------- */
let saveTimer=0;
function saveUrl(){
  if(!initDone) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const p=new URLSearchParams();
    if(userView){ p.set("c", Math.round(cx)+"|"+Math.round(cy)); p.set("z", scale.toFixed(2)); }
    if(view!=="tribes") p.set("v", view);
    if(marks.size) p.set("m", [...marks].map(([id,c])=>id+"-"+c.replace("#","")).join(","));
    const q=p.toString();
    history.replaceState(null,"", q? "?"+q : location.pathname);
  }, 400);
}
function readUrl(){
  const p=new URLSearchParams(location.search);
  const v=p.get("v"); if(v && (STEPS[v]||isRank(v)||isBash(v))) view=v;
  (p.get("m")||"").split(",").filter(Boolean).forEach(s=>{
    const [id,c]=s.split("-");
    if(/^\d+$/.test(id) && /^[0-9a-fA-F]{6}$/.test(c||"")) marks.set(+id, "#"+c);
  });
  const c=(p.get("c")||"").match(/^(\d{1,3})[|,](\d{1,3})$/);
  const z=parseFloat(p.get("z")), r=parseFloat(p.get("r"));
  if(c){
    cx=+c[1]; cy=+c[2];
    if(z>0) scale=z; else if(r>0) scale=Math.min(W,H)/(2*r+1); else scale=10;
    clampView(); return true;
  }
  return false;
}

  ((T.inaday_all)||(T.records)||[]).forEach(([pid,type,rank,value,date])=>{
    let e=inaday.get(pid); if(!e) inaday.set(pid, e={});
    if(!e[type] || e[type].rank>rank) e[type]={rank,value,date};
  });

  // Die erfassten Stämme immer blau, danach die punktstärksten Stämme aus der Palette
  const tracked=new Set(T.tribe_ids||[]);
  tracked.forEach(id=>tribeColor.set(id, C_TRACKED));
  tribeList=[...A.rows].filter(a=>!tracked.has(a[0])).sort((a,b)=>b[5]-a[5]).slice(0, TRIBE_COLORS.length);
  tribeList.forEach((a,i)=>tribeColor.set(a[0], TRIBE_COLORS[i]));

  document.querySelectorAll("#views button").forEach(b=>{
    const v=b.dataset.v;
    if(v!=="tribes" && !refs[v.slice(1)]){ b.disabled=true; b.title="Noch kein Vergleichsstand für dieses Zeitfenster"; }
  });
  const rankCount={};
  inaday.forEach(e=>{ for(const t in e) rankCount[t]=(rankCount[t]||0)+1; });
  document.querySelectorAll("#views2 button").forEach(b=>{
    const n=rankCount[b.dataset.v]||0;
    b.title = n? n+" Spieler mit erfasstem Wert (vollständige Liste wird beim Umschalten geladen)"
               : "Wird beim Umschalten geladen, falls schon ein Durchgang gelaufen ist";
  });

  if(readUrl()) ownView();
  resize();
  if(isGrowth(view) && !refs[view.slice(1)]) view="tribes";
  renderMarks();
  setView(view);
  initDone=true;
  new ResizeObserver(resize).observe(wrap);
  showStand();
  // Der Browser stellt den Zustand von <details> nach dem Laden wieder her, deshalb erst danach setzen
  requestAnimationFrame(()=>{ $("legend").open = wrap.clientWidth>=560; });
})();

function showStand(){
  if(!V) return;
  const src = V.source==="cache" ? "aktueller Lauf"
    : (V.source||"").startsWith("daily:") ? "Tagesarchiv vom "+fmtDay(V.source.slice(6))
    : "unbekannt";
  const b=document.createElement("b");
  b.textContent = V.data_time_utc? fmtTime(V.data_time_utc) : src;
  $("stand").replaceChildren(document.createTextNode(nf.format(N)+" Dörfer · Stand: "), b,
    document.createTextNode(V.data_time_utc? " ("+src+")" : ""));
}

/* ---------- Bedienung ---------- */
document.addEventListener("themechange", ()=>{ readColors(); if(N){ buildBuckets(); renderLegend(); } draw(); });
window.addEventListener("resize", resize);
$("zin").addEventListener("click", ()=>zoomAt(W/2,H/2,1.6));
$("zout").addEventListener("click", ()=>zoomAt(W/2,H/2,1/1.6));
$("zfit").addEventListener("click", ()=>{ marked=null; userView=false; fitWorld(); draw(); saveUrl(); });
document.querySelectorAll("#views, #views2, #views3").forEach(g=>g.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(b && !b.disabled) setView(b.dataset.v);
}));
$("searchform").addEventListener("submit", e=>{ e.preventDefault(); $("sugg").hidden=true; search($("q").value); });
$("q").addEventListener("input", renderSuggestions);
$("q").addEventListener("focus", renderSuggestions);
$("q").addEventListener("blur", ()=>setTimeout(()=>{ $("sugg").hidden=true; }, 150));
$("q").addEventListener("keydown", e=>{ if(e.key==="Escape") $("sugg").hidden=true; });

const pts=new Map();
let dragging=false, lastX=0, lastY=0, moved=0, pinch=0;
wrap.addEventListener("pointerdown", e=>{
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size>1){ dragging=false; wrap.classList.remove("drag"); return; }
  if(e.pointerType==="mouse" && e.button!==0) return;
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener("pointermove", e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,[e.clientX,e.clientY]);
  const r=wrap.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a[0]-b[0], a[1]-b[1]);
    if(pinch) zoomAt((a[0]+b[0])/2-r.left, (a[1]+b[1])/2-r.top, d/pinch);
    pinch=d; tip.style.display="none";
    return;
  }
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(dx||dy) ownView();
    moved+=Math.abs(dx)+Math.abs(dy);
    cx-=dx/scale; cy-=dy/scale; lastX=e.clientX; lastY=e.clientY;
    clampView(); draw(); saveUrl();
    tip.style.display="none"; hover=-1;
    return;
  }
  if(e.pointerType!=="mouse") return;
  const i=hit(px,py);
  if(i!==hover){ hover=i; drawOverlay(); }
  if(i>=0) showTip(i,px,py); else tip.style.display="none";
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=0;
  if(!dragging) return;
  dragging=false; wrap.classList.remove("drag");
  if(moved<6 && e.pointerType!=="mouse"){
    const r=wrap.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    const i=hit(px,py); hover=i; drawOverlay();
    if(i>=0) showTip(i,px,py); else tip.style.display="none";
  }
}
wrap.addEventListener("pointerup", endPointer);
wrap.addEventListener("pointercancel", endPointer);
wrap.addEventListener("pointerleave", e=>{ endPointer(e); tip.style.display="none"; if(hover>=0){ hover=-1; drawOverlay(); } });
wrap.addEventListener("wheel", e=>{
  e.preventDefault();
  const r=wrap.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0? 1.25 : 1/1.25);
}, {passive:false});

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  const step=60/scale;
  if(e.key==="ArrowLeft") cx-=step;
  else if(e.key==="ArrowRight") cx+=step;
  else if(e.key==="ArrowUp") cy-=step;
  else if(e.key==="ArrowDown") cy+=step;
  else if(e.key==="+"||e.key==="="){ zoomAt(W/2,H/2,1.4); return; }
  else if(e.key==="-"){ zoomAt(W/2,H/2,1/1.4); return; }
  else return;
  ownView(); e.preventDefault(); clampView(); draw(); saveUrl();
});
</script>
