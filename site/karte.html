<!doctype html>
<html lang="de" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Karte · Welt 259</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23416729'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
/* Nur was die Karte zusätzlich braucht. Farben und Formen kommen aus style.css. */
body{display:flex; flex-direction:column; overflow:hidden; background-attachment:scroll}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:5px 14px;
  padding:5px clamp(10px,3vw,18px); background:var(--panel); border-bottom:1px solid var(--edge-soft)}
.bar:last-of-type{border-bottom:1px solid var(--edge)}
.grp{display:inline-flex; align-items:center; gap:3px; flex-wrap:wrap}
.grp>b{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-right:2px}
button.tw.small{padding:2px 6px; font-size:11px}
/* Auswahl der Dorffarbe: Kategorien mit Überschrift, darin zusammenhängende Knopfreihen.
   Unter jedem Knopf ein Streifen mit seiner Farbskala. */
.vbar{align-items:flex-end; gap:6px 0; padding-block:5px 7px}
.vhead{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  line-height:1.2; align-self:center; margin-right:12px}
.vcat{display:flex; flex-wrap:wrap; align-items:flex-end; gap:4px 5px; padding:14px 12px 0; border-left:1px solid var(--edge-line);
  position:relative}
/* Überschrift absolut, damit sie nicht in die Breitenberechnung der Knopfreihe eingeht */
.vcat>b{position:absolute; top:0; left:12px; font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); white-space:nowrap; line-height:1.3}
.seg{display:inline-flex}
.seg .opt{display:flex; flex-direction:column}
.seg .opt button.tw{border-radius:0; margin-left:-1px; white-space:nowrap; position:relative}
.seg .opt:first-child button.tw{margin-left:0; border-top-left-radius:var(--radius)}
.seg .opt:last-child button.tw{border-top-right-radius:var(--radius)}
.seg .opt button.tw[aria-pressed="true"]{z-index:1}
.seg .opt button.tw.neu{font-weight:600; font-size:10.5px; padding-inline:6px}
.scale{display:block; height:5px; border:1px solid var(--edge); border-top:0; margin-left:-1px}
.seg .opt:first-child .scale{margin-left:0; border-bottom-left-radius:var(--radius)}
.seg .opt:last-child .scale{border-bottom-right-radius:var(--radius)}
.seg .opt button[aria-pressed="true"]+.scale{box-shadow:0 2px 0 var(--accent)}
@media (max-width:640px){ .vhead{display:none} .vcat{padding:14px 6px 0} .vcat>b{left:6px} .seg{flex-wrap:wrap; row-gap:3px} }
.search{display:flex; gap:5px; align-items:center; position:relative}
.search input{width:min(220px,40vw)}
.sugg{position:absolute; z-index:20; top:100%; left:0; margin-top:2px; width:min(280px,62vw);
  background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 4px 14px rgba(0,0,0,.45); max-height:230px; overflow:auto}
.sugg div{padding:3px 8px; cursor:pointer; font-size:12px; display:flex; justify-content:space-between; gap:10px}
.sugg div:hover{background:var(--row-hover)}
.sugg .meta{color:var(--muted); font-size:11px}
.mark{display:inline-flex; align-items:center; gap:5px; padding:1px 6px; border:1px solid var(--edge);
  border-radius:var(--radius); background:var(--panel-2)}
.mark .tag{font-weight:700; font-size:12px}
.mark .meta{font-size:10.5px; color:var(--muted)}
.mark .dot{width:13px; height:13px; border:1px solid rgba(0,0,0,.45); display:inline-block}
.mark input[type="color"]{width:26px; height:20px; padding:0; border:1px solid var(--edge); background:none; cursor:pointer}
.stand{font-size:11.5px; color:var(--ink-2); margin-left:auto; text-align:right}
.stand b{font-weight:700}
.mapwrap{position:relative; flex:1; min-height:0; background:var(--map-bg); touch-action:none; cursor:default}
.mapwrap.drag{cursor:grabbing}
canvas{display:block; width:100%; height:100%; position:absolute; inset:0}
#ov{pointer-events:none}
.overlay{position:absolute; inset:auto 0 0 0; display:flex; flex-wrap:wrap; align-items:flex-end;
  justify-content:space-between; gap:8px; padding:9px 10px; pointer-events:none; z-index:3}
.legend{background:var(--panel-solid); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:0 2px 8px rgba(0,0,0,.4); font-size:11.5px; max-width:min(470px,93vw); pointer-events:auto}
.legend summary{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--head-ink); background:var(--head); border-bottom:1px solid var(--edge-soft);
  padding:3px 8px; cursor:pointer; list-style-position:inside}
.legend:not([open]) summary{border-bottom:0}
.legend ul{margin:0; padding:6px 8px; list-style:none; display:flex; flex-wrap:wrap; gap:3px 12px}
.legend li{display:flex; align-items:center; gap:5px; white-space:nowrap}
.legend i{width:11px; height:11px; border:1px solid var(--map-edge); flex:none}
.legend .keys{border-top:1px solid var(--edge-line); padding:4px 8px 5px; color:var(--ink-2); margin:0;
  display:flex; flex-direction:column; gap:2px}
.legend .keys li{white-space:normal; align-items:flex-start}
.legend .keys .sym{flex:none; width:22px; display:inline-flex; justify-content:center; align-items:center; min-height:1.45em; font-size:9px}
.legend .keys .sym b{color:#00a844} .legend .keys .sym u{color:var(--bad); text-decoration:none}
.legend .keys .sym img{width:19px; height:19px}
.legend .keys .raute{width:8px; height:8px; background:#f2d16b; border:1px solid rgba(0,0,0,.65); transform:rotate(45deg)}
.legend .keys .hint{color:var(--muted); font-size:10.5px; padding-left:27px}
.zoom{display:flex; gap:5px; pointer-events:auto}
.zoom button{font:inherit; font-weight:700; font-size:15px; width:32px; height:32px; cursor:pointer;
  background:var(--btn); color:var(--ink); border:1px solid var(--edge); border-radius:var(--radius);
  box-shadow:var(--shine)}
/* Aufbau wie das Kontextmenü im Spiel: schmaler Rahmen, Titelbalken, links die Bezeichnung,
   rechts der Wert, Zeilen abwechselnd hinterlegt. */
.tip{position:absolute; z-index:5; pointer-events:none; display:none; width:max-content; max-width:min(380px,92vw);
  background:var(--panel-solid); color:var(--ink); border:1px solid var(--edge); border-radius:var(--radius);
  padding:0 0 3px; font-size:12px; line-height:1.4; box-shadow:0 4px 16px rgba(0,0,0,.5)}
[data-theme="classic"] .tip{border-width:2px; border-color:#3f2100}
.tip .th{background:var(--head); border-bottom:1px solid var(--edge); padding:3px 9px; font-weight:700;
  color:var(--head-ink)}
.tip .th span{font-weight:400; opacity:.85}
.tip .sec{padding:3px 9px 1px; font-size:9.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); border-top:1px solid var(--edge-soft); margin-top:2px}
.tip .row{display:flex; gap:20px; justify-content:space-between; padding:1.5px 9px; white-space:nowrap}
.tip .row:nth-of-type(even){background:var(--row-alt)}
.tip .row>span:last-child{font-weight:600}
.tip .k{color:var(--muted); font-weight:400}
.tip .up{color:var(--good); font-weight:700} .tip .down{color:var(--bad); font-weight:700} .tip .na{color:var(--muted)}
/* Die Zeile, nach der die Karte gerade eingefärbt ist, trägt dieselbe Farbe wie der gedrückte Knopf. */
.tip .row.cur{background:var(--btn-on); color:var(--accent-ink); box-shadow:inset 3px 0 0 var(--edge)}
.tip .row.cur .k, .tip .row.cur .up, .tip .row.cur .down, .tip .row.cur .na{color:inherit}
.tip .row.cur .k{font-weight:700}
.tip .row.cur .k::before{content:"▶ "; font-size:.8em}
.msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--ink); background:var(--panel-solid); opacity:.94; font-size:13px; padding:24px; z-index:4}
@media (max-width:640px){ .stand{width:100%; text-align:left; margin-left:0} .legend{font-size:11px} }
</style>
</head>
<body>
<header class="appbar" id="appbar"></header>

<!-- Eine einzige Auswahl für die Dorffarbe: alle Knöpfe gehören zu einer Gruppe, genau einer ist gedrückt.
     Der Farbstreifen unter jedem Knopf zeigt die Skala, die er auf die Karte legt. -->
<div class="bar vbar" id="views" role="group" aria-label="Dorffarbe nach">
  <span class="vhead">Dorffarbe<br>nach</span>
  <div class="vcat"><b>Stamm</b>
    <div class="seg"><span class="opt"><button class="tw" type="button" data-v="tribes" aria-pressed="true">Stämme</button><i class="scale" data-scale="tribes"></i></span></div>
  </div>
  <div class="vcat"><b>Punktezuwachs</b>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="d1h">1 h</button><i class="scale" data-scale="growth"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="d12h">12 h</button><i class="scale" data-scale="growth"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="d24h">24 h</button><i class="scale" data-scale="growth"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="d7d">7 Tage</button><i class="scale" data-scale="growth"></i></span>
    </div>
  </div>
  <div class="vcat"><b>Besiegte Gegner</b>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="bash_all">Gesamt</button><i class="scale" data-scale="bash_all"></i></span>
    </div>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="bash_att">Off</button><i class="scale" data-scale="bash_att"></i></span>
      <span class="opt"><button class="tw neu" type="button" data-v="bash_att_new">+ 24 h</button><i class="scale" data-scale="bash_att"></i></span>
    </div>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="bash_def">Deff</button><i class="scale" data-scale="bash_def"></i></span>
      <span class="opt"><button class="tw neu" type="button" data-v="bash_def_new">+ 24 h</button><i class="scale" data-scale="bash_def"></i></span>
    </div>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="bash_sup">Unterstützt</button><i class="scale" data-scale="bash_sup"></i></span>
      <span class="opt"><button class="tw neu" type="button" data-v="bash_sup_new">+ 24 h</button><i class="scale" data-scale="bash_sup"></i></span>
    </div>
  </div>
  <div class="vcat"><b>An einem Tag · Weltrang</b>
    <div class="seg">
      <span class="opt"><button class="tw" type="button" data-v="loot_res">Rohst. geplündert</button><i class="scale" data-scale="rank"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="scavenge">Rohst. gesammelt</button><i class="scale" data-scale="rank"></i></span>
      <span class="opt"><button class="tw" type="button" data-v="loot_vil">Dörfer geplündert</button><i class="scale" data-scale="rank"></i></span>
    </div>
  </div>
</div>

<div class="bar">
  <div class="grp" id="shape" role="group" aria-label="Darstellung">
    <b>Dörfer</b>
    <button class="tw" type="button" data-shape="quad" aria-pressed="true">Quadrate</button>
    <button class="tw" type="button" data-shape="village">Dorfbilder</button>
  </div>
  <form class="search" id="searchform" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="500|500, Spieler oder Stamm" aria-label="Suche nach Koordinate, Spieler oder Stamm"
           aria-expanded="false" aria-controls="sugg">
    <button class="tw" type="submit">Suchen</button>
    <div class="sugg" id="sugg" hidden role="listbox"></div>
  </form>
  <div class="grp" id="marks" aria-live="polite"></div>
  <p class="stand" id="stand">Lade Kartendaten …</p>
</div>

<div class="mapwrap" id="mapwrap">
  <canvas id="c"></canvas>
  <canvas id="ov"></canvas>
  <div class="msg" id="msg" hidden></div>
  <div class="tip" id="tip"></div>
  <div class="overlay">
    <details class="legend" id="legend" hidden open>
      <summary id="legend-title">Legende</summary>
      <ul id="legend-items"></ul>
      <ul class="keys" id="legend-keys"></ul>
    </details>
    <div class="zoom">
      <button type="button" id="zin" title="Näher" aria-label="Näher">+</button>
      <button type="button" id="zout" title="Weiter weg" aria-label="Weiter weg">&minus;</button>
      <button type="button" id="zfit" title="Ganze Welt" aria-label="Ganze Welt">⤢</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
buildAppbar("karte", "Karte");

/* Farben je Fassung. Beim Umschalten werden sie neu gelesen, damit die Karte mitzieht. */
let GRASS, GRID, GRID_MAJOR, LABEL, C_BARB, C_BONUS, C_OTHER, C_NONE, EDGE;
const C_LOSS="#d50000";
const C_TRACKED="#1e6fff";          // Stämme, deren Tagesbeste erhoben werden, immer blau
const TRIBE_COLORS=["#e53935","#fdd835","#d81b60","#00bcd4","#fb8c00","#8e24aa","#c6ff00",
                    "#3949ab","#00e676","#6d4c41","#ff80ab","#b0bec5"];
// Reserve für selbst markierte Stämme, in dieser Reihenfolge vergeben
const EXTRA_COLORS=["#ffffff","#000000","#ff3d00","#76ff03","#18ffff","#f50057","#ffea00","#651fff"];
// Stufen des prozentualen Punktzuwachses, hergeleitet aus der gemessenen Verteilung vom 12.09.2026:
// über 1 h wachsen 11,4 % der Spieler überhaupt, über 24 h rund 39 %.
// wenig Zuwachs gelb, viel Zuwachs grün, Verlust rot.
const GROWTH_COLORS=["#fff59d","#ffeb3b","#c6ff00","#76ff03","#00e676"];
const STEPS={ d1h:[1,2,3,5], d12h:[3,6,10,18], d24h:[5,10,15,25], d7d:[10,20,35,60] };
const VIEW_LABEL={ d1h:"1 Stunde", d12h:"12 Stunden", d24h:"24 Stunden", d7d:"7 Tage" };
// Besiegte Gegner. Grau heißt keine, danach von grün (wenig) zur Farbe der Art (viel):
// Off nach tiefrot, Deff nach tiefblau, Unterstützung nach tiefviolett, Gesamt nach dunkelbraun.
// Stufen je Art aus der Verteilung vom 15.09.2026 (Spieler mit Wert > 0), grob bei p50, p75, p90, p97:
//   Off gesamt 1.491 / 7.158 / 18.196 / 35.733, dazu in 24 h 273 / 2.015 / 6.346 / 14.795
//   Deff gesamt 418 / 1.795 / 5.505 / 16.193,   dazu in 24 h 143 / 642 / 4.260 / 17.211
//   Unt. gesamt 934 / 3.201 / 7.922 / 15.335,   dazu in 24 h 203 / 1.812 / 5.048 / 10.796
const BASH_PALETTE={
  all:["#76ff03","#ffee58","#ffa000","#a0522d","#4e2a0a"],
  att:["#76ff03","#ffea00","#ff9100","#e53935","#7f0000"],
  def:["#76ff03","#1de9b6","#00b0ff","#2962ff","#0a1a80"],
  sup:["#76ff03","#f48fb1","#e040fb","#9c27b0","#3d0066"]
};
const BASH_ART={ all:"insgesamt", att:"als Angreifer (Off)", def:"als Verteidiger (Deff)", sup:"als Unterstützer" };
const BASH={
  bash_all:    { art:"all", neu:false, steps:[500,2500,10000,30000] },
  bash_att:    { art:"att", neu:false, steps:[1500,7000,18000,35000] },
  bash_att_new:{ art:"att", neu:true,  steps:[300,2000,6000,15000] },
  bash_def:    { art:"def", neu:false, steps:[500,2000,5500,16000] },
  bash_def_new:{ art:"def", neu:true,  steps:[150,700,4000,15000] },
  bash_sup:    { art:"sup", neu:false, steps:[1000,3000,8000,15000] },
  bash_sup_new:{ art:"sup", neu:true,  steps:[200,1800,5000,10000] }
};
const isBash = v => !!BASH[v];
// Gekreuzte Äxte am Dorf: in der letzten Stunde (ersatzweise 12) mehr als so viele besiegte Gegner dazu
const AXE_STEPS=[1000,5000];
// Ausbaustufen wie im Hilfe-Wiki: 26 bis 299, 300 bis 999, 1.000 bis 2.999, 3.000 bis 8.999,
// 9.000 bis 10.999, ab 11.000. Die Zeichnung ist eine eigene, schlichte Nachbildung.
const STAGE_STEPS=[300,1000,3000,9000,11000];
const stageOf = pts => { let s=0; while(s<STAGE_STEPS.length && pts>=STAGE_STEPS[s]) s++; return s; };
let shape="quad";
// Ranglisten "An einem Tag": Farbe nach Weltrang, Stufen wie im Artefakt vom 11.09.2026
const RANK_STEPS=[10,50,100,500,2500];
const RANK_COLORS=["#00e676","#76ff03","#c6ff00","#ffeb3b","#fff59d","#9e9e9e"];
const INADAY_LABEL={ loot_res:"Rohstoffe geplündert", scavenge:"Rohstoffe gesammelt", loot_vil:"Dörfer geplündert",
                     kill_att:"Bash Angriff", kill_def:"Bash Verteidigung", kill_sup:"Bash Unterstützung",
                     conquer:"Dörfer erobert" };
// kurze Fassung für die Detailinfo, damit jede Zeile einzeilig bleibt
const INADAY_SHORT={ loot_res:"Rohst. gepl.", scavenge:"Rohst. ges.", loot_vil:"Dörfer gepl.",
                     kill_att:"Bash Angriff", kill_def:"Bash Vert.", kill_sup:"Bash Unt.", conquer:"Erobert" };
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  const v=n=>cs.getPropertyValue(n).trim();
  GRASS=v("--map-bg"); GRID=v("--map-grid"); GRID_MAJOR=v("--map-grid-major"); LABEL=v("--map-label");
  C_BARB=v("--map-barb"); C_BONUS=C_BARB;          // Bonusdörfer tragen ein Zeichen, keine eigene Farbe
  C_OTHER=v("--map-other"); C_NONE=v("--map-none"); EDGE=v("--map-edge");
}
readColors();
const isGrowth = v => !!STEPS[v];
const isRank = v => v==="loot_res" || v==="scavenge" || v==="loot_vil";

const cv=$("c"), ctx=cv.getContext("2d", {alpha:false});
const ov=$("ov"), octx=ov.getContext("2d");
const wrap=$("mapwrap"), tip=$("tip");
let W=0, H=0, dpr=1;
let V=null, P=null, A=null, T=null;
let N=0, vx=null, vy=null, vp=null, vpts=null, vb=null, vname=null, byXY=null;
let pIdx={}, allyOf=null, growth={}, arrowOf=null, bashNewOf=null, refs={}, tagOf=new Map(), allyById=new Map();
let tribeColor=new Map(), tribeList=[], marks=new Map();   // selbst markierte Stämme: id -> Farbe
let inaday=new Map();                                      // player_id -> {typ: {rank, value, date}}
let rankOf={};                                             // Spielerzeile -> Weltrang in der aktiven Rangliste
let buckets=[], colorList=[];
let view="tribes", scale=2, cx=500, cy=500, hover=-1, marked=null;
let userView=false, initDone=false;
const ownView = () => { userView=true; };

/* ---------- Ansicht und Umrechnung ---------- */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 2);
  const r=wrap.getBoundingClientRect();
  W=Math.max(1, Math.round(r.width)); H=Math.max(1, Math.round(r.height));
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ov.width=cv.width; ov.height=cv.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  octx.setTransform(dpr,0,0,dpr,0,0);
  if(!userView && N) fitWorld();
  draw();
}
const sx = x => (x - cx) * scale + W/2;
const sy = y => (y - cy) * scale + H/2;
const wxAt = px => (px - W/2) / scale + cx;
const wyAt = py => (py - H/2) / scale + cy;

function clampView(){
  scale=Math.min(28, Math.max(0.35, scale));
  cx=Math.min(1000, Math.max(0, cx)); cy=Math.min(1000, Math.max(0, cy));
}
function fitWorld(){
  if(!N){ scale=Math.min(W,H)/1000; cx=cy=500; return; }
  let x0=1000,y0=1000,x1=0,y1=0;
  for(let i=0;i<N;i++){ if(vx[i]<x0)x0=vx[i]; if(vx[i]>x1)x1=vx[i]; if(vy[i]<y0)y0=vy[i]; if(vy[i]>y1)y1=vy[i]; }
  const pad=6;
  scale=Math.min(W/(x1-x0+2*pad), H/(y1-y0+2*pad));
  cx=(x0+x1)/2; cy=(y0+y1)/2; clampView();
}
function zoomAt(px, py, factor){
  ownView();
  const wx=wxAt(px), wy=wyAt(py);
  scale*=factor; clampView();
  cx=wx-(px-W/2)/scale; cy=wy-(py-H/2)/scale; clampView(); draw(); saveUrl();
}

/* ---------- Zeichnen ---------- */
function drawGrid(){
  ctx.lineWidth=1;
  const sets = scale>=6 ? [[10,GRID],[100,GRID_MAJOR]] : [[100,GRID_MAJOR]];
  for(const [s,color] of sets){
    ctx.strokeStyle=color;
    ctx.beginPath();
    const x0=Math.floor(wxAt(0)/s)*s, x1=wxAt(W), y0=Math.floor(wyAt(0)/s)*s, y1=wyAt(H);
    for(let x=x0;x<=x1;x+=s){ const p=Math.round(sx(x))+.5; ctx.moveTo(p,0); ctx.lineTo(p,H); }
    for(let y=y0;y<=y1;y+=s){ const p=Math.round(sy(y))+.5; ctx.moveTo(0,p); ctx.lineTo(W,p); }
    ctx.stroke();
  }
  ctx.fillStyle=LABEL; ctx.textBaseline="top";
  ctx.font="700 13px Verdana,Geneva,sans-serif"; ctx.textAlign="left";
  const kx0=Math.max(0,Math.floor(wxAt(0)/100)), kx1=Math.min(9,Math.floor(wxAt(W)/100));
  const ky0=Math.max(0,Math.floor(wyAt(0)/100)), ky1=Math.min(9,Math.floor(wyAt(H)/100));
  for(let ky=ky0;ky<=ky1;ky++) for(let kx=kx0;kx<=kx1;kx++){
    const px=Math.min(Math.max(3, sx(kx*100)+5), sx((kx+1)*100)-28);
    const py=Math.min(Math.max(3, sy(ky*100)+3), sy((ky+1)*100)-16);
    if(px<W-26 && py<H-16 && px>-20 && py>-14) ctx.fillText("K"+ky+""+kx, px, py);
  }
  if(scale>=6){
    ctx.font="11px Verdana,Geneva,sans-serif"; ctx.fillStyle="rgba(0,0,0,.62)";
    const x0=Math.ceil(wxAt(0)/10)*10, y0=Math.ceil(wyAt(0)/10)*10;
    ctx.textAlign="center";
    for(let x=x0;x<wxAt(W);x+=10) ctx.fillText(String(x), sx(x)+scale/2, 3);
    ctx.textAlign="left";
    for(let y=y0;y<wyAt(H);y+=10) ctx.fillText(String(y), 3, sy(y)+scale/2-6);
  }
}



/** Dorfbild statt Quadrat, angelehnt an die sechs Ausbaustufen im Hilfe-Wiki.
    Eigene Zeichnung, keine Grafiken aus dem Spiel:
    0 einzelne Hütten, 1 Weiler mit Zaun, 2 geschlossener Wall, 3 Wall mit Toren,
    4 eckige Mauer mit Ecktürmen, 5 Festung mit Türmen und Bergfried. */
function drawVillage(cx2, cy2, r, farbe, stufe){
  const dunkel="rgba(0,0,0,.66)", hell="rgba(255,255,255,.42)";
  ctx.lineWidth=Math.max(.7, r*0.15);

  if(stufe===0){                                   // zwei kleine Hütten
    ctx.fillStyle=farbe; ctx.strokeStyle=dunkel;
    for(const [dx,dy,sk] of [[-r*.34,r*.12,.72],[r*.3,-r*.06,.92]]){
      const h=r*.62*sk, w=r*.56*sk;
      ctx.beginPath();
      ctx.moveTo(cx2+dx-w, cy2+dy+h*.55); ctx.lineTo(cx2+dx-w, cy2+dy-h*.1);
      ctx.lineTo(cx2+dx, cy2+dy-h*.85); ctx.lineTo(cx2+dx+w, cy2+dy-h*.1);
      ctx.lineTo(cx2+dx+w, cy2+dy+h*.55); ctx.closePath();
      ctx.fill(); if(r>=3.2) ctx.stroke();
    }
    return;
  }

  const ecken = stufe>=4? 8 : (stufe>=3? 6 : 0);   // ab Stufe 3 eckig, davor rund
  const rx = r*(stufe>=5? 1.02 : stufe>=4? .98 : .92), ry = rx*.82;
  const pfad = () => {
    ctx.beginPath();
    if(!ecken){ ctx.ellipse(cx2, cy2, rx, ry, 0, 0, Math.PI*2); return; }
    for(let i=0;i<ecken;i++){
      const w=(i/ecken)*Math.PI*2 - Math.PI/2;
      const px=cx2+Math.cos(w)*rx, py=cy2+Math.sin(w)*ry;
      i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath();
  };

  ctx.fillStyle=farbe; pfad(); ctx.fill();
  if(r>=2.6){ ctx.strokeStyle=dunkel; pfad(); ctx.stroke(); }

  // Innenhof, wird mit der Stufe kleiner, weil die Bebauung dichter wird
  if(stufe>=2 && r>=3){
    const f=stufe>=5? .40 : stufe>=4? .46 : .54;
    ctx.fillStyle="rgba(0,0,0,.26)";
    ctx.beginPath();
    if(!ecken) ctx.ellipse(cx2, cy2, rx*f, ry*f, 0, 0, Math.PI*2);
    else for(let i=0;i<ecken;i++){
      const w=(i/ecken)*Math.PI*2 - Math.PI/2;
      const px=cx2+Math.cos(w)*rx*f, py=cy2+Math.sin(w)*ry*f;
      i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }

  // Ecktürme ab Stufe 4
  if(stufe>=4 && r>=3.4){
    ctx.fillStyle=farbe; ctx.strokeStyle=dunkel; ctx.lineWidth=Math.max(.6, r*.1);
    const tr=Math.max(.9, r*.19);
    for(let i=0;i<ecken;i++){
      const w=(i/ecken)*Math.PI*2 - Math.PI/2;
      ctx.beginPath();
      ctx.arc(cx2+Math.cos(w)*rx, cy2+Math.sin(w)*ry, tr, 0, Math.PI*2);
      ctx.fill(); if(r>=5) ctx.stroke();
    }
  }
  // Bergfried in der Mitte der grössten Stufe
  if(stufe>=5 && r>=4){
    ctx.fillStyle=hell;
    ctx.beginPath(); ctx.arc(cx2, cy2, Math.max(1, r*.2), 0, Math.PI*2); ctx.fill();
  }
  // angedeutete Bebauung am Wall
  if(stufe>=1 && stufe<=3 && r>=4){
    ctx.fillStyle=hell;
    const n=stufe===1? 2 : 3;
    for(let i=0;i<n;i++){
      const w=(i/n)*Math.PI*2 + Math.PI/6;
      ctx.beginPath();
      ctx.arc(cx2+Math.cos(w)*rx*.42, cy2+Math.sin(w)*ry*.42, Math.max(.7, r*.13), 0, Math.PI*2);
      ctx.fill();
    }
  }
}

/** Gekreuzte Äxte, Mittelpunkt (x,y), halbe Breite a. Auch in der Legende als SVG nachgebildet. */
function drawAxes(c, x, y, a, big){
  const s=Math.SQRT1_2, h=a*0.62;
  c.lineCap="round";
  for(const dir of [1,-1]){
    // Stiel von unten nach oben außen, Klinge am oberen Ende nach außen
    const ux=dir*s, uy=-s, nx=dir*s, ny=s;
    const ex=x+ux*a*0.8, ey=y+uy*a*0.8;
    c.strokeStyle="rgba(0,0,0,.8)"; c.lineWidth=Math.max(1.6, a*0.34);
    c.beginPath(); c.moveTo(x-ux*a, y-uy*a); c.lineTo(ex, ey); c.stroke();
    c.strokeStyle="#8d5a2b"; c.lineWidth=Math.max(0.9, a*0.18);
    c.beginPath(); c.moveTo(x-ux*a, y-uy*a); c.lineTo(ex, ey); c.stroke();
    c.beginPath();
    c.moveTo(ex+ux*h*0.25, ey+uy*h*0.25);
    c.lineTo(ex+nx*h+ux*h*0.55, ey+ny*h+uy*h*0.55);
    c.lineTo(ex+nx*h-ux*h*0.75, ey+ny*h-uy*h*0.75);
    c.lineTo(ex-ux*h*0.55, ey-uy*h*0.55);
    c.closePath();
    c.fillStyle = big? "#ffffff" : "#d7dde0"; c.fill();
    c.strokeStyle="rgba(0,0,0,.8)"; c.lineWidth=Math.max(0.8, a*0.12); c.stroke();
  }
}

// Dasselbe Symbol als kleines Bild für Legende und Knöpfe
const AXES_SVG=(()=>{ const c=document.createElement("canvas"); c.width=c.height=32;
  drawAxes(c.getContext("2d"), 16, 17, 10.5, true); return "<img alt='' src='"+c.toDataURL()+"'>"; })();
const windowText = k => k==="24h"? "24 Stunden" : k==="12h"? "12 Stunden" : k==="1h"? "einer Stunde" : "";

/** Zeichen am Dorf: Bonusdorf und frisch besiegte Gegner. Die Menge besiegter Gegner steckt nur
    in der Dorffarbe der Ansichten "Besiegte Gegner", nicht zusätzlich als Rahmen.
    Bonus als Raute unten links, Kampf als gekreuzte Äxte oben links. */
function drawMarks(x0,x1,y0,y1,size){
  const off=(scale-size)/2;
  const r=Math.max(1.6, Math.min(3.4, scale*0.19));
  for(let i=0;i<N;i++){
    const x=vx[i], y=vy[i];
    if(x<x0||x>x1||y<y0||y>y1) continue;
    const bx=sx(x)+off, by=sy(y)+off;
    if(vb[i]){                                   // Bonusdorf: kleine Raute unten links
      ctx.fillStyle="#f2d16b"; ctx.strokeStyle="rgba(0,0,0,.65)"; ctx.lineWidth=1;
      const cx2=bx+r*0.9, cy2=by+size-r*0.9;
      ctx.beginPath();
      ctx.moveTo(cx2, cy2-r); ctx.lineTo(cx2+r, cy2); ctx.lineTo(cx2, cy2+r); ctx.lineTo(cx2-r, cy2);
      ctx.closePath(); ctx.fill(); if(r>=2.4) ctx.stroke();
    }
    const n=bashNewOf? bashNewOf[i] : 0;
    if(n){                                       // hier wurde gekämpft: gekreuzte Äxte oben links
      const a=Math.max(3.2, Math.min(7.5, scale*0.36)) * (n>=2? 1.2 : 1);
      drawAxes(ctx, bx+a*0.3, by+a*0.3, a, n>=2);
    }
  }
}

/** Pfeile am oberen rechten Rand des Dorfes: Zuwachs des Spielers, drei Stufen je Richtung. */
function drawArrows(x0,x1,y0,y1,size){
  const h=Math.max(2.5, Math.min(5, scale*0.3)), w=h*1.1, gap=h*0.28;
  ctx.lineWidth=1;
  if(!arrowOf) return;
  for(let i=0;i<N;i++){
    const a=arrowOf[i]; if(!a) continue;
    const x=vx[i], y=vy[i];
    if(x<x0||x>x1||y<y0||y>y1) continue;
    const n=Math.abs(a), up=a>0;
    ctx.fillStyle = up? "#00c853" : "#ff1744";
    ctx.strokeStyle="rgba(0,0,0,.7)";
    let ty=sy(y)+(scale-size)/2-1;                 // Oberkante des Dorfes
    const tx=sx(x)+(scale-size)/2+size+1;          // rechts daneben
    for(let k=0;k<n;k++){
      ctx.beginPath();
      if(up){ ctx.moveTo(tx, ty); ctx.lineTo(tx+w, ty); ctx.lineTo(tx+w/2, ty-h); }
      else  { ctx.moveTo(tx, ty-h); ctx.lineTo(tx+w, ty-h); ctx.lineTo(tx+w/2, ty); }
      ctx.closePath(); ctx.fill();
      if(h>=3.5) ctx.stroke();
      ty -= h+gap;
    }
  }
}

function draw(){
  ctx.fillStyle=GRASS;
  ctx.fillRect(0,0,W,H);
  if(!N) return;
  drawGrid();
  const size=scale<2? Math.max(1, scale) : scale*0.84, off=(scale-size)/2;
  const x0=wxAt(-2), x1=wxAt(W+2), y0=wyAt(-2), y1=wyAt(H+2);
  const alsDorf = shape==="village" && scale>=6;
  for(let b=0;b<buckets.length;b++){
    const list=buckets[b]; if(!list.length) continue;
    ctx.fillStyle=colorList[b];
    for(let k=0;k<list.length;k++){
      const i=list[k], x=vx[i], y=vy[i];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      if(alsDorf) drawVillage(sx(x)+scale/2, sy(y)+scale/2, size*0.62, colorList[b], stageOf(vpts[i]));
      else ctx.fillRect(sx(x)+off, sy(y)+off, size, size);
    }
  }
  if(scale>=7 && !alsDorf){
    ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.lineWidth=1;
    for(let b=0;b<buckets.length;b++) for(const i of buckets[b]){
      const x=vx[i], y=vy[i];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      ctx.strokeRect(Math.round(sx(x)+off)+.5, Math.round(sy(y)+off)+.5, Math.round(size)-1, Math.round(size)-1);
    }
  }
  if(scale>=7) drawMarks(x0,x1,y0,y1,size);
  if(scale>=8 && arrowOf) drawArrows(x0,x1,y0,y1,size);
  drawOverlay();
}

/** Zeiger und Suchtreffer liegen auf einer eigenen Ebene. Beim Bewegen der Maus wird nur sie
    neu gezeichnet, nicht die ganze Karte mit ihren rund 29.500 Feldern. */
function drawOverlay(){
  octx.clearRect(0,0,W,H);
  if(!N) return;
  const size=scale<2? Math.max(1, scale) : scale*0.84, off=(scale-size)/2;
  const x0=wxAt(-2), x1=wxAt(W+2), y0=wyAt(-2), y1=wyAt(H+2);
  if(marked && marked.size){
    octx.strokeStyle="#ffffff"; octx.lineWidth=Math.max(1.5, Math.min(2.5, scale/5));
    for(const i of marked){
      const x=vx[i], y=vy[i]; if(x<x0||x>x1||y<y0||y>y1) continue;
      octx.strokeRect(sx(x)+off-1.5, sy(y)+off-1.5, size+3, size+3);
    }
  }
  if(hover>=0){
    const bx=sx(vx[hover])+off, by=sy(vy[hover])+off, s2=Math.max(size,4);
    octx.strokeStyle="#000000"; octx.lineWidth=3;
    octx.strokeRect(bx-2.5, by-2.5, s2+5, s2+5);
    octx.strokeStyle="#ffffff"; octx.lineWidth=1.5;
    octx.strokeRect(bx-2.5, by-2.5, s2+5, s2+5);
  }
}

/* ---------- Farbzuordnung je Ansicht ---------- */
function pct(row, key){
  const d=row[pIdx["d"+key+"_points"]];
  if(d==null) return null;
  const now=row[pIdx.points], before=now-d;
  if(before<=0) return d>0? 999 : 0;
  return d/before*100;
}
function arrowWindow(){
  // Über eine Stunde bewegt sich zu wenig, als dass Pfeile etwas aussagen würden. Deshalb 24 Stunden,
  // ersatzweise 12; in einer Zuwachs-Ansicht gilt deren Fenster.
  if(isGrowth(view)) return view.slice(1);
  return refs["24h"]? "24h" : (refs["12h"]? "12h" : null);
}
function computeArrows(){
  arrowOf=new Int8Array(N); bashNewOf=new Int8Array(N);
  if(!P) return;
  const key=arrowWindow();
  const lvl=new Int8Array(P.rows.length), bn=new Int8Array(P.rows.length);
  const bashKey=refs["1h"]? "1h" : (refs["12h"]? "12h" : null);
  P.rows.forEach((r,i)=>{
    if(key){
      const e=STEPS["d"+key], g=pct(r,key);
      if(g!=null) lvl[i] = g>e[3]? 3 : g>e[2]? 2 : g>e[1]? 1 : g<-e[3]? -3 : g<-e[2]? -2 : g<-e[1]? -1 : 0;
    }
    // Zeichen für frisch besiegte Gegner (Äxte)
    if(bashKey){
      const d=(r[pIdx["d"+bashKey+"_att"]]||0)+(r[pIdx["d"+bashKey+"_def"]]||0)+(r[pIdx["d"+bashKey+"_sup"]]||0);
      bn[i] = d>AXE_STEPS[1]? 2 : d>AXE_STEPS[0]? 1 : 0;
    }
  });
  for(let i=0;i<N;i++){
    const p=vp[i];
    arrowOf[i]= p>=0? lvl[p] : 0;
    bashNewOf[i]= p>=0? bn[p] : 0;
  }
}
function computeGrowth(){
  growth={}; rankOf={};
  if(isGrowth(view) && P){
    const key=view.slice(1);
    P.rows.forEach((r,i)=>{ const v=pct(r,key); if(v!=null) growth[i]=v; });
  } else if(isRank(view)){
    P.rows.forEach((r,i)=>{
      const e=inaday.get(r[pIdx.id]);
      if(e && e[view]) rankOf[i]=e[view].rank;
    });
  }
}
// Die Kampfwerte kommen gebündelt etwa alle drei Stunden. Ein Stundenfenster wäre meist leer,
// deshalb rechnet der Zuwachs über 24 Stunden, ersatzweise 12.
function bashWindow(){ return refs["24h"]? "24h" : (refs["12h"]? "12h" : (refs["1h"]? "1h" : null)); }
function bashValue(p, v){
  const r=P.rows[p], cfg=BASH[v||view];
  if(!cfg.neu) return r[pIdx[cfg.art]]||0;
  const k=bashWindow();
  return k? (r[pIdx["d"+k+"_"+cfg.art]]||0) : 0;
}
function tribeColorOf(id){ return marks.get(id) || tribeColor.get(id); }
function buildBuckets(){
  const map=new Map();
  const push=(color,i)=>{ let l=map.get(color); if(!l) map.set(color,l=[]); l.push(i); };
  if(view==="tribes"){
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(vb[i]? C_BONUS : C_BARB, i); continue; }
      push(tribeColorOf(allyOf[p]) || C_OTHER, i);
    }
  } else if(isRank(view)){
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const r=rankOf[p];
      if(r==null){ push(C_NONE, i); continue; }
      let s=0; while(s<RANK_STEPS.length && r>RANK_STEPS[s]) s++;
      push(RANK_COLORS[s], i);
    }
  } else if(isBash(view)){
    const cfg=BASH[view], colors=BASH_PALETTE[cfg.art];
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const v=bashValue(p);
      if(!v){ push(C_NONE, i); continue; }
      let s=0; while(s<cfg.steps.length && v>cfg.steps[s]) s++;
      push(colors[s], i);
    }
  } else {
    const edges=STEPS[view];
    for(let i=0;i<N;i++){
      const p=vp[i];
      if(p<0){ push(C_BARB, i); continue; }
      const g=growth[p];
      if(g==null || g===0){ push(C_NONE, i); continue; }
      if(g<0){ push(C_LOSS, i); continue; }
      let s=0; while(s<edges.length && g>edges[s]) s++;
      push(GROWTH_COLORS[s], i);
    }
  }
  const order=[C_BARB,C_BONUS,C_NONE,C_OTHER,...GROWTH_COLORS,...Object.values(BASH_PALETTE).flat(),...RANK_COLORS.slice().reverse(),C_LOSS,
               ...TRIBE_COLORS,C_TRACKED,...EXTRA_COLORS];
  const keys=[...map.keys()].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  colorList=keys; buckets=keys.map(k=>map.get(k));
}

function renderLegend(){
  const items=$("legend-items");
  items.replaceChildren();
  const add=(color,text)=>{ const li=document.createElement("li"); const i=document.createElement("i");
    i.style.background=color; li.append(i, document.createTextNode(text)); items.appendChild(li); };
  if(view==="tribes"){
    $("legend-title").textContent="Stämme";
    [...marks.keys()].forEach(id=>add(marks.get(id), (tagOf.get(id)||"?")+" (gewählt)"));
    (T.tribe_ids||[]).forEach(id=>{ if(!marks.has(id)) add(C_TRACKED, (tagOf.get(id)||"?")+" (erfasst)"); });
    tribeList.forEach(a=>{ if(!marks.has(a[0]) && !(T.tribe_ids||[]).includes(a[0])) add(tribeColor.get(a[0]), a[2]||a[1]); });
    add(C_OTHER,"übrige Spieler"); add(C_BARB,"Barbaren"); add(C_BONUS,"Bonusdörfer");
  } else if(isBash(view)){
    const cfg=BASH[view], steps=cfg.steps, colors=BASH_PALETTE[cfg.art];
    $("legend-title").textContent = "Besiegte Gegner "+BASH_ART[cfg.art]
      + (cfg.neu? ", dazugekommen in "+windowText(bashWindow()) : ", Stand jetzt");
    add(C_NONE,"keine");
    add(colors[0],"bis "+nf.format(steps[0]));
    for(let s=1;s<steps.length;s++) add(colors[s], "bis "+nf.format(steps[s]));
    add(colors[steps.length],"über "+nf.format(steps[steps.length-1]));
    add(C_BARB,"Barbaren");
  } else if(isRank(view)){
    const n=deepCounts[view] || [...inaday.values()].filter(e=>e[view]).length;
    $("legend-title").textContent=INADAY_LABEL[view]+" · Platz in der Weltrangliste · "+nf.format(n)+" Spieler erfasst";
    add(RANK_COLORS[0],"Platz 1 bis 10");
    for(let s=1;s<RANK_STEPS.length;s++) add(RANK_COLORS[s], "bis Platz "+nf.format(RANK_STEPS[s]));
    add(RANK_COLORS[RANK_STEPS.length],"dahinter");
    add(C_NONE,"kein Wert erfasst"); add(C_BARB,"Barbaren");
  } else {
    const e=STEPS[view];
    $("legend-title").textContent="Punktezuwachs des Spielers über "+VIEW_LABEL[view]+", in Prozent seiner Punkte";
    add(C_LOSS,"Verlust"); add(C_NONE,"kein Zuwachs");
    add(GROWTH_COLORS[0],"bis "+e[0]+" %");
    for(let s=1;s<e.length;s++) add(GROWTH_COLORS[s], "über "+e[s-1]+" bis "+e[s]+" %");
    add(GROWTH_COLORS[e.length],"über "+e[e.length-1]+" %");
    add(C_BARB,"Barbaren");
  }
  // Zeichen am Dorf, je eine Zeile mit Symbol
  const key=arrowWindow(), e=key? STEPS["d"+key] : null;
  const axeKey=refs["1h"]? "1h" : (refs["12h"]? "12h" : null);
  const keys=$("legend-keys"); keys.replaceChildren();
  const zeile=(sym, html)=>{ const li=document.createElement("li"); const s=document.createElement("span");
    s.className="sym"; s.innerHTML=sym; const t=document.createElement("span"); t.innerHTML=html;
    li.append(s,t); keys.appendChild(li); };
  zeile("<b>&#9650;</b><u>&#9660;</u>", key
    ? "Rechts oben: Punktezuwachs über "+VIEW_LABEL["d"+key]+", ein Pfeil ab "+e[1]+" %, zwei ab "+e[2]+" %, drei ab "+e[3]+" %"
    : "Pfeile für den Punktezuwachs erscheinen ab zwölf Stunden Historie");
  if(axeKey) zeile(AXES_SVG, "Links oben: hier wurde gekämpft, über "+nf.format(AXE_STEPS[0])+" besiegte Gegner in "
    +windowText(axeKey)+" dazu (hell ab "+nf.format(AXE_STEPS[1])+")");
  zeile("<i class='raute'></i>", "Links unten: Bonusdorf");
  const hint=document.createElement("li"); hint.className="hint"; hint.textContent="Zeichen erscheinen ab mittlerem Zoom.";
  keys.appendChild(hint);
  const box=$("legend");
  if(box.hidden){ box.hidden=false; box.open = wrap.clientWidth>=560; }  // auf schmalen Schirmen zugeklappt
}

// Die vollständigen Ranglisten sind groß und werden erst geholt, wenn sie gebraucht werden.
let deepLoaded=false, deepLoading=null;
async function ensureDeep(){
  if(deepLoaded) return;
  if(!deepLoading) deepLoading=(async()=>{
    try{
      const d=await load("inaday");
      (d.rows||[]).forEach(([pid,type,rank,value,date])=>{
        let e=inaday.get(pid); if(!e) inaday.set(pid, e={});
        if(!e[type] || e[type].rank>rank) e[type]={rank,value,date};
      });
      deepCounts=d.counts||{};
    }catch(e){ /* Datei fehlt, solange noch kein Durchgang gelaufen ist */ }
    deepLoaded=true;
  })();
  return deepLoading;
}
let deepCounts={};

function setView(v){
  view=v;
  document.querySelectorAll("#views button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===v)));
  const apply=()=>{ computeGrowth(); computeArrows(); buildBuckets(); renderLegend(); draw(); saveUrl(); };
  if(isRank(v) && !deepLoaded){
    $("stand").textContent="Lade vollständige Rangliste …";
    ensureDeep().then(()=>{ apply(); showStand(); });
    return;
  }
  apply();
}

/* ---------- Tooltip ---------- */
function hit(px,py){
  const wx=wxAt(px), wy=wyAt(py), x=Math.round(wx), y=Math.round(wy);
  const direkt=byXY.get(x*1000+y);
  if(direkt!=null) return direkt;
  // Nichts genau unter dem Zeiger: das nächstgelegene Dorf im Umkreis nehmen. Ohne das wirkt die
  // Karte hakelig, weil zwischen den Quadraten Lücken liegen.
  const reichweite = scale>=8? 1 : (scale>=3? 1 : 2);
  const grenze = scale>=8? 0.75 : 1.4;
  let best=-1, bestD=Infinity;
  for(let dy=-reichweite;dy<=reichweite;dy++) for(let dx=-reichweite;dx<=reichweite;dx++){
    const i=byXY.get((x+dx)*1000+(y+dy));
    if(i==null) continue;
    const d=Math.hypot(vx[i]-wx, vy[i]-wy);
    if(d<bestD){ bestD=d; best=i; }
  }
  return bestD<=grenze? best : -1;
}
function trow(k, v, cls, cur){
  const d=document.createElement("div"); d.className=cur? "row cur" : "row";
  const a=document.createElement("span"); a.className="k"; a.textContent=k;
  const b=document.createElement("span"); if(cls) b.className=cls; b.textContent=v;
  d.append(a,b); tip.appendChild(d);
}
function tsec(text){
  const d=document.createElement("div"); d.className="sec"; d.textContent=text; tip.appendChild(d);
}
function showTip(i, px, py){
  tip.replaceChildren();
  const head=document.createElement("div"); head.className="th";
  head.textContent=vname[i]||"Dorf";
  const co=document.createElement("span");
  co.textContent=" ("+vx[i]+"|"+vy[i]+") K"+Math.floor(vy[i]/100)+Math.floor(vx[i]/100);
  head.appendChild(co); tip.appendChild(head);
  const stufen=["Hütte","Weiler","Palisade","Wall","Burg","Festung"];
  trow("Dorfpunkte", nf.format(vpts[i])+" · "+stufen[stageOf(vpts[i])]);
  if(vb[i]) trow("Bonus","Bonusdorf");
  const p=vp[i];
  if(p<0){ trow("Besitzer","Barbaren"); }
  else{
    const r=P.rows[p], aid=allyOf[p];
    trow("Besitzer", r[pIdx.name]+" ("+nf.format(r[pIdx.points])+" Punkte)");
    const av=aid? allyById.get(aid) : null;
    trow("Stamm", aid? ((tagOf.get(aid)||"?")+(av? " ("+nf.format(av[5])+" Punkte)" : "")) : "ohne Stamm");
    trow("Dörfer", nf.format(r[pIdx.villages]));
    ["1h","12h","24h","7d"].forEach(k=>{
      if(!refs[k]) return;
      const d=r[pIdx["d"+k+"_points"]];
      if(d==null) return;
      const g=pct(r,k);
      const txt=(d>0?"+":"")+nf.format(d)+(g!=null&&g<999? " ("+(g>0?"+":"")+nf1.format(g)+" %)" : "");
      trow("Zuwachs "+(k==="7d"?"7 Tage":k.replace("h"," h")), txt, d>0?"up":(d<0?"down":"na"), view==="d"+k);
    });
    tsec("Besiegte Gegner");
    trow("Gesamt", nf.format(r[pIdx.all]), null, view==="bash_all");
    const bw=bashWindow();
    [["att","Angriff (Off)"],["def","Verteidigung (Deff)"],["sup","Unterstützung"]].forEach(([art,label])=>{
      trow(label, nf.format(r[pIdx[art]]), null, view==="bash_"+art);
      if(view==="bash_"+art+"_new" && bw) trow(label+" + "+bw.replace("h"," h"), "+"+nf.format(bashValue(p)), null, true);
    });
    const e=inaday.get(r[pIdx.id]);
    // Ist die Karte nach einer Bestwert-Kategorie eingefärbt, erscheint deren Zeile immer, notfalls
    // als "kein Wert erfasst", damit sichtbar bleibt, warum das Dorf grau ist.
    const aktiv=isRank(view)? view : null;
    if(e || aktiv){
      tsec("Bester Tag (An einem Tag)");
      ["loot_res","scavenge","loot_vil","conquer","kill_att","kill_def","kill_sup"].forEach(t=>{
        const v=e&&e[t];
        if(!v){ if(t===aktiv) trow(INADAY_SHORT[t], "kein Wert erfasst", "na", true); return; }
        trow(INADAY_SHORT[t], nf.format(v.value)+" · Rang "+nf.format(v.rank)+(v.date? " ("+fmtDay(v.date)+")" : ""), null, t===aktiv);
      });
    }
  }
  tip.style.display="block";
  const r=wrap.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let left=px+14, top=py+14;
  if(left+tw>r.width-8) left=px-tw-14;
  if(top+th>r.height-8) top=Math.max(4, r.height-th-8);
  tip.style.left=Math.max(4,left)+"px"; tip.style.top=Math.max(4,top)+"px";
}

/* ---------- Stamm markieren ---------- */
function nextColor(){
  const used=new Set([...marks.values(), ...tribeColor.values()]);
  return EXTRA_COLORS.find(c=>!used.has(c)) || EXTRA_COLORS[marks.size % EXTRA_COLORS.length];
}
function addMark(id, color){
  if(!id || marks.has(id)) return;
  marks.set(id, color || nextColor());
  renderMarks(); buildBuckets(); renderLegend(); draw();
}
function renderMarks(){
  const box=$("marks"); box.replaceChildren();
  if(!marks.size) return;
  const label=document.createElement("b"); label.textContent="Markiert"; box.appendChild(label);
  for(const [id,color] of marks){
    const wrap2=document.createElement("span"); wrap2.className="pick";
    const dot=document.createElement("span"); dot.className="dot"; dot.style.background=color;
    const tag=document.createElement("span"); tag.className="tag"; tag.textContent=tagOf.get(id)||("Stamm "+id);
    const cnt=document.createElement("span"); cnt.className="meta";
    const a=allyById.get(id); if(a) cnt.textContent=nf.format(a[4])+" Dörfer";
    const inp=document.createElement("input"); inp.type="color"; inp.value=color;
    inp.title="Farbe für "+(tagOf.get(id)||id);
    inp.addEventListener("input", ()=>{ marks.set(id, inp.value); dot.style.background=inp.value;
      buildBuckets(); renderLegend(); draw(); });
    const del=document.createElement("button"); del.type="button"; del.className="tw small"; del.textContent="×";
    del.title="Markierung entfernen";
    del.addEventListener("click", ()=>{ marks.delete(id); renderMarks(); buildBuckets(); renderLegend(); draw(); });
    wrap2.append(dot, tag, cnt, inp, del);
    box.appendChild(wrap2);
  }
}

/* ---------- Suche mit Vorschlägen ---------- */
function suggestions(qRaw){
  const q=qRaw.trim().toLowerCase();
  if(q.length<2) return [];
  const out=[];
  for(const a of A.rows){
    const tag=(a[2]||""), name=(a[1]||"");
    if(tag.toLowerCase().includes(q) || name.toLowerCase().includes(q))
      out.push({kind:"ally", id:a[0], label:tag||name, meta:name+" · "+nf.format(a[3])+" Mitglieder · "+nf.format(a[4])+" Dörfer", sort:-a[5]});
    if(out.length>40) break;
  }
  for(let i=0;i<P.rows.length && out.length<=60;i++){
    const r=P.rows[i];
    if(r[pIdx.name].toLowerCase().includes(q))
      out.push({kind:"player", id:r[pIdx.id], label:r[pIdx.name],
                meta:nf.format(r[pIdx.points])+" Punkte · "+(allyOf[i]? (tagOf.get(allyOf[i])||"") : "ohne Stamm"),
                sort:-r[pIdx.points]});
  }
  return out.sort((a,b)=>a.sort-b.sort).slice(0,10);
}
function renderSuggestions(){
  const box=$("sugg"), list=suggestions($("q").value);
  box.replaceChildren();
  if(!list.length){ box.hidden=true; $("q").setAttribute("aria-expanded","false"); return; }
  list.forEach(s=>{
    const d=document.createElement("div"); d.setAttribute("role","option");
    const l=document.createElement("span");
    l.textContent=(s.kind==="ally"? "Stamm " : "")+s.label;
    const m=document.createElement("span"); m.className="meta"; m.textContent=s.meta;
    d.append(l,m);
    d.addEventListener("mousedown", e=>{ e.preventDefault(); $("q").value=s.label; box.hidden=true; search(s.label); });
    box.appendChild(d);
  });
  box.hidden=false; $("q").setAttribute("aria-expanded","true");
}
function search(qRaw){
  const q=qRaw.trim(); marked=null;
  if(!q){ showStand(); draw(); return; }
  const m=q.match(/^(\d{1,3})\s*[|,; ]\s*(\d{1,3})$/);
  if(m){ ownView(); cx=+m[1]; cy=+m[2]; scale=Math.max(scale,10); clampView(); draw(); saveUrl(); return; }
  const low=q.toLowerCase();
  const ally=A.rows.find(a=>(a[2]||"").toLowerCase()===low) || A.rows.find(a=>(a[1]||"").toLowerCase()===low)
          || A.rows.find(a=>(a[2]||"").toLowerCase().includes(low));
  const player=P.rows.find(r=>r[pIdx.name].toLowerCase()===low) || P.rows.find(r=>r[pIdx.name].toLowerCase().includes(low));
  let set=new Set(), label="";
  if(player && (!ally || player[pIdx.name].toLowerCase()===low)){
    const pi=P.rows.indexOf(player);
    for(let i=0;i<N;i++) if(vp[i]===pi) set.add(i);
    label=player[pIdx.name];
    if(allyOf[pi]) addMark(allyOf[pi]);          // Stamm des Spielers gleich mit markieren
  } else if(ally){
    for(let i=0;i<N;i++) if(vp[i]>=0 && allyOf[vp[i]]===ally[0]) set.add(i);
    label=(ally[2]||ally[1]);
    addMark(ally[0]);
  }
  if(!set.size){ $("stand").textContent="Nichts gefunden zu „"+q+"“"; return; }
  marked=set; ownView();
  let mx=0, my=0;
  for(const i of set){ mx+=vx[i]; my+=vy[i]; }
  cx=mx/set.size; cy=my/set.size;
  scale=Math.max(scale, set.size>200? 3 : 8); clampView(); draw(); saveUrl();
  $("stand").textContent=label+": "+nf.format(set.size)+" Dörfer hervorgehoben";
}

/* ---------- Adresszeile ---------- */
let saveTimer=0;
function saveUrl(){
  if(!initDone) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const p=new URLSearchParams();
    if(userView){ p.set("c", Math.round(cx)+"|"+Math.round(cy)); p.set("z", scale.toFixed(2)); }
    if(view!=="tribes") p.set("v", view);
    if(marks.size) p.set("m", [...marks].map(([id,c])=>id+"-"+c.replace("#","")).join(","));
    const q=p.toString();
    history.replaceState(null,"", q? "?"+q : location.pathname);
  }, 400);
}
function readUrl(){
  const p=new URLSearchParams(location.search);
  const v=p.get("v"); if(v && (STEPS[v]||isRank(v)||isBash(v))) view=v;
  (p.get("m")||"").split(",").filter(Boolean).forEach(s=>{
    const [id,c]=s.split("-");
    if(/^\d+$/.test(id) && /^[0-9a-fA-F]{6}$/.test(c||"")) marks.set(+id, "#"+c);
  });
  const c=(p.get("c")||"").match(/^(\d{1,3})[|,](\d{1,3})$/);
  const z=parseFloat(p.get("z")), r=parseFloat(p.get("r"));
  if(c){
    cx=+c[1]; cy=+c[2];
    if(z>0) scale=z; else if(r>0) scale=Math.min(W,H)/(2*r+1); else scale=10;
    clampView(); return true;
  }
  return false;
}

/* ---------- Laden ---------- */
async function load(name){ const r=await fetch("data/"+name+".json",{cache:"no-cache"}); if(!r.ok) throw new Error(name+": HTTP "+r.status); return r.json(); }

(async function(){
  resize();
  try{ [V,P,A,T]=await Promise.all([load("villages"),load("players"),load("allies"),load("tribe")]); }
  catch(e){
    $("msg").hidden=false;
    $("msg").textContent="Die Kartendaten konnten nicht geladen werden ("+e.message+"). Der Sammler schreibt sie bei jedem Lauf neu.";
    $("stand").textContent="Keine Kartendaten";
    return;
  }
  pIdx=Object.fromEntries(P.fields.map((f,i)=>[f,i]));
  refs=P.refs_utc||{};
  N=V.rows.length;
  vx=new Int16Array(N); vy=new Int16Array(N); vp=new Int32Array(N); vpts=new Int32Array(N);
  vb=new Uint8Array(N); vname=new Array(N); byXY=new Map();
  V.rows.forEach((r,i)=>{
    vx[i]=Math.floor(r[0]/1000); vy[i]=r[0]%1000; vp[i]=r[1]; vpts[i]=r[2]; vb[i]=r[3]; vname[i]=r[4];
    byXY.set(r[0], i);
  });
  allyOf=new Int32Array(P.rows.length);
  P.rows.forEach((r,i)=>{ allyOf[i]=r[pIdx.ally]||0; });
  A.rows.forEach(a=>{ tagOf.set(a[0], a[2]||a[1]); allyById.set(a[0], a); });

  // Werte aus "An einem Tag": erfasste Stämme und die Weltspitze je Kategorie
  ((T.inaday_all)||(T.records)||[]).forEach(([pid,type,rank,value,date])=>{
    let e=inaday.get(pid); if(!e) inaday.set(pid, e={});
    if(!e[type] || e[type].rank>rank) e[type]={rank,value,date};
  });

  // Die erfassten Stämme immer blau, danach die punktstärksten Stämme aus der Palette
  const tracked=new Set(T.tribe_ids||[]);
  tracked.forEach(id=>tribeColor.set(id, C_TRACKED));
  tribeList=[...A.rows].filter(a=>!tracked.has(a[0])).sort((a,b)=>b[5]-a[5]).slice(0, TRIBE_COLORS.length);
  tribeList.forEach((a,i)=>tribeColor.set(a[0], TRIBE_COLORS[i]));

  const rankCount={};
  inaday.forEach(e=>{ for(const t in e) rankCount[t]=(rankCount[t]||0)+1; });
  const bw=bashWindow();
  document.querySelectorAll("#views button").forEach(b=>{
    const v=b.dataset.v;
    if(isGrowth(v)){
      b.title="Punktezuwachs über "+VIEW_LABEL[v];
      if(!refs[v.slice(1)]){ b.disabled=true; b.title="Noch kein Vergleichsstand für dieses Zeitfenster"; }
    } else if(isBash(v)){
      const cfg=BASH[v];
      b.title="Besiegte Gegner "+BASH_ART[cfg.art]+(cfg.neu? ", dazugekommen in "+windowText(bw) : ", Stand jetzt");
      if(cfg.neu){
        if(bw) b.textContent="+ "+bw.replace("h"," h");
        else { b.disabled=true; b.title="Noch kein Vergleichsstand"; }
      }
    } else if(isRank(v)){
      const n=rankCount[v]||0;
      b.title = INADAY_LABEL[v]+": "+(n? n+" Spieler mit erfasstem Wert (vollständige Liste wird beim Umschalten geladen)"
                 : "wird beim Umschalten geladen, falls schon ein Durchgang gelaufen ist");
    }
  });
  // Farbstreifen unter den Knöpfen aus denselben Paletten wie die Karte
  const verlauf = cs => "linear-gradient(90deg,"+cs.join(",")+")";
  const streifen={ tribes:"linear-gradient(90deg,"+TRIBE_COLORS.slice(0,6).map((c,i)=>c+" "+(i*100/6)+"% "+((i+1)*100/6)+"%").join(",")+")",
    growth:verlauf(GROWTH_COLORS), rank:verlauf(RANK_COLORS.slice(0,5).reverse()) };
  for(const art in BASH_PALETTE) streifen["bash_"+art]=verlauf(BASH_PALETTE[art]);
  document.querySelectorAll("#views .scale").forEach(s=>{ s.style.background=streifen[s.dataset.scale]||"none"; });

  if(readUrl()) ownView();
  resize();
  if(isGrowth(view) && !refs[view.slice(1)]) view="tribes";
  if(isBash(view) && BASH[view].neu && !bashWindow()) view="tribes";
  renderMarks();
  setView(view);
  initDone=true;
  new ResizeObserver(resize).observe(wrap);
  showStand();
  // Der Browser stellt den Zustand von <details> nach dem Laden wieder her, deshalb erst danach setzen
  requestAnimationFrame(()=>{ $("legend").open = wrap.clientWidth>=560; });
})();

function showStand(){
  if(!V) return;
  const src = V.source==="cache" ? "aktueller Lauf"
    : (V.source||"").startsWith("daily:") ? "Tagesarchiv vom "+fmtDay(V.source.slice(6))
    : "unbekannt";
  const b=document.createElement("b");
  b.textContent = V.data_time_utc? fmtTime(V.data_time_utc) : src;
  $("stand").replaceChildren(document.createTextNode(nf.format(N)+" Dörfer · Stand: "), b,
    document.createTextNode(V.data_time_utc? " ("+src+")" : ""));
}

/* ---------- Bedienung ---------- */
document.addEventListener("themechange", ()=>{ readColors(); if(N){ buildBuckets(); renderLegend(); } draw(); });
window.addEventListener("resize", resize);
$("zin").addEventListener("click", ()=>zoomAt(W/2,H/2,1.6));
$("zout").addEventListener("click", ()=>zoomAt(W/2,H/2,1/1.6));
$("zfit").addEventListener("click", ()=>{ marked=null; userView=false; fitWorld(); draw(); saveUrl(); });
document.getElementById("shape").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  shape=b.dataset.shape;
  document.querySelectorAll("#shape button").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.shape===shape)));
  draw();
});
document.querySelectorAll("#views").forEach(g=>g.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(b && !b.disabled) setView(b.dataset.v);
}));
$("searchform").addEventListener("submit", e=>{ e.preventDefault(); $("sugg").hidden=true; search($("q").value); });
$("q").addEventListener("input", renderSuggestions);
$("q").addEventListener("focus", renderSuggestions);
$("q").addEventListener("blur", ()=>setTimeout(()=>{ $("sugg").hidden=true; }, 150));
$("q").addEventListener("keydown", e=>{ if(e.key==="Escape") $("sugg").hidden=true; });

const pts=new Map();
let dragging=false, lastX=0, lastY=0, moved=0, pinch=0;
wrap.addEventListener("pointerdown", e=>{
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size>1){ dragging=false; wrap.classList.remove("drag"); return; }
  if(e.pointerType==="mouse" && e.button!==0) return;
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener("pointermove", e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,[e.clientX,e.clientY]);
  const r=wrap.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a[0]-b[0], a[1]-b[1]);
    if(pinch) zoomAt((a[0]+b[0])/2-r.left, (a[1]+b[1])/2-r.top, d/pinch);
    pinch=d; tip.style.display="none";
    return;
  }
  if(dragging){
    const dx=e.clientX-lastX, dy=e.clientY-lastY;
    if(dx||dy) ownView();
    moved+=Math.abs(dx)+Math.abs(dy);
    cx-=dx/scale; cy-=dy/scale; lastX=e.clientX; lastY=e.clientY;
    clampView(); draw(); saveUrl();
    tip.style.display="none"; hover=-1;
    return;
  }
  if(e.pointerType!=="mouse") return;
  const i=hit(px,py);
  if(i!==hover){ hover=i; drawOverlay(); }
  if(i>=0) showTip(i,px,py); else tip.style.display="none";
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=0;
  if(!dragging) return;
  dragging=false; wrap.classList.remove("drag");
  if(moved<6 && e.pointerType!=="mouse"){
    const r=wrap.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    const i=hit(px,py); hover=i; drawOverlay();
    if(i>=0) showTip(i,px,py); else tip.style.display="none";
  }
}
wrap.addEventListener("pointerup", endPointer);
wrap.addEventListener("pointercancel", endPointer);
wrap.addEventListener("pointerleave", e=>{ endPointer(e); tip.style.display="none"; if(hover>=0){ hover=-1; drawOverlay(); } });
wrap.addEventListener("wheel", e=>{
  e.preventDefault();
  const r=wrap.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0? 1.25 : 1/1.25);
}, {passive:false});

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  const step=60/scale;
  if(e.key==="ArrowLeft") cx-=step;
  else if(e.key==="ArrowRight") cx+=step;
  else if(e.key==="ArrowUp") cy-=step;
  else if(e.key==="ArrowDown") cy+=step;
  else if(e.key==="+"||e.key==="="){ zoomAt(W/2,H/2,1.4); return; }
  else if(e.key==="-"){ zoomAt(W/2,H/2,1/1.4); return; }
  else return;
  ownView(); e.preventDefault(); clampView(); draw(); saveUrl();
});
</script>
