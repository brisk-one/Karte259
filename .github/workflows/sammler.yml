name: Sammler
run-name: ${{ github.event_name == 'push' && github.event.head_commit.message || (inputs.modus == 'seite' && 'Seite' || 'Lauf') }}

# Sammler-Takt (Entscheidung 8.1a, 29.10.2026): GitHub startet geplante Läufe seit 20.09. nur noch rund
# fünfmal am Tag. Deshalb bleibt ein Lauf rund 5,5 h aktiv, holt selbst einmal je Stunde ab Minute 55
# (collector/takt.py, .github/actions/stunde) und stößt am Ende seinen Nachfolger an. Der Zeitplan ist nur
# noch Rückfallebene, falls die Kette reißt; der Wächter lässt ihn aus, solange ein Lauf aktiv ist.
# Die Seite wird nach jedem Abruf über einen eigenen Lauf (modus=seite) gebaut und veröffentlicht,
# bei einem Code-Push ebenfalls, dann ohne Abruf.
on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "lauf = langer Sammellauf, seite = nur Seite bauen"
        type: choice
        options: [lauf, seite]
        default: lauf
      vorgaenger:
        description: "Lauf, der diesen als Nachfolger angestoßen hat (vom Wächter ignoriert)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "site/**"
      - "tests/**"
      - ".github/**"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  waechter:
    if: github.event_name == 'schedule' || inputs.modus == 'lauf'
    runs-on: ubuntu-latest
    outputs:
      frei: ${{ steps.check.outputs.frei }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sammler.yml/runs?per_page=50" > runs.json
          python3 - <<'EOF'
          import json, os
          eigen, vorg = "${{ github.run_id }}", "${{ inputs.vorgaenger }}"
          runs = json.load(open("runs.json"))["workflow_runs"]
          # Nur ältere Läufe zählen: starten zwei gleichzeitig, läuft der ältere und der jüngere entfällt
          ich = next(((r["created_at"], r["id"]) for r in runs if str(r["id"]) == eigen), ("9999", 0))
          aktiv = [r for r in runs
                   if r["status"] != "completed" and str(r["id"]) not in (eigen, vorg)
                   and r["event"] != "push" and r["display_title"] == "Lauf"
                   and (r["created_at"], r["id"]) < ich]
          for r in aktiv:
              print(f"Aktiv: Lauf {r['id']} ({r['event']}, {r['status']}, seit {r['run_started_at']})")
          print("Kein anderer Lauf aktiv." if not aktiv else "Dieser Lauf entfällt.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"frei={'false' if aktiv else 'true'}\n")
          EOF

  lauf:
    needs: waechter
    if: needs.waechter.outputs.frei == 'true'
    runs-on: ubuntu-latest
    # Ein Lauf am Stück, nie zwei gleichzeitig; ein wartender Nachfolger startet, sobald der Vorgänger endet
    concurrency:
      group: sammler-lauf
      cancel-in-progress: false
    # Letzter Abruf spätestens 315 min nach Start, der tägliche Ranglisten-Durchgang dauert bis zu 25 min;
    # gehostete Runner erlauben höchstens 360 min
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Rohdaten des letzten Abrufs (auch aus dem Vorgänger) mitnehmen
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: rohdaten-${{ github.run_id }}
          restore-keys: rohdaten-

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Tests Prägerechner
        run: node --test tests/praegen.test.js

      - name: Vorbereiten
        id: start
        run: |
          git config user.name "karte259-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "ende=$(date -u -d '+315 minutes' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/stunde
        continue-on-error: true
        with: {nr: 1, ende: "${{ steps.start.outputs.ende }}"}
      - uses: ./.github/actions/stunde
        continue-on-error: true
        with: {nr: 2, ende: "${{ steps.start.outputs.ende }}"}
      - uses: ./.github/actions/stunde
        continue-on-error: true
        with: {nr: 3, ende: "${{ steps.start.outputs.ende }}"}
      - uses: ./.github/actions/stunde
        continue-on-error: true
        with: {nr: 4, ende: "${{ steps.start.outputs.ende }}"}
      - uses: ./.github/actions/stunde
        continue-on-error: true
        with: {nr: 5, ende: "${{ steps.start.outputs.ende }}"}
      - uses: ./.github/actions/stunde
        continue-on-error: true
        with: {nr: 6, ende: "${{ steps.start.outputs.ende }}"}

      - name: Nachfolger anstoßen
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sammler.yml/dispatches" \
            -d '{"ref":"main","inputs":{"modus":"lauf","vorgaenger":"${{ github.run_id }}"}}'

      - name: Fehler melden
        if: ${{ !cancelled() }}
        run: |
          if [ -f .lauf-fehler ]; then
            echo "::error::Mindestens ein Abruf hat Fehler gemeldet, Details in data/status.json und data/runs.csv"
            exit 1
          fi

  seite:
    if: github.event_name == 'push' || inputs.modus == 'seite'
    runs-on: ubuntu-latest
    concurrency:
      group: seite
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      # Immer der neueste Stand von main, auch bei einem Push (Daten des Bots können neuer sein)
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: rohdaten-${{ github.run_id }}
          restore-keys: rohdaten-

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Tests Prägerechner
        run: node --test tests/praegen.test.js

      - name: Seite bauen
        run: python3 -m collector.build_site --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Nach einem Code-Push sicherstellen, dass ein Sammellauf aktiv ist (der Wächter lässt ihn sonst aus)
      - name: Sammellauf sicherstellen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sammler.yml/dispatches" \
            -d '{"ref":"main","inputs":{"modus":"lauf"}}'

  deploy:
    needs: seite
    if: always() && needs.seite.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
