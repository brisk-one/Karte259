name: Sammler

on:
  schedule:
    - cron: "55 * * * *"   # stündlich, Minute 55 (UTC), kurz nach der Serveraktualisierung (Minute 47 bis 53)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sammler
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Der tägliche Durchgang durch die vollständigen Ranglisten dauert je nach Seitengröße
    # bis zu rund 25 Minuten (Notbremse bei 500 Seiten je Kategorie).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Rohdaten des letzten Laufs mitnehmen. Ohne sie faellt die Karte bei einem Lauf ohne neue
      # Weltdaten auf das Tagesarchiv zurueck, obwohl frischere Daten schon einmal da waren.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: rohdaten-${{ github.run_id }}
          restore-keys: rohdaten-

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      - name: Daten holen
        id: run
        run: python3 -m collector.run --trigger "${{ github.event_name }}"

      - name: Daten speichern
        run: |
          git config user.name "karte259-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Speichern."
          else
            git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.event_name }})"
            for i in 1 2 3; do
              git push -q origin HEAD:main && break
              git pull -q --rebase origin main
            done
          fi

      - name: Seite bauen
        run: python3 -m collector.build_site --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Fehler melden
        if: steps.run.outputs.error == 'true'
        run: |
          echo "::error::Der Lauf hat Fehler gemeldet, Details in data/status.json"
          exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
